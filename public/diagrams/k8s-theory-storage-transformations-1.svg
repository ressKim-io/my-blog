<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" role="img" aria-labelledby="title desc"><title id="title">직렬화와 저장 변환은 서로 다른 층입니다</title><desc id="desc">쓰기에서는 codec으로 직렬화한 뒤 첫 provider로 변환하고 접두사를 붙여 etcd에 쓴다. 읽기에서는 접두사에 맞는 후보를 찾아 저장 변환을 되돌린 뒤 codec으로 오브젝트를 복원한다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#334155"/></marker></defs><rect width="800" height="640" rx="16" fill="#FAFAFA"/><g font-family="Pretendard, Apple SD Gothic Neo, system-ui, sans-serif"><text x="400" y="40" font-size="24" fill="#0A0A0A" text-anchor="middle">직렬화와 저장 변환은 서로 다른 층입니다</text><text x="224" y="96" font-size="22" fill="#27272A" text-anchor="middle">쓰기</text><text x="576" y="96" font-size="22" fill="#27272A" text-anchor="middle">읽기</text><path d="M 224 224 V 312" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><path d="M 224 400 V 488" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><path d="M 576 224 V 312" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><path d="M 576 400 V 488" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><rect x="64" y="136" width="320" height="88" rx="12" stroke="#059669" fill="#ECFDF5" stroke-width="1.5"/><text x="224.0" y="172.0" font-size="21" fill="#047857" text-anchor="middle">codec · 직렬화</text><text x="224.0" y="200.0" font-size="17" fill="#047857" text-anchor="middle">오브젝트 → 저장 형식의 바이트</text><rect x="416" y="136" width="320" height="88" rx="12" stroke="#7C3AED" fill="#F5F3FF" stroke-width="1.5"/><text x="576.0" y="172.0" font-size="21" fill="#6D28D9" text-anchor="middle">etcd</text><text x="576.0" y="200.0" font-size="17" fill="#6D28D9" text-anchor="middle">접두사가 붙은 저장 바이트</text><rect x="64" y="312" width="320" height="88" rx="12" stroke="#059669" fill="#ECFDF5" stroke-width="1.5"/><text x="224.0" y="348.0" font-size="21" fill="#047857" text-anchor="middle">첫 provider로 변환</text><text x="224.0" y="376.0" font-size="17" fill="#047857" text-anchor="middle">결과에 접두사 추가</text><rect x="416" y="312" width="320" height="88" rx="12" stroke="#059669" fill="#ECFDF5" stroke-width="1.5"/><text x="576.0" y="348.0" font-size="21" fill="#047857" text-anchor="middle">접두사에 맞는 후보 탐색</text><text x="576.0" y="376.0" font-size="17" fill="#047857" text-anchor="middle">성공한 첫 변환기로 복원</text><rect x="64" y="488" width="320" height="88" rx="12" stroke="#7C3AED" fill="#F5F3FF" stroke-width="1.5"/><text x="224.0" y="524.0" font-size="21" fill="#6D28D9" text-anchor="middle">etcd</text><text x="224.0" y="552.0" font-size="17" fill="#6D28D9" text-anchor="middle">변환한 바이트 저장</text><rect x="416" y="488" width="320" height="88" rx="12" stroke="#059669" fill="#ECFDF5" stroke-width="1.5"/><text x="576.0" y="524.0" font-size="21" fill="#047857" text-anchor="middle">codec · 디코딩</text><text x="576.0" y="552.0" font-size="17" fill="#047857" text-anchor="middle">복원한 바이트 → 오브젝트</text></g></svg>