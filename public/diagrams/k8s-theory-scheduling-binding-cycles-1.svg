<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 864" role="img" aria-labelledby="title desc"><title id="title">Pod별 노드 선택과 바인딩은 다른 구간입니다</title><desc id="desc">기본 Pod 경로에서 노드 선택 뒤 assume, Reserve, Permit을 직렬로 실행한다. 성공하면 별도 goroutine에서 WaitOnPermit의 실제 대기와 PreBind, Bind, PostBind를 진행한다. 다음 Pod의 선택은 앞 Pod의 바인딩 완료를 기다릴 필요가 없다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#334155"/></marker></defs><rect width="800" height="864" rx="16" fill="#FAFAFA"/><g font-family="Pretendard, Apple SD Gothic Neo, system-ui, sans-serif"><text x="400" y="40" font-size="24" fill="#0A0A0A" text-anchor="middle">Pod별 노드 선택과 바인딩은 다른 구간입니다</text><rect x="64" y="80" width="672" height="344" rx="16" fill="#F8FAFC" stroke="#D4D4D8"/><rect x="64" y="496" width="672" height="320" rx="16" fill="#F8FAFC" stroke="#D4D4D8"/><text x="104" y="112" font-size="20" fill="#334155" text-anchor="start">직렬 scheduling cycle</text><text x="104" y="528" font-size="20" fill="#334155" text-anchor="start">비동기 binding cycle</text><path d="M 400 224 V 296" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><path d="M 400 384 V 552" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="5 3"/><path d="M 400 632 V 704" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><rect x="160" y="136" width="480" height="88" rx="12" stroke="#059669" fill="#ECFDF5" stroke-width="1.5"/><text x="400.0" y="172.0" font-size="21" fill="#047857" text-anchor="middle">노드 선택</text><text x="400.0" y="200.0" font-size="17" fill="#047857" text-anchor="middle">PreFilter · Filter · PreScore · Score</text><rect x="160" y="296" width="480" height="88" rx="12" stroke="#7C3AED" fill="#F5F3FF" stroke-width="1.5"/><text x="400.0" y="332.0" font-size="21" fill="#6D28D9" text-anchor="middle">잠정 상태 반영·허용 판단</text><text x="400.0" y="360.0" font-size="17" fill="#6D28D9" text-anchor="middle">assume · Reserve · Permit</text><rect x="160" y="552" width="480" height="80" rx="12" stroke="#059669" fill="#ECFDF5" stroke-width="1.5"/><text x="400.0" y="584.0" font-size="21" fill="#047857" text-anchor="middle">Permit의 실제 대기</text><text x="400.0" y="612.0" font-size="17" fill="#047857" text-anchor="middle">WaitOnPermit</text><rect x="160" y="704" width="480" height="80" rx="12" stroke="#059669" fill="#ECFDF5" stroke-width="1.5"/><text x="400.0" y="736.0" font-size="21" fill="#047857" text-anchor="middle">PreBind · Bind · PostBind</text><text x="400.0" y="764.0" font-size="17" fill="#047857" text-anchor="middle">필요 작업 · API 기록 · 성공 뒤 정리</text><rect x="280" y="443" width="240" height="32" fill="#FAFAFA"/><text x="400" y="466" font-size="18" fill="#27272A" text-anchor="middle">별도 goroutine으로 시작</text></g></svg>