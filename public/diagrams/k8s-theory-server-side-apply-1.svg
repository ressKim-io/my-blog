<path d="M 544 272 H 592" fill="none" stroke="#334155" stroke-width="2"  marker-end="url(#arrow)"/>
<path d="M 544 416 H 592" fill="none" stroke="#334155" stroke-width="2"  marker-end="url(#arrow)"/>
<rect x="32" y="232" width="216" height="80" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/><text x="140.0" y="268.0" font-size="19" fill="#6D28D9" text-anchor="middle">A가 관리</text><text x="140.0" y="294.0" font-size="16" fill="#6D28D9" text-anchor="middle">replicas = 3</text>
<rect x="336" y="88" width="208" height="80" rx="10" fill="#ECFEFF" stroke="#0891B2" stroke-width="1.5"/><text x="440.0" y="124.0" font-size="19" fill="#0E7490" text-anchor="middle">B: 같은 값 Apply</text><text x="440.0" y="150.0" font-size="16" fill="#0E7490" text-anchor="middle">replicas = 3</text>
<rect x="336" y="232" width="208" height="80" rx="10" fill="#ECFEFF" stroke="#0891B2" stroke-width="1.5"/><text x="440.0" y="268.0" font-size="19" fill="#0E7490" text-anchor="middle">B: 다른 값 Apply</text><text x="440.0" y="294.0" font-size="16" fill="#0E7490" text-anchor="middle">replicas = 5</text>
<rect x="336" y="376" width="208" height="80" rx="10" fill="#ECFEFF" stroke="#0891B2" stroke-width="1.5"/><text x="440.0" y="412.0" font-size="19" fill="#0E7490" text-anchor="middle">B: 다른 값 Update</text><text x="440.0" y="438.0" font-size="16" fill="#0E7490" text-anchor="middle">replicas = 5</text>
<rect x="592" y="88" width="176" height="80" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/><text x="680.0" y="124.0" font-size="19" fill="#047857" text-anchor="middle">공동 소유</text><text x="680.0" y="150.0" font-size="16" fill="#047857" text-anchor="middle">A + B</text>
<rect x="592" y="232" width="176" height="80" rx="10" fill="#FFF1F2" stroke="#E11D48" stroke-width="1.5"/><text x="680.0" y="268.0" font-size="19" fill="#BE123C" text-anchor="middle">409 충돌</text><text x="680.0" y="294.0" font-size="16" fill="#BE123C" text-anchor="middle">force 미지정</text>
<rect x="592" y="376" width="176" height="80" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/><text x="680.0" y="412.0" font-size="19" fill="#6D28D9" text-anchor="middle">B가 소유</text><text x="680.0" y="438.0" font-size="16" fill="#6D28D9" text-anchor="middle">변경 필드 인계</text>
