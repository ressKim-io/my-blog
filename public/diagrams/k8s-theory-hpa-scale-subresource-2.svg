<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 808" role="img" aria-labelledby="title desc"><title id="title">두 API 경로가 같은 Deployment 저장 오브젝트를 갱신합니다</title><desc id="desc">GitOps는 Deployment 본체에 SSA Apply를 보내고 HPA는 Deployment scale에 일반 Update를 보낸다. 두 경로는 같은 Deployment의 replicas와 managedFields로 합쳐지며 저장 키와 resourceVersion을 공유한다. Deployment 컨트롤러의 롤아웃 배분 대상은 ReplicaSet이다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#334155"/></marker></defs><rect width="600" height="808" rx="16" fill="#FAFAFA"/><g font-family="Pretendard, Apple SD Gothic Neo, system-ui, sans-serif"><text x="300" y="40" font-size="25" fill="#0A0A0A" text-anchor="middle">경로는 둘이어도 replica 값은 하나</text><path d="M160 224 V304 H240 V384" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><path d="M440 224 V304 H360 V384" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><path d="M300 544 V648" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="112" width="240" height="112" rx="12" fill="#F8FAFC" stroke="#475569" stroke-width="1.5"/><text x="160.0" y="146" font-size="21" fill="#334155" text-anchor="middle">GitOps<tspan x="160.0" y="176" font-size="21">SSA Apply</tspan></text><rect x="320" y="112" width="240" height="112" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/><text x="440.0" y="146" font-size="21" fill="#B45309" text-anchor="middle">HPA<tspan x="440.0" y="176" font-size="21">일반 Update</tspan></text><rect x="60.0" y="260" width="200" height="28" fill="#FAFAFA"/><text x="160" y="280" font-size="21" fill="#27272A" text-anchor="middle">deployments</text><rect x="330.0" y="260" width="220" height="28" fill="#FAFAFA"/><text x="440" y="280" font-size="21" fill="#27272A" text-anchor="middle">deployments/scale</text><rect x="40" y="384" width="520" height="160" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/><text x="300.0" y="418" font-size="21" fill="#047857" text-anchor="middle">같은 Deployment 저장 오브젝트<tspan x="300.0" y="448" font-size="21">spec.replicas 값 + managedFields</tspan><tspan x="300.0" y="476" font-size="21">같은 resourceVersion과 저장 키</tspan></text><rect x="65.0" y="588" width="470" height="28" fill="#FAFAFA"/><text x="300" y="608" font-size="21" fill="#27272A" text-anchor="middle">Deployment 컨트롤러가 목표를 읽음</text><rect x="40" y="648" width="520" height="104" rx="12" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/><text x="300.0" y="682" font-size="21" fill="#6D28D9" text-anchor="middle">ReplicaSet 본체 Update<tspan x="300.0" y="712" font-size="21">ReplicaSet의 spec.replicas 갱신</tspan></text><text x="300" y="792" font-size="21" fill="#27272A" text-anchor="middle">두 API 경로의 권한과 요청 모양은 다릅니다</text></g></svg>