<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 456" role="img" aria-labelledby="title desc">
  <title id="title">ConfigMap과 Secret의 환경 변수·볼륨 전달 경로</title>
  <desc id="desc">kubelet은 ConfigMap과 Secret을 읽어 컨테이너 생성 때 환경 변수 문자열을 전달하거나 볼륨 파일을 투영합니다. 실행 중 환경 변수는 바뀌지 않지만 일반 볼륨 파일은 다시 투영할 수 있습니다</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#475569"/></marker></defs>
  <rect width="800" height="456" rx="16" fill="#FAFAFA"/>
  <g font-family="Pretendard, system-ui, sans-serif" fill="#0A0A0A">
    <text x="32" y="40" font-size="22" font-weight="700">생성 때 복사하는 값과 다시 투영할 수 있는 파일</text>
    <g fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)">
      <path d="M400 136V192"/><path d="M400 272V296H200V344"/><path d="M400 296H600V344"/>
    </g>
    <rect x="232" y="72" width="336" height="64" rx="12" fill="#FFFBEB" stroke="#D97706"/>
    <text x="400" y="112" text-anchor="middle" font-size="20" font-weight="700">ConfigMap / Secret</text>
    <text x="424" y="170" font-size="15" fill="#334155">참조한 오브젝트 조회</text>
    <rect x="232" y="192" width="336" height="80" rx="12" fill="#ECFDF5" stroke="#059669"/>
    <text x="400" y="226" text-anchor="middle" font-size="20" font-weight="700">노드의 kubelet</text>
    <text x="400" y="253" text-anchor="middle" font-size="16">가져온 데이터를 전달 경로별로 해석</text>
    <text x="48" y="326" font-size="15" fill="#334155">컨테이너 생성 때 조립</text>
    <text x="624" y="326" font-size="15" fill="#334155">Pod 재처리 때 투영</text>
    <rect x="40" y="344" width="320" height="64" rx="12" fill="#F8FAFC" stroke="#475569"/>
    <text x="200" y="383" text-anchor="middle" font-size="18">env 문자열 → 런타임</text>
    <rect x="440" y="344" width="320" height="64" rx="12" fill="#F5F3FF" stroke="#7C3AED"/>
    <text x="600" y="383" text-anchor="middle" font-size="18">볼륨 파일 → 컨테이너 경로</text>
    <text x="32" y="438" font-size="15" fill="#334155">실행 중 env는 그대로 유지 · 일반 볼륨은 재투영 가능 · subPath는 갱신 예외</text>
  </g>
</svg>
