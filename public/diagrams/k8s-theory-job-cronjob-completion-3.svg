<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 688" role="img" aria-labelledby="title desc"><title id="title">CronJob은 최근의 놓친 회차 하나를 선택합니다</title><desc id="desc">매시 실행하고 시작 기한이 없으며 컨트롤러가 15시에 복귀한다고 가정한다. 누락된 회차 중 최근 15시 하나를 선택한 뒤 시작 기한과 동시 실행 정책을 검사하여 허용되면 Job 생성을 시도한다. 지난 회차 전부를 복원하지 않는다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#334155"/></marker></defs><rect width="800" height="688" rx="16" fill="#FAFAFA"/><g font-family="Pretendard, Apple SD Gothic Neo, system-ui, sans-serif"><text x="400" y="40" font-size="23" fill="#0A0A0A" text-anchor="middle">놓친 회차 수와 생성 대상으로 고른 회차는 다릅니다</text><text x="400" y="80" font-size="17" fill="#27272A" text-anchor="middle">가정: 매시 실행 · 시작 기한 없음 · 15:00 컨트롤러 복귀</text><circle cx="80" cy="152" r="22" fill="#F8FAFC" stroke="#475569" stroke-width="1.5"/><text x="80" y="128" text-anchor="middle" font-size="17" fill="#27272A">09:00<tspan x="80" y="159" font-size="15">누락</tspan></text><circle cx="186" cy="152" r="22" fill="#F8FAFC" stroke="#475569" stroke-width="1.5"/><text x="186" y="128" text-anchor="middle" font-size="17" fill="#27272A">10:00<tspan x="186" y="159" font-size="15">누락</tspan></text><circle cx="292" cy="152" r="22" fill="#F8FAFC" stroke="#475569" stroke-width="1.5"/><text x="292" y="128" text-anchor="middle" font-size="17" fill="#27272A">11:00<tspan x="292" y="159" font-size="15">누락</tspan></text><circle cx="398" cy="152" r="22" fill="#F8FAFC" stroke="#475569" stroke-width="1.5"/><text x="398" y="128" text-anchor="middle" font-size="17" fill="#27272A">12:00<tspan x="398" y="159" font-size="15">누락</tspan></text><circle cx="504" cy="152" r="22" fill="#F8FAFC" stroke="#475569" stroke-width="1.5"/><text x="504" y="128" text-anchor="middle" font-size="17" fill="#27272A">13:00<tspan x="504" y="159" font-size="15">누락</tspan></text><circle cx="610" cy="152" r="22" fill="#F8FAFC" stroke="#475569" stroke-width="1.5"/><text x="610" y="128" text-anchor="middle" font-size="17" fill="#27272A">14:00<tspan x="610" y="159" font-size="15">누락</tspan></text><circle cx="716" cy="152" r="22" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/><text x="716" y="128" text-anchor="middle" font-size="17" fill="#27272A">15:00<tspan x="716" y="159" font-size="15">선택</tspan></text><path d="M716 174 V208 H400 V248" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><path d="M400 328 V400" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><path d="M400 488 V560" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><rect x="176" y="248" width="448" height="80" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/><text x="400.0" y="282" font-size="21" fill="#047857" text-anchor="middle">최근 회차: 15:00<tspan x="400.0" y="312" font-size="18">mostRecentScheduleTime이 선택</tspan></text><rect x="112" y="400" width="576" height="88" rx="12" fill="#F8FAFC" stroke="#475569" stroke-width="1.5"/><text x="400.0" y="434" font-size="21" fill="#334155" text-anchor="middle">시작 기한·동시 실행 정책 등 검사<tspan x="400.0" y="464" font-size="17">늦었거나 Forbid의 활성 Job이 보이면 생성하지 않음</tspan></text><rect x="176" y="560" width="448" height="80" rx="12" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/><text x="400.0" y="594" font-size="21" fill="#6D28D9" text-anchor="middle">Job 하나의 생성 시도<tspan x="400.0" y="624" font-size="18">정책이 허용할 때 API 서버에 요청</tspan></text><text x="400" y="672" font-size="17" fill="#27272A" text-anchor="middle">09:00~14:00 회차를 모두 만들어 따라잡는 방식이 아닙니다</text></g></svg>