<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 736" role="img" aria-labelledby="title desc"><title id="title">재시도할 Pod를 서로 다른 조건으로 기다립니다</title><desc id="desc">PreEnqueue를 통과하면 activeQ에서 배치를 시도한다. 실패한 Pod는 사건을 기다리는 unschedulableEntities 또는 backoffQ로 갈 수 있다. 관련 사건과 주기적 재검토, 백오프 완료가 다음 시도를 유도한다. activeQ가 비면 배치 거절용 backoffQ에서 조기 선택할 수 있으며 오류용 힙은 제외된다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#334155"/></marker></defs><rect width="800" height="736" rx="16" fill="#FAFAFA"/><g font-family="Pretendard, Apple SD Gothic Neo, system-ui, sans-serif"><text x="400" y="40" font-size="23" fill="#0A0A0A" text-anchor="middle">재시도할 Pod를 서로 다른 조건으로 기다립니다</text><text x="400" y="80" font-size="17" fill="#27272A" text-anchor="middle">기본 Pod 경로 · PreEnqueue 통과 뒤의 재시도 관계</text><path d="M 400 216 V 304" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><path d="M 400 384 V 448 H 192 V 528" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><path d="M 400 448 H 608 V 528" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><path d="M 48 572 H 24 V 172 H 248" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="5 3"/><path d="M 752 572 H 776 V 172 H 552" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="5 3"/><rect x="248" y="128" width="304" height="88" rx="12" stroke="#059669" fill="#ECFDF5" stroke-width="1.5"/><text x="400.0" y="164.0" font-size="21" fill="#047857" text-anchor="middle">activeQ</text><text x="400.0" y="192.0" font-size="17" fill="#047857" text-anchor="middle">QueueSort 순서로 선택</text><rect x="248" y="304" width="304" height="80" rx="12" stroke="#475569" fill="#F8FAFC" stroke-width="1.5"/><text x="400.0" y="336.0" font-size="21" fill="#334155" text-anchor="middle">배치 시도</text><text x="400.0" y="364.0" font-size="17" fill="#334155" text-anchor="middle">노드 선택·바인딩</text><rect x="48" y="528" width="288" height="88" rx="12" stroke="#7C3AED" fill="#F5F3FF" stroke-width="1.5"/><text x="192.0" y="564.0" font-size="21" fill="#6D28D9" text-anchor="middle">unschedulableEntities</text><text x="192.0" y="592.0" font-size="17" fill="#6D28D9" text-anchor="middle">관련 사건을 기다리는 맵</text><rect x="464" y="528" width="288" height="88" rx="12" stroke="#7C3AED" fill="#F5F3FF" stroke-width="1.5"/><text x="608.0" y="564.0" font-size="21" fill="#6D28D9" text-anchor="middle">backoffQ</text><text x="608.0" y="592.0" font-size="17" fill="#6D28D9" text-anchor="middle">배치 거절·오류의 두 힙</text><text x="160" y="248" font-size="16" fill="#27272A" text-anchor="middle">관련 사건·주기적 재검토</text><text x="656" y="248" font-size="16" fill="#27272A" text-anchor="middle">백오프 완료</text><text x="400" y="424" font-size="17" fill="#27272A" text-anchor="middle">실패 이유와 재큐잉 판단에 따라</text><text x="400" y="680" font-size="17" fill="#27272A" text-anchor="middle">activeQ가 비면 배치 거절용 backoff 항목의 조기 선택도 가능합니다</text></g></svg>