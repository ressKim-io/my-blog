<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 576" role="img" aria-labelledby="title desc">
  <title id="title">일반 마운트는 data 링크를 따르고 subPath는 이전 파일을 유지합니다</title>
  <desc id="desc">일반 마운트에서 설정 파일을 다시 열면 data 심볼릭 링크를 거쳐 새 디렉터리 B의 파일을 읽습니다. subPath는 마운트 때 해석한 A의 파일을 bind하므로 data가 B로 전환되어도 A의 파일 참조를 유지합니다</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#475569"/></marker></defs>
  <rect width="800" height="576" rx="16" fill="#FAFAFA"/>
  <g font-family="Pretendard, system-ui, sans-serif" fill="#0A0A0A">
    <text x="32" y="40" font-size="22" font-weight="700">링크를 다시 따라가는 경로와 고정된 파일 참조</text>
    <g fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)">
      <path d="M320 144H384"/><path d="M560 184V248"/><path d="M320 440H384"/>
    </g>
    <rect x="40" y="104" width="280" height="80" rx="12" fill="#ECFDF5" stroke="#059669"/>
    <text x="180" y="136" text-anchor="middle" font-size="18" font-weight="700">일반 마운트의 app.conf</text>
    <text x="180" y="165" text-anchor="middle" font-size="16">다시 열 때 링크 해석</text>
    <rect x="384" y="104" width="352" height="80" rx="12" fill="#F5F3FF" stroke="#7C3AED"/>
    <text x="560" y="136" text-anchor="middle" font-size="20" font-weight="700">..data 심볼릭 링크</text>
    <text x="560" y="165" text-anchor="middle" font-size="16">rename으로 새 대상으로 전환</text>
    <text x="584" y="220" font-size="15" fill="#334155">갱신 후 대상</text>
    <rect x="384" y="248" width="352" height="80" rx="12" fill="#ECFDF5" stroke="#059669"/>
    <text x="560" y="280" text-anchor="middle" font-size="19" font-weight="700">새 디렉터리 B / app.conf</text>
    <text x="560" y="309" text-anchor="middle" font-size="16">새로 준비한 파일 내용</text>
    <rect x="40" y="400" width="280" height="80" rx="12" fill="#FFFBEB" stroke="#D97706"/>
    <text x="180" y="432" text-anchor="middle" font-size="19" font-weight="700">subPath 마운트</text>
    <text x="180" y="461" text-anchor="middle" font-size="16">생성 때 해석한 파일에 bind</text>
    <rect x="384" y="400" width="352" height="80" rx="12" fill="#F8FAFC" stroke="#475569"/>
    <text x="560" y="432" text-anchor="middle" font-size="19" font-weight="700">이전 디렉터리 A / app.conf</text>
    <text x="560" y="461" text-anchor="middle" font-size="16">경로가 지워져도 bind 참조는 유지</text>
    <text x="32" y="532" font-size="15" fill="#334155">A/B는 시간별 디렉터리를 나타내는 기호입니다 · 원자성은 ..data 링크 전환의 범위입니다</text>
    <text x="32" y="558" font-size="15" fill="#334155">여러 파일을 따로 읽는 과정 전체의 동일 버전까지 보장하지는 않습니다</text>
  </g>
</svg>
