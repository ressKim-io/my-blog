<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1080" role="img" aria-labelledby="title desc"><title id="title">iptables ClusterIP 첫 NAT 바인딩의 선택 경로</title><desc id="desc">일반적인 IPv4 iptables ClusterIP의 새 NAT 바인딩을 만드는 경로다. 수신 패킷의 nat PREROUTING과 로컬 생성 패킷의 nat OUTPUT은 모두 KUBE-SERVICES로 진입한다. Service별 KUBE-SVC 체인에서 백엔드를 선택하고 endpoint별 KUBE-SEP 체인의 DNAT 규칙에서 실제 목적지 주소와 포트를 바꾼다. 유지 중인 흐름의 후속 패킷은 이 규칙 선택을 반복하지 않고 conntrack NAT 바인딩을 사용하지만 filter 처리와 주소 변환이 모두 사라지는 것은 아니다. 정책과 세션 affinity의 별도 분기는 생략한다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#334155"/></marker></defs><rect width="600" height="1080" rx="16" fill="#FAFAFA"/><g font-family="Pretendard, Apple SD Gothic Neo, system-ui, sans-serif"><text x="300" y="40" font-size="24" fill="#0A0A0A" text-anchor="middle">새 NAT 바인딩의 백엔드 선택</text><text x="300" y="80" font-size="21" fill="#27272A" text-anchor="middle">Linux kube-proxy · iptables · 일반 ClusterIP</text><path d="M156 272 V344 H300 V416" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><path d="M444 272 V344 H300" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="144" width="248" height="128" rx="12" fill="#F8FAFC" stroke="#475569" stroke-width="1.5"/><text x="156.0" y="178" font-size="21" fill="#334155" text-anchor="middle">수신 패킷</text><text x="156.0" y="208" font-size="21" fill="#27272A" text-anchor="middle">nat / PREROUTING</text><rect x="320" y="144" width="248" height="128" rx="12" fill="#F8FAFC" stroke="#475569" stroke-width="1.5"/><text x="444.0" y="178" font-size="21" fill="#334155" text-anchor="middle">로컬 생성 패킷</text><text x="444.0" y="208" font-size="21" fill="#27272A" text-anchor="middle">nat / OUTPUT</text><rect x="40" y="416" width="520" height="104" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/><text x="300.0" y="450" font-size="21" fill="#B45309" text-anchor="middle">KUBE-SERVICES</text><text x="300.0" y="480" font-size="21" fill="#27272A" text-anchor="middle">목적지 Service를 찾기</text><path d="M300 520 V616" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><rect x="60.0" y="556" width="480" height="28" fill="#FAFAFA"/><text x="300" y="576" font-size="21" fill="#27272A" text-anchor="middle">해당 Service의 처리 체인으로</text><rect x="40" y="616" width="520" height="104" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/><text x="300.0" y="650" font-size="21" fill="#B45309" text-anchor="middle">KUBE-SVC-…</text><text x="300.0" y="680" font-size="21" fill="#27272A" text-anchor="middle">백엔드 선택 · 별도 정책 분기는 생략</text><path d="M300 720 V816" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><rect x="60.0" y="756" width="480" height="28" fill="#FAFAFA"/><text x="300" y="776" font-size="21" fill="#27272A" text-anchor="middle">선택한 endpoint의 체인으로</text><rect x="40" y="816" width="520" height="132" rx="12" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/><text x="300.0" y="850" font-size="21" fill="#6D28D9" text-anchor="middle">KUBE-SEP-…</text><text x="300.0" y="880" font-size="21" fill="#27272A" text-anchor="middle">DNAT --to-destination</text><text x="300.0" y="908" font-size="21" fill="#27272A" text-anchor="middle">여기서 실제 목적지 주소·포트로 변환</text><text x="300" y="1016" font-size="21" fill="#27272A" text-anchor="middle">후속 패킷은 유지 중인 NAT 바인딩을 재사용</text></g></svg>