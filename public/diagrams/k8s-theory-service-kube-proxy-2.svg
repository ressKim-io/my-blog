<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 648" role="img" aria-labelledby="iptables-choice-title iptables-choice-desc">
  <title id="iptables-choice-title">iptables의 세 백엔드 확률 선택</title>
  <desc id="iptables-choice-desc">세 백엔드를 둔 개념 예입니다. 첫 규칙은 3분의 1로 선택하고, 남은 요청은 두 번째 규칙에서 2분의 1로 선택하며, 마지막 규칙은 남은 요청을 모두 받습니다. 각 백엔드의 기대 선택 비율은 3분의 1입니다</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#475569"/></marker></defs>
  <rect width="560" height="648" rx="16" fill="#FAFAFA"/>
  <g font-family="Pretendard, system-ui, sans-serif" text-anchor="middle" fill="#0A0A0A">
    <text x="280" y="40" font-size="24" font-weight="700">부하를 재지 않고 확률로 백엔드를 고릅니다</text>
    <text x="280" y="76" font-size="20">세 백엔드를 둔 iptables 기본 선택의 개념 예</text>
    <g stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M320 168H400"/><path d="M320 344H400"/><path d="M320 520H400"/><path d="M176 216V296"/><path d="M176 392V472"/></g>
    <g fill="#FFFBEB" stroke="#D97706"><rect x="32" y="120" width="288" height="96" rx="12"/><rect x="32" y="296" width="288" height="96" rx="12"/><rect x="32" y="472" width="288" height="96" rx="12"/></g>
    <g fill="#ECFDF5" stroke="#059669"><rect x="400" y="136" width="128" height="64" rx="12"/><rect x="400" y="312" width="128" height="64" rx="12"/><rect x="400" y="488" width="128" height="64" rx="12"/></g>
    <text x="176" y="158" font-size="22" font-weight="700">첫 규칙: 1/3<tspan x="176" dy="32" font-size="20" font-weight="400">전체 요청 중 1/3 선택</tspan></text>
    <text x="176" y="334" font-size="22" font-weight="700">둘째 규칙: 1/2<tspan x="176" dy="32" font-size="20" font-weight="400">남은 2/3 중 절반 선택</tspan></text>
    <text x="176" y="510" font-size="22" font-weight="700">마지막 규칙: 무조건<tspan x="176" dy="32" font-size="20" font-weight="400">전체 요청 중 남은 1/3</tspan></text>
    <text x="464" y="176" font-size="20">백엔드 1</text><text x="464" y="352" font-size="20">백엔드 2</text><text x="464" y="528" font-size="20">백엔드 3</text>
    <rect x="328" y="148" width="64" height="28" fill="#FAFAFA"/><text x="360" y="168" font-size="20">매치</text>
    <rect x="328" y="324" width="64" height="28" fill="#FAFAFA"/><text x="360" y="344" font-size="20">매치</text>
    <rect x="328" y="500" width="64" height="28" fill="#FAFAFA"/><text x="360" y="520" font-size="20">매치</text>
    <rect x="88" y="244" width="176" height="28" fill="#FAFAFA"/><text x="176" y="264" font-size="20">매치하지 않은 요청</text>
    <rect x="88" y="420" width="176" height="28" fill="#FAFAFA"/><text x="176" y="440" font-size="20">매치하지 않은 요청</text>
    <text x="280" y="616" font-size="20">연결별 실제 분배량·응답 시간의 균등 보장은 아닙니다</text>
  </g>
</svg>
