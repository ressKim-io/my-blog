<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 840" role="img" aria-labelledby="title desc"><title id="title">축출 발동 전 대기와 컨테이너 종료 유예</title><desc id="desc">hard는 soft의 부족 상태 지속 대기를 두지 않으며 종료 override는 1초다. soft는 부족 상태 지속 기간을 검사한 뒤 max와 Pod 종료 유예 중 작은 값을 사용한다. Pod 선택 후 preStop 대기와 런타임 StopContainer 요청을 순서대로 처리하며 총 종료 시간을 보장하지 않는다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#334155"/></marker></defs><rect width="800" height="840" rx="16" fill="#FAFAFA"/><g font-family="Pretendard, Apple SD Gothic Neo, system-ui, sans-serif"><text x="400" y="40" font-size="23" fill="#0A0A0A" text-anchor="middle">축출의 두 대기 시간을 나눠 봅니다</text><text x="400" y="80" font-size="19" fill="#27272A" text-anchor="middle">① 축출 발동 전: 부족 상태가 얼마나 이어졌는가</text><path d="M208 256 V 328 H400 V 368" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><path d="M592 256 V328 H400" fill="none" stroke="#334155" stroke-width="2"/><rect x="56" y="120" width="304" height="136" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/><text x="208.0" y="154" font-size="21" fill="#B45309" text-anchor="middle">hard<tspan x="208.0" y="184" font-size="18">임계값 조건 만족</tspan><tspan x="208.0" y="212" font-size="18">soft 지속 대기 없음</tspan><tspan x="208.0" y="240" font-size="18">종료 override: 1초</tspan></text><rect x="440" y="120" width="304" height="136" rx="12" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/><text x="592.0" y="154" font-size="21" fill="#6D28D9" text-anchor="middle">soft<tspan x="592.0" y="184" font-size="17">설정한 기간 동안 부족 지속</tspan><tspan x="592.0" y="212" font-size="17">max와 Pod 유예 중 작은 값</tspan><tspan x="592.0" y="240" font-size="17">종료 max 기본값: 0초</tspan></text><text x="400" y="304" font-size="18" fill="#27272A" text-anchor="middle">발동 조건을 만족하면 축출할 Pod 선택</text><rect x="176" y="368" width="448" height="80" rx="12" fill="#F8FAFC" stroke="#475569" stroke-width="1.5"/><text x="400.0" y="402" font-size="21" fill="#334155" text-anchor="middle">이번 축출의 종료 유예<tspan x="400.0" y="432" font-size="18">원래 유예를 override로 대체</tspan></text><path d="M400 448 V 528" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><path d="M400 616 V 688" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><rect x="65.0" y="468" width="670" height="28" fill="#FAFAFA"/><text x="400" y="488" font-size="19" fill="#27272A" text-anchor="middle">② Pod 선택 후: 컨테이너가 종료하도록 주는 시간</text><rect x="144" y="528" width="512" height="88" rx="12" fill="#F8FAFC" stroke="#475569" stroke-width="1.5"/><text x="400.0" y="562" font-size="21" fill="#334155" text-anchor="middle">preStop이 있고 유예가 양수이면 시도<tspan x="400.0" y="592" font-size="18">hook을 기다린 시간을 남은 유예에서 차감</tspan></text><rect x="245.0" y="636" width="310" height="28" fill="#FAFAFA"/><text x="400" y="656" font-size="18" fill="#27272A" text-anchor="middle">남은 값에 최소 2초를 적용</text><rect x="176" y="688" width="448" height="80" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/><text x="400.0" y="722" font-size="21" fill="#047857" text-anchor="middle">런타임에 StopContainer 요청<tspan x="400.0" y="752" font-size="18">컨테이너 종료 유예를 전달</tspan></text><text x="400" y="808" font-size="18" fill="#0A0A0A" text-anchor="middle">1초·2초는 Pod 전체의 정확한 총 종료 시간이 아닙니다</text></g></svg>