<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1176" role="img" aria-labelledby="title desc"><title id="title">노드 준비와 Pod별 target의 범위</title><desc id="desc">파일시스템 CSI persistent volume을 같은 노드의 두 Pod가 함께 사용할 수 있는 조건의 예시다. external-attacher가 선택적인 볼륨-노드 연결을 요청하고 kubelet이 선택적인 노드 staging target을 준비한다. kubelet은 Pod A와 Pod B의 서로 다른 target에 NodePublishVolume을 호출한다. 호스트 target 준비 뒤 runtime이 각 컨테이너에 경로를 노출한다. 재시도와 재게시가 가능하므로 호출 횟수를 보장하지 않는다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#334155"/></marker></defs><rect width="600" height="1176" rx="16" fill="#FAFAFA"/><g font-family="Pretendard, Apple SD Gothic Neo, system-ui, sans-serif"><text x="300" y="40" font-size="24" fill="#0A0A0A" text-anchor="middle">노드 준비와 Pod별 target의 범위</text><text x="300" y="88" font-size="21" fill="#27272A" text-anchor="middle">파일시스템 · 두 Pod의 공유가 허용된 예시</text><path d="M300 232 V352" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><path d="M300 496 V560 H160 V640" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><path d="M300 560 H440 V640" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><path d="M160 768 V912" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><path d="M440 768 V912" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="128" width="520" height="104" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/><text x="300.0" y="162" font-size="21" fill="#B45309" text-anchor="middle">ControllerPublishVolume</text><text x="300.0" y="192" font-size="21" fill="#27272A" text-anchor="middle">external-attacher · 볼륨-노드 쌍</text><rect x="125.0" y="268" width="350" height="28" fill="#FAFAFA"/><text x="300" y="288" font-size="21" fill="#27272A" text-anchor="middle">attach가 필요한 경우</text><rect x="40" y="352" width="520" height="144" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/><text x="300.0" y="386" font-size="21" fill="#047857" text-anchor="middle">NodeStageVolume</text><text x="300.0" y="416" font-size="21" fill="#27272A" text-anchor="middle">kubelet · 노드 staging target</text><text x="300.0" y="444" font-size="21" fill="#27272A" text-anchor="middle">지원되는 경우에 준비</text><rect x="90.0" y="588" width="420" height="28" fill="#FAFAFA"/><text x="300" y="608" font-size="21" fill="#27272A" text-anchor="middle">서로 다른 Pod target을 준비</text><rect x="40" y="640" width="240" height="128" rx="12" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/><text x="160.0" y="674" font-size="21" fill="#6D28D9" text-anchor="middle">Pod A target</text><text x="160.0" y="704" font-size="21" fill="#27272A" text-anchor="middle">NodePublishVolume</text><text x="160.0" y="732" font-size="21" fill="#27272A" text-anchor="middle">kubelet</text><rect x="320" y="640" width="240" height="128" rx="12" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/><text x="440.0" y="674" font-size="21" fill="#6D28D9" text-anchor="middle">Pod B target</text><text x="440.0" y="704" font-size="21" fill="#27272A" text-anchor="middle">NodePublishVolume</text><text x="440.0" y="732" font-size="21" fill="#27272A" text-anchor="middle">kubelet</text><rect x="80.0" y="828" width="440" height="28" fill="#FAFAFA"/><text x="300" y="848" font-size="21" fill="#27272A" text-anchor="middle">호스트 target 준비 뒤</text><rect x="40" y="912" width="520" height="104" rx="12" fill="#F8FAFC" stroke="#475569" stroke-width="1.5"/><text x="300.0" y="946" font-size="21" fill="#334155" text-anchor="middle">runtime · 컨테이너 경로</text><text x="300.0" y="976" font-size="21" fill="#27272A" text-anchor="middle">각 Pod의 컨테이너에 호스트 경로 노출</text><text x="300" y="1080" font-size="21" fill="#27272A" text-anchor="middle">attach·stage는 조건에 따라 생략합니다</text><text x="300" y="1128" font-size="21" fill="#27272A" text-anchor="middle">호출 횟수가 한 번이라는 뜻은 아닙니다</text></g></svg>