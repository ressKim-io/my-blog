<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-labelledby="title desc">
  <title id="title">용량 검사 생략과 정보 부족으로 인한 노드 제외의 차이</title>
  <desc id="desc">WFFC 동적 생성의 프로비저닝과 위치 조건을 통과한 뒤, VolumeBinding은 용량 검사 적용 조건을 확인합니다. 요청량 또는 드라이버 참여 선언이 없으면 이 검사를 생략합니다. 적용 시에는 클래스, 크기, 노드 접근 조건에 맞는 용량 정보가 하나 이상 있어야 이 검사를 통과하며, 없으면 해당 노드를 제외합니다</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748B"/></marker></defs>
  <rect width="800" height="800" rx="20" fill="#FAFAFA"/>
  <g font-family="Pretendard, Noto Sans KR, Apple SD Gothic Neo, sans-serif" text-anchor="middle" fill="#0F172A">
    <text x="400" y="47" font-size="29" font-weight="700">생략과 부족은 다른 판정입니다</text>
    <rect x="80" y="84" width="640" height="98" rx="15" fill="#FFFBEB" stroke="#FCD34D" stroke-width="2"/>
    <text x="400" y="123" font-size="27" font-weight="700">VolumeBinding · WFFC 동적 후보</text>
    <text x="400" y="159" font-size="24">프로비저닝·AllowedTopologies 조건 통과</text>
    <path d="M400 182V228" stroke="#64748B" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
    <rect x="80" y="230" width="640" height="96" rx="15" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2"/>
    <text x="400" y="270" font-size="27" font-weight="700">용량 검사를 적용합니까?</text>
    <text x="400" y="306" font-size="24">요청량 존재 · CSIDriver의 참여 선언</text>
    <path d="M260 326V438" stroke="#64748B" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
    <rect x="235" y="365" width="50" height="31" rx="5" fill="#FAFAFA"/>
    <text x="260" y="389" font-size="24">예</text>
    <path d="M550 326V364" stroke="#64748B" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
    <rect x="585" y="333" width="88" height="30" rx="5" fill="#FAFAFA"/>
    <text x="629" y="356" font-size="23">아니요</text>
    <rect x="404" y="366" width="316" height="60" rx="13" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2"/>
    <text x="562" y="405" font-size="25" font-weight="700">이 용량 검사 생략</text>
    <rect x="80" y="440" width="640" height="98" rx="15" fill="#ECFEFF" stroke="#67E8F9" stroke-width="2"/>
    <text x="400" y="480" font-size="26" font-weight="700">클래스·크기·노드 접근 조건에 맞는</text>
    <text x="400" y="516" font-size="26" font-weight="700">용량 정보가 하나 이상 있습니까?</text>
    <path d="M235 538V624" stroke="#64748B" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
    <rect x="209" y="561" width="52" height="32" rx="5" fill="#FAFAFA"/>
    <text x="235" y="585" font-size="24">예</text>
    <path d="M565 538V624" stroke="#64748B" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
    <rect x="517" y="561" width="96" height="32" rx="5" fill="#FAFAFA"/>
    <text x="565" y="585" font-size="24">아니요</text>
    <rect x="64" y="626" width="330" height="68" rx="13" fill="#ECFEFF" stroke="#67E8F9" stroke-width="2"/>
    <text x="229" y="669" font-size="26" font-weight="700">이 용량 검사 통과</text>
    <rect x="410" y="626" width="326" height="68" rx="13" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="2"/>
    <text x="573" y="669" font-size="26" font-weight="700">후보 노드 제외</text>
    <text x="400" y="759" font-size="24" fill="#475569">생략·통과여도 다른 배치 조건은 남습니다</text>
  </g>
</svg>
