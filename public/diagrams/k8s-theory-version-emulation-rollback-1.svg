<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 616" role="img" aria-labelledby="title desc"><title id="title">세 버전은 실행·동작·호환 범위를 나눕니다</title><desc id="desc">binary 1.37.1은 실행 파일을, emulated 1.36은 현재 서빙 API와 기능 스펙을, min compat 1.35는 저장·CEL의 호환 범위를 정한다. major·minor 기준으로 binary 이상 emulated 이상 min compat 관계이며 그림의 수치는 허용 범위 내 설정 예시다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#334155"/></marker></defs><rect width="800" height="616" rx="16" fill="#FAFAFA"/><g font-family="Pretendard, Apple SD Gothic Neo, system-ui, sans-serif"><text x="400" y="40" font-size="24" fill="#0A0A0A" text-anchor="middle">세 버전은 실행·동작·호환 범위를 나눕니다</text><text x="400" y="72" font-size="17" fill="#27272A" text-anchor="middle">v1.37.1 바이너리의 허용 범위 안에서 고른 설정 예시</text><path d="M 344 156 H 432" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><path d="M 344 316 H 432" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><path d="M 344 476 H 432" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><path d="M 200 200 V 272" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><path d="M 200 360 V 432" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><rect x="56" y="112" width="288" height="88" rx="12" stroke="#D97706" fill="#FFFBEB" stroke-width="1.5"/><text x="200.0" y="148.0" font-size="21" fill="#B45309" text-anchor="middle">binary 1.37.1</text><text x="200.0" y="176.0" font-size="17" fill="#B45309" text-anchor="middle">배포한 실행 파일</text><rect x="56" y="272" width="288" height="88" rx="12" stroke="#059669" fill="#ECFDF5" stroke-width="1.5"/><text x="200.0" y="308.0" font-size="21" fill="#047857" text-anchor="middle">emulated 1.36</text><text x="200.0" y="336.0" font-size="17" fill="#047857" text-anchor="middle">현재 따를 동작 버전</text><rect x="56" y="432" width="288" height="88" rx="12" stroke="#7C3AED" fill="#F5F3FF" stroke-width="1.5"/><text x="200.0" y="468.0" font-size="21" fill="#6D28D9" text-anchor="middle">min compat 1.35</text><text x="200.0" y="496.0" font-size="17" fill="#6D28D9" text-anchor="middle">유지할 최소 호환 버전</text><rect x="432" y="112" width="312" height="88" rx="12" stroke="#D97706" fill="#FFFBEB" stroke-width="1.5"/><text x="588.0" y="148.0" font-size="21" fill="#B45309" text-anchor="middle">실행할 코드</text><text x="588.0" y="176.0" font-size="17" fill="#B45309" text-anchor="middle">바이너리 교체</text><rect x="432" y="272" width="312" height="88" rx="12" stroke="#059669" fill="#ECFDF5" stroke-width="1.5"/><text x="588.0" y="308.0" font-size="21" fill="#047857" text-anchor="middle">현재 API 동작</text><text x="588.0" y="336.0" font-size="17" fill="#047857" text-anchor="middle">서빙 API · 게이트 스펙</text><rect x="432" y="432" width="312" height="88" rx="12" stroke="#7C3AED" fill="#F5F3FF" stroke-width="1.5"/><text x="588.0" y="468.0" font-size="21" fill="#6D28D9" text-anchor="middle">이후 서버와의 호환</text><text x="588.0" y="496.0" font-size="17" fill="#6D28D9" text-anchor="middle">저장 버전 · CEL · 일부 기본값</text><text x="264" y="244" font-size="17" fill="#27272A" text-anchor="middle">이하로 설정</text><text x="264" y="404" font-size="17" fill="#27272A" text-anchor="middle">이하로 설정</text></g></svg>