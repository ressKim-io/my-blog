<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 840" role="img" aria-labelledby="title desc"><title id="title">CRI와 OCI의 create는 일대일 대응하지 않습니다</title><desc id="desc">containerd 예시에서 CRI CreateContainer는 OCI spec과 메타데이터를 준비하고 ID를 반환한다. kubelet은 PreStartContainer로 그 ID를 자원 매니저에 등록한다. 이어 CRI StartContainer 처리 안에서 containerd NewTask가 OCI create를 진행하고 task.Start가 OCI start를 진행한다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#334155"/></marker></defs><rect width="600" height="840" rx="16" fill="#FAFAFA"/><g font-family="Pretendard, Apple SD Gothic Neo, system-ui, sans-serif"><text x="300" y="40" font-size="24" fill="#0A0A0A" text-anchor="middle">두 create/start는 처리 시점이 다릅니다</text><text x="300" y="88" font-size="21" fill="#27272A" text-anchor="middle">containerd v2.4.2 일반 컨테이너 예시</text><path d="M300 272 V368" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><path d="M300 480 V584" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="128" width="520" height="144" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/><text x="300.0" y="162" font-size="21" fill="#047857" text-anchor="middle">① CRI CreateContainer<tspan x="300.0" y="192" font-size="21">spec·snapshot·메타데이터 준비</tspan><tspan x="300.0" y="220" font-size="21">컨테이너 ID 반환</tspan></text><rect x="150.0" y="308" width="300" height="28" fill="#FAFAFA"/><text x="300" y="328" font-size="21" fill="#27272A" text-anchor="middle">생성된 ID를 받은 뒤</text><rect x="40" y="368" width="520" height="112" rx="12" fill="#F8FAFC" stroke="#475569" stroke-width="1.5"/><text x="300.0" y="402" font-size="21" fill="#334155" text-anchor="middle">kubelet: PreStartContainer<tspan x="300.0" y="432" font-size="21">CPU · memory · topology manager에</tspan><tspan x="300.0" y="460" font-size="21">컨테이너 ID 등록</tspan></text><rect x="80.0" y="524" width="440" height="28" fill="#FAFAFA"/><text x="300" y="544" font-size="21" fill="#27272A" text-anchor="middle">등록 뒤 CRI StartContainer 호출</text><rect x="40" y="584" width="520" height="144" rx="12" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/><text x="300.0" y="618" font-size="21" fill="#6D28D9" text-anchor="middle">② CRI StartContainer<tspan x="300.0" y="648" font-size="21">containerd NewTask: OCI create</tspan><tspan x="300.0" y="676" font-size="21">이어서 task.Start: OCI start</tspan></text><text x="300" y="800" font-size="21" fill="#27272A" text-anchor="middle">같은 동사라도 일대일 대응은 아닙니다</text></g></svg>