<svg xmlns="http://www.w3.org/2000/svg" width="560" height="976" viewBox="0 0 560 976" role="img" aria-labelledby="title desc">
<title id="title">이동하는 HPA 축소 안정화 창과 추천값 이력</title>
<desc id="desc">두 장면은 같은 시간 좌표에 같은 폭의 축소 안정화 창을 표시합니다. 첫 장면은 추천 7과 3이 창 안에 있어 최댓값 7을 고릅니다. 두 번째는 오래된 7이 창 밖으로 나가고 더 큰 새 추천이 없다는 가정에서 3을 고릅니다. 숫자는 제한 전 추천값이며 실제 replica나 Ready Pod 수가 아닙니다. 이후 변경 정책과 min/max 등의 평가가 남습니다.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#475569"/></marker>

</defs>
<rect width="560" height="976" rx="16" fill="#FAFAFA"/>
<g font-family="Pretendard, Apple SD Gothic Neo, system-ui, sans-serif">
<text x="280" y="44" font-size="24" fill="#0A0A0A" text-anchor="middle" font-weight="700">축소 창 안의 최댓값을 봅니다</text>
<text x="280" y="84" font-size="22" fill="#334155" text-anchor="middle">숫자 = 변경 제한 전 추천값</text>
<text x="32" y="144" font-size="23" fill="#0A0A0A" text-anchor="start" font-weight="700">① 7과 3이 모두 창 안에 있음</text>
<rect x="56" y="188" width="328" height="124" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="2" />
<text x="220" y="220" font-size="21" fill="#B45309" text-anchor="middle">축소 안정화 창</text>
<path d="M32 256 H528" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<circle cx="128" cy="256" r="8" fill="#475569" />
<circle cx="320" cy="256" r="8" fill="#475569" />
<text x="128" y="292" font-size="26" fill="#0A0A0A" text-anchor="middle" font-weight="700">7</text>
<text x="320" y="292" font-size="26" fill="#0A0A0A" text-anchor="middle" font-weight="700">3</text>
<path d="M384 184 V326" fill="none" stroke="#D97706" stroke-width="2"/>
<text x="384" y="354" font-size="22" fill="#B45309" text-anchor="middle">현재 A</text>
<text x="280" y="398" font-size="24" fill="#B45309" text-anchor="middle" font-weight="700">창 안 최댓값: 7</text>
<path d="M280 426 V462" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<text x="336" y="452" font-size="21" fill="#334155" text-anchor="start">시간 경과</text>
<text x="32" y="508" font-size="23" fill="#0A0A0A" text-anchor="start" font-weight="700">② 오래된 7이 창 밖으로 나감</text>
<rect x="192" y="552" width="328" height="124" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="2" />
<text x="356" y="584" font-size="21" fill="#B45309" text-anchor="middle">같은 폭의 창이 이동</text>
<path d="M32 620 H528" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<circle cx="128" cy="620" r="8" fill="#FAFAFA" stroke="#475569" stroke-width="2" stroke-dasharray="3 2"/>
<circle cx="320" cy="620" r="8" fill="#475569" />
<text x="128" y="656" font-size="26" fill="#334155" text-anchor="middle">7</text>
<text x="320" y="656" font-size="26" fill="#0A0A0A" text-anchor="middle" font-weight="700">3</text>
<text x="128" y="694" font-size="21" fill="#334155" text-anchor="middle">창 밖</text>
<path d="M520 548 V690" fill="none" stroke="#D97706" stroke-width="2"/>
<text x="504" y="718" font-size="22" fill="#B45309" text-anchor="end">현재 B</text>
<text x="280" y="766" font-size="24" fill="#B45309" text-anchor="middle" font-weight="700">창 안 최댓값: 3</text>
<text x="280" y="806" font-size="21" fill="#334155" text-anchor="middle">가정: 창 안에 더 큰 새 추천이 없음</text>
<circle cx="58" cy="858" r="6" fill="#475569" />
<text x="78" y="865" font-size="21" fill="#334155" text-anchor="start">추천 이력</text>
<rect x="224" y="844" width="24" height="24" rx="3" fill="#FFFBEB" stroke="#D97706" stroke-width="2" />
<text x="264" y="865" font-size="21" fill="#334155" text-anchor="start">이번 판단에 쓰는 창</text>
<text x="280" y="914" font-size="20" fill="#334155" text-anchor="middle">선택한 추천은 실제 replica·Ready Pod 수가 아님</text>
<text x="280" y="946" font-size="21" fill="#334155" text-anchor="middle">이후 변경 정책과 min/max 등도 평가</text>
</g>
</svg>
