<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1064" role="img" aria-labelledby="title desc"><title id="title">HPA의 계산과 scale 갱신은 단계가 다릅니다</title><desc id="desc">HPA는 대상의 Scale과 Metrics API의 지표를 읽고 계산 대상과 누락 지표 및 허용 오차를 반영한다. 이후 추천 이력과 변경 정책을 적용한 목표 수를 scale Update로 API 서버에 보낸다. 서버는 Deployment의 replicas와 관리 필드를 갱신하고 Deployment 컨트롤러가 ReplicaSet으로 배분한다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#334155"/></marker></defs><rect width="600" height="1064" rx="16" fill="#FAFAFA"/><g font-family="Pretendard, Apple SD Gothic Neo, system-ui, sans-serif"><text x="300" y="40" font-size="25" fill="#0A0A0A" text-anchor="middle">지표에서 목표 개수의 쓰기까지</text><path d="M300 216 V296" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><path d="M300 428 V508" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><path d="M300 640 V720" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><path d="M300 852 V932" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="104" width="520" height="112" rx="12" fill="#F8FAFC" stroke="#475569" stroke-width="1.5"/><text x="300.0" y="138" font-size="21" fill="#334155" text-anchor="middle">Metrics API: 설정한 지표 조회<tspan x="300.0" y="168" font-size="21">CPU·메모리 / custom / external</tspan></text><rect x="100.0" y="244" width="400" height="28" fill="#FAFAFA"/><text x="300" y="264" font-size="21" fill="#27272A" text-anchor="middle">대상 Scale과 지표를 읽은 HPA</text><rect x="40" y="296" width="520" height="132" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/><text x="300.0" y="330" font-size="21" fill="#B45309" text-anchor="middle">HPA: replica 수 계산<tspan x="300.0" y="360" font-size="21">request · 누락·미준비 조건 반영</tspan><tspan x="300.0" y="388" font-size="21">현재 비율의 허용 오차 확인</tspan></text><rect x="110.0" y="456" width="380" height="28" fill="#FAFAFA"/><text x="300" y="476" font-size="21" fill="#27272A" text-anchor="middle">지표별 추천 중 큰 값 선택</text><rect x="40" y="508" width="520" height="132" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/><text x="300.0" y="542" font-size="21" fill="#B45309" text-anchor="middle">HPA: 추천값 변경 제한<tspan x="300.0" y="572" font-size="21">추천 이력으로 안정화</tspan><tspan x="300.0" y="600" font-size="21">변경 속도 정책과 min/max 적용</tspan></text><rect x="120.0" y="668" width="360" height="28" fill="#FAFAFA"/><text x="300" y="688" font-size="21" fill="#27272A" text-anchor="middle">Scale Update로 목표 저장</text><rect x="40" y="720" width="520" height="132" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/><text x="300.0" y="754" font-size="21" fill="#047857" text-anchor="middle">API 서버: Deployment /scale<tspan x="300.0" y="784" font-size="21">본체 spec.replicas 갱신</tspan><tspan x="300.0" y="812" font-size="21">managedFields에도 쓰기 반영</tspan></text><rect x="65.0" y="880" width="470" height="28" fill="#FAFAFA"/><text x="300" y="900" font-size="21" fill="#27272A" text-anchor="middle">Deployment 컨트롤러가 목표를 읽음</text><rect x="40" y="932" width="520" height="80" rx="12" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/><text x="300.0" y="966" font-size="21" fill="#6D28D9" text-anchor="middle">ReplicaSet의 목표 개수 배분</text><text x="300" y="1040" font-size="21" fill="#27272A" text-anchor="middle">저장한 목표가 즉시 Ready 수가 되지는 않습니다</text></g></svg>