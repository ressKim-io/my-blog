<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 960" role="img" aria-labelledby="ephemeral-flow-title ephemeral-flow-desc">
  <title id="ephemeral-flow-title">임시 컨테이너의 추가 요청과 실행 경계</title>
  <desc id="ephemeral-flow-desc">클라이언트가 ephemeralcontainers 서브리소스로 요청하면 API 서버는 권한과 admission 및 추가 전용 검증을 거쳐 Pod 명세를 저장합니다. kubelet은 별도 동기화에서 시작할 대상을 계산하며, 런타임이 컨테이너를 생성하고 시작합니다</desc>
  <defs><marker id="flow-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 10 4 0 8Z" fill="#475569"/></marker></defs>
  <rect width="640" height="960" rx="16" fill="#FAFAFA"/>
  <g font-family="'Pretendard', system-ui, sans-serif" text-anchor="middle" fill="#0A0A0A">
    <text x="320" y="44" font-size="27" font-weight="700">추가 요청 저장과 실행은 별도 단계</text>
    <g fill="none" stroke="#475569" stroke-width="2" marker-end="url(#flow-arrow)">
      <path d="M320 184V224"/>
      <path d="M320 360V400"/>
      <path d="M320 504V576" stroke-dasharray="6 4"/>
      <path d="M320 712V752"/>
    </g>
    <g stroke-width="1.5">
      <rect x="48" y="88" width="544" height="96" rx="12" fill="#ECFEFF" stroke="#0891B2"/>
      <rect x="48" y="232" width="544" height="128" rx="12" fill="#ECFDF5" stroke="#059669"/>
      <rect x="48" y="408" width="544" height="96" rx="12" fill="#F5F3FF" stroke="#7C3AED"/>
      <rect x="48" y="584" width="544" height="128" rx="12" fill="#FFFBEB" stroke="#D97706"/>
      <rect x="48" y="760" width="544" height="96" rx="12" fill="#FFFBEB" stroke="#D97706"/>
    </g>
    <g font-size="25" font-weight="700">
      <text x="320" y="123">kubectl / API client</text>
      <text x="320" y="268">API 서버: 권한·admission·검증</text>
      <text x="320" y="443">Pod spec 저장</text>
      <text x="320" y="620">kubelet: 시작할 대상 계산</text>
      <text x="320" y="795">CRI → 컨테이너 런타임</text>
    </g>
    <g font-size="22" fill="#27272A">
      <text x="320" y="159">pods/ephemeralcontainers 요청</text>
      <text x="320" y="304">새 임시 명세만 반영</text>
      <text x="320" y="337">기존 임시 항목 제거·변경 금지</text>
      <text x="320" y="479">metadata.generation 갱신</text>
      <text x="391" y="548">비동기</text>
      <text x="320" y="655">이름의 런타임 상태가 없을 때</text>
      <text x="320" y="689">init 완료 전에도 대상 가능</text>
      <text x="320" y="831">컨테이너 생성·시작</text>
      <text x="320" y="912">API 성공이 즉시 실행을 보장하지 않음</text>
    </g>
  </g>
</svg>
