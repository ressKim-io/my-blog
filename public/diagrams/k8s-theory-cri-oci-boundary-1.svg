<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1000" role="img" aria-labelledby="title desc"><title id="title">CRI와 OCI 사이에 구현별 호출 경계가 있습니다</title><desc id="desc">Linux에서 containerd와 runc를 사용하는 예시다. kubelet은 CRI gRPC로 containerd에 요청하고 containerd는 이미지와 OCI spec 및 bundle을 준비한다. shim API로 요청받은 containerd-shim-runc-v2가 runc를 호출하며 runc는 bundle로 컨테이너 환경을 적용한다. shim API와 runc 명령줄은 OCI가 고정하는 호출 인터페이스가 아니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#334155"/></marker></defs><rect width="600" height="1000" rx="16" fill="#FAFAFA"/><g font-family="Pretendard, Apple SD Gothic Neo, system-ui, sans-serif"><text x="300" y="40" font-size="25" fill="#0A0A0A" text-anchor="middle">CRI 요청에서 OCI 실행까지</text><text x="300" y="88" font-size="21" fill="#27272A" text-anchor="middle">containerd v2.4.2 · runc v1.5.2 예시</text><path d="M300 232 V328" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><path d="M300 472 V576" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><path d="M300 720 V824" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="128" width="520" height="104" rx="12" fill="#F8FAFC" stroke="#475569" stroke-width="1.5"/><text x="300.0" y="162" font-size="21" fill="#334155" text-anchor="middle">kubelet: CRI 클라이언트<tspan x="300.0" y="192" font-size="21">이미지 준비 · sandbox · 컨테이너 요청</tspan></text><rect x="210.0" y="268" width="180" height="28" fill="#FAFAFA"/><text x="300" y="288" font-size="21" fill="#27272A" text-anchor="middle">CRI gRPC</text><rect x="40" y="328" width="520" height="144" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/><text x="300.0" y="362" font-size="21" fill="#047857" text-anchor="middle">containerd: CRI 구현<tspan x="300.0" y="392" font-size="21">이미지·snapshot·OCI spec 준비</tspan><tspan x="300.0" y="420" font-size="21">bundle에 config.json과 rootfs 준비</tspan></text><rect x="150.0" y="516" width="300" height="28" fill="#FAFAFA"/><text x="300" y="536" font-size="21" fill="#27272A" text-anchor="middle">shim API로 실행 요청</text><rect x="40" y="576" width="520" height="144" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/><text x="300.0" y="610" font-size="21" fill="#B45309" text-anchor="middle">containerd-shim-runc-v2<tspan x="300.0" y="640" font-size="21">실행 요청·프로세스 수명 관리</tspan><tspan x="300.0" y="668" font-size="21">OCI 실행기에 동작을 요청</tspan></text><rect x="130.0" y="764" width="340" height="28" fill="#FAFAFA"/><text x="300" y="784" font-size="21" fill="#27272A" text-anchor="middle">runc 명령 + bundle 경로</text><rect x="40" y="824" width="520" height="104" rx="12" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/><text x="300.0" y="858" font-size="21" fill="#6D28D9" text-anchor="middle">runc: OCI runtime<tspan x="300.0" y="888" font-size="21">설정에 맞는 환경 생성 · 프로그램 실행</tspan></text><text x="300" y="976" font-size="21" fill="#27272A" text-anchor="middle">OCI는 호출 수단을 고정하지 않습니다</text></g></svg>