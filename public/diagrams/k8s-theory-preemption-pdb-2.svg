<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 720" role="img" aria-labelledby="title desc"><title id="title">스냅샷에서 되돌려 보며 희생자를 줄입니다</title><desc id="desc">실제 Pod를 삭제하지 않는 후보 계산. 낮은 우선순위 Pod를 모두 뺀 사본에서 Filter가 실패하면 노드를 포기한다. 통과하면 PDB 위반 후보와 높은 우선순위부터 하나씩 되돌려 보고, 그래도 Filter가 통과하면 남기고 실패하면 희생자로 남긴다. 남은 후보마다 이 검사를 반복한다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#334155"/></marker></defs><rect width="800" height="720" rx="16" fill="#FAFAFA"/><g font-family="Pretendard, Apple SD Gothic Neo, system-ui, sans-serif"><text x="400" y="40" font-size="23" fill="#0A0A0A" text-anchor="middle">스냅샷에서 되돌려 보며 희생자를 줄입니다</text><path d="M 280 168 V 248" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><path d="M 280 320 V 400" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><path d="M 472 284 H 552" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><path d="M 280 480 V 528 H 208 V 568" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><path d="M 280 528 H 592 V 568" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><rect x="88" y="88" width="384" height="80" rx="12" stroke="#7C3AED" fill="#F5F3FF" stroke-width="1.5"/><text x="280.0" y="120.0" font-size="21" fill="#6D28D9" text-anchor="middle">낮은 우선순위 Pod 제거</text><text x="280.0" y="148.0" font-size="17" fill="#6D28D9" text-anchor="middle">실제 삭제가 아닌 스냅샷 조작</text><rect x="88" y="248" width="384" height="72" rx="12" stroke="#059669" fill="#ECFDF5" stroke-width="1.5"/><text x="280.0" y="290.0" font-size="21" fill="#047857" text-anchor="middle">제거한 상태에서 Filter</text><rect x="552" y="248" width="192" height="72" rx="12" stroke="#475569" fill="#F8FAFC" stroke-width="1.5"/><text x="648.0" y="290.0" font-size="21" fill="#334155" text-anchor="middle">노드 포기</text><rect x="88" y="400" width="384" height="80" rx="12" stroke="#059669" fill="#ECFDF5" stroke-width="1.5"/><text x="280.0" y="432.0" font-size="21" fill="#047857" text-anchor="middle">후보 하나를 되돌리고 검사</text><text x="280.0" y="460.0" font-size="17" fill="#047857" text-anchor="middle">PDB 위반 후보부터 · 우선순위 순</text><rect x="64" y="568" width="288" height="80" rx="12" stroke="#059669" fill="#ECFDF5" stroke-width="1.5"/><text x="208.0" y="600.0" font-size="21" fill="#047857" text-anchor="middle">통과: 남김</text><text x="208.0" y="628.0" font-size="17" fill="#047857" text-anchor="middle">희생자에서 제외</text><rect x="448" y="568" width="288" height="80" rx="12" stroke="#7C3AED" fill="#F5F3FF" stroke-width="1.5"/><text x="592.0" y="600.0" font-size="21" fill="#6D28D9" text-anchor="middle">실패: 다시 제거</text><text x="592.0" y="628.0" font-size="17" fill="#6D28D9" text-anchor="middle">희생자로 남김</text><text x="504" y="268" font-size="17" fill="#27272A" text-anchor="middle">실패</text><text x="328" y="368" font-size="17" fill="#27272A" text-anchor="middle">통과</text><text x="400" y="696" font-size="18" fill="#27272A" text-anchor="middle">남은 후보마다 되돌리기와 Filter 검사를 반복합니다</text></g></svg>