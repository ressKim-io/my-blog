<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1064" role="img" aria-labelledby="title desc"><title id="title">Linux containerd는 netns를 먼저 고정하고 CNI를 설정합니다</title><desc id="desc">containerd v2.4.2의 비-hostNetwork podsandbox 경로 예시다. kubelet의 RunPodSandbox 요청을 받으면 런타임은 network namespace를 만들고 bind mount로 유지한다. CNI 설정 후 pause 기반 sandbox를 시작한다. kubelet은 성공 응답과 sandbox 상태의 IP를 확인한 뒤 앱 컨테이너 생성을 진행한다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#334155"/></marker></defs><rect width="600" height="1064" rx="16" fill="#FAFAFA"/><g font-family="Pretendard, Apple SD Gothic Neo, system-ui, sans-serif"><text x="300" y="40" font-size="25" fill="#0A0A0A" text-anchor="middle">앱이 뜨기 전에 환경을 준비합니다</text><text x="300" y="80" font-size="21" fill="#27272A" text-anchor="middle">containerd v2.4.2 · 일반 Linux Pod 예시</text><path d="M300 208 V280" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><path d="M300 412 V484" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><path d="M300 588 V660" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><path d="M300 764 V852" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="104" width="520" height="104" rx="12" fill="#F8FAFC" stroke="#475569" stroke-width="1.5"/><text x="300.0" y="138" font-size="21" fill="#334155" text-anchor="middle">kubelet: sandbox 생성 요청<tspan x="300.0" y="168" font-size="21">Pod 설정과 namespace 모드 전달</tspan></text><rect x="150.0" y="232" width="300" height="28" fill="#FAFAFA"/><text x="300" y="252" font-size="21" fill="#27272A" text-anchor="middle">CRI RunPodSandbox</text><rect x="40" y="280" width="520" height="132" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/><text x="300.0" y="314" font-size="21" fill="#B45309" text-anchor="middle">containerd: netns 생성·참조 유지<tspan x="300.0" y="344" font-size="21">network namespace 생성</tspan><tspan x="300.0" y="372" font-size="21">bind mount로 프로세스 없이도 유지</tspan></text><rect x="140.0" y="436" width="320" height="28" fill="#FAFAFA"/><text x="300" y="456" font-size="21" fill="#27272A" text-anchor="middle">CNI에 netns 경로 전달</text><rect x="40" y="484" width="520" height="104" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/><text x="300.0" y="518" font-size="21" fill="#047857" text-anchor="middle">CNI 플러그인: 네트워크 구성<tspan x="300.0" y="548" font-size="21">인터페이스 · IP · 경로 설정</tspan></text><rect x="120.0" y="612" width="360" height="28" fill="#FAFAFA"/><text x="300" y="632" font-size="21" fill="#27272A" text-anchor="middle">네트워크 설정 후 실행 준비</text><rect x="40" y="660" width="520" height="104" rx="12" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/><text x="300.0" y="694" font-size="21" fill="#6D28D9" text-anchor="middle">podsandbox: pause 컨테이너 시작<tspan x="300.0" y="724" font-size="21">준비한 network namespace에 참여</tspan></text><rect x="65.0" y="800" width="470" height="28" fill="#FAFAFA"/><text x="300" y="820" font-size="21" fill="#27272A" text-anchor="middle">성공 응답 · sandbox 상태의 IP 확인</text><rect x="40" y="852" width="520" height="132" rx="12" fill="#F8FAFC" stroke="#475569" stroke-width="1.5"/><text x="300.0" y="886" font-size="21" fill="#334155" text-anchor="middle">kubelet: 앱 컨테이너 생성·시작<tspan x="300.0" y="916" font-size="21">준비된 sandbox 네트워크 사용</tspan><tspan x="300.0" y="944" font-size="21">앱 프로세스와 별도로 환경 유지</tspan></text><text x="300" y="1040" font-size="21" fill="#27272A" text-anchor="middle">참조를 유지하는 주체: bind mount와 프로세스</text></g></svg>