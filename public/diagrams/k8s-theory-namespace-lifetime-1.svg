<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 776" role="img" aria-labelledby="title desc"><title id="title">프로세스 밖의 참조도 network namespace를 유지합니다</title><desc id="desc">Network namespace의 수명 참조를 단순화한 관계 그림이다. 참여 task가 nsproxy를 통해 가리키는 참조 외에도 열린 namespace FD와 해당 namespace 자체를 가리키는 bind mount가 객체를 유지할 수 있다. Task가 종료해도 다른 참조가 남으면 객체는 유지된다. 마지막 수명 참조가 해제된 뒤의 커널 정리는 별도 단계이며 그림은 모든 참조 종류를 열거하지 않는다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#334155"/></marker></defs><rect width="600" height="776" rx="16" fill="#FAFAFA"/><g font-family="Pretendard, Apple SD Gothic Neo, system-ui, sans-serif"><text x="300" y="44" font-size="24" fill="#0A0A0A" text-anchor="middle">프로세스 종료와 객체 해제는 다릅니다</text><text x="300" y="88" font-size="21" fill="#27272A" text-anchor="middle">Network namespace의 참조 관계 · 단순화</text><path d="M108 288 V352 H300 V416" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><path d="M300 288 V416" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><path d="M492 288 V352 H300" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="160" width="168" height="128" rx="12" fill="#F8FAFC" stroke="#475569" stroke-width="1.5"/><text x="108.0" y="194" font-size="21" fill="#334155" text-anchor="middle">참여 task</text><text x="108.0" y="224" font-size="21" fill="#27272A" text-anchor="middle">nsproxy를</text><text x="108.0" y="252" font-size="21" fill="#27272A" text-anchor="middle">통한 참조</text><rect x="216" y="160" width="168" height="128" rx="12" fill="#F8FAFC" stroke="#475569" stroke-width="1.5"/><text x="300.0" y="194" font-size="21" fill="#334155" text-anchor="middle">열린 FD</text><text x="300.0" y="224" font-size="21" fill="#27272A" text-anchor="middle">namespace</text><text x="300.0" y="252" font-size="21" fill="#27272A" text-anchor="middle">파일 참조</text><rect x="408" y="160" width="168" height="128" rx="12" fill="#F8FAFC" stroke="#475569" stroke-width="1.5"/><text x="492.0" y="194" font-size="21" fill="#334155" text-anchor="middle">Bind mount</text><text x="492.0" y="224" font-size="21" fill="#27272A" text-anchor="middle">namespace</text><text x="492.0" y="252" font-size="21" fill="#27272A" text-anchor="middle">자체를 참조</text><rect x="40" y="416" width="520" height="160" rx="12" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/><text x="300.0" y="450" font-size="21" fill="#6D28D9" text-anchor="middle">Network namespace 객체</text><text x="300.0" y="480" font-size="21" fill="#27272A" text-anchor="middle">Task 참조가 끊겨도</text><text x="300.0" y="508" font-size="21" fill="#27272A" text-anchor="middle">다른 수명 참조가 남으면 유지</text><path d="M300 576 V688" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><rect x="50.0" y="612" width="500" height="28" fill="#FAFAFA"/><text x="300" y="632" font-size="21" fill="#27272A" text-anchor="middle">마지막 수명 참조가 해제되면</text><text x="300" y="728" font-size="21" fill="#27272A" text-anchor="middle">별도 커널 정리 단계로 진행</text></g></svg>