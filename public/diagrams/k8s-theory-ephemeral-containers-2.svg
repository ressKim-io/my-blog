<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 584" role="img" aria-labelledby="ephemeral-status-title ephemeral-status-desc">
  <title id="ephemeral-status-title">임시 컨테이너의 상태 집계와 자원 소비</title>
  <desc id="ephemeral-status-desc">일반 컨테이너와 init 컨테이너의 상태는 Pod phase와 준비 조건의 집계에 쓰이고 임시 컨테이너 상태는 별도로 기록됩니다. 상태 집계에서 제외돼도 임시 컨테이너의 실행 프로세스는 Pod 자원 범위 안에서 자원을 소비합니다</desc>
  <defs><marker id="status-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 10 4 0 8Z" fill="#475569"/></marker></defs>
  <rect width="720" height="584" rx="16" fill="#FAFAFA"/>
  <g font-family="'Pretendard', system-ui, sans-serif" text-anchor="middle" fill="#0A0A0A">
    <text x="360" y="43" font-size="27" font-weight="700">상태 집계에서 빠져도 자원을 소비합니다</text>
    <rect x="32" y="224" width="656" height="264" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
    <g fill="none" stroke="#475569" stroke-width="2" marker-end="url(#status-arrow)">
      <path d="M200 288V200"/>
      <path d="M520 288V200"/>
    </g>
    <g stroke-width="1.5">
      <rect x="64" y="80" width="272" height="112" rx="12" fill="#F8FAFC" stroke="#475569"/>
      <rect x="384" y="80" width="272" height="112" rx="12" fill="#F8FAFC" stroke="#475569"/>
      <rect x="64" y="288" width="272" height="112" rx="12" fill="#ECFDF5" stroke="#059669"/>
      <rect x="384" y="288" width="272" height="112" rx="12" fill="#ECFEFF" stroke="#0891B2"/>
    </g>
    <g font-size="24" font-weight="700">
      <text x="200" y="118">phase·준비 조건</text>
      <text x="520" y="118">임시 컨테이너 상태</text>
      <text x="360" y="260">Linux Pod cgroup</text>
      <text x="200" y="329">일반·init 컨테이너</text>
      <text x="520" y="329">임시 컨테이너</text>
    </g>
    <g font-size="21" fill="#27272A">
      <text x="200" y="155">일반·init 상태 집계</text>
      <text x="520" y="150">별도 status에 기록</text>
      <text x="520" y="180">phase·Ready에 미합산</text>
      <text x="200" y="369">실행 프로세스</text>
      <text x="520" y="369">실행 프로세스</text>
      <text x="360" y="450">두 프로세스의 소비가 Pod 자원 압박에 영향</text>
      <text x="360" y="544">직접 집계 제외는 자원 격리 보장이 아닙니다</text>
    </g>
  </g>
</svg>
