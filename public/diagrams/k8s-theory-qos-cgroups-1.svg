<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="title desc">
  <title id="title">request와 limit을 읽는 주체와 제어 값</title>
  <desc id="desc">Pod의 request는 스케줄러의 배치 계산과 kubelet의 CPU 상대 가중치로 이어집니다. limit은 kubelet이 CPU quota와 메모리 상한으로 변환합니다. QoS는 두 값의 관계로 계산합니다</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#475569"/></marker></defs>
  <rect width="800" height="560" rx="16" fill="#FAFAFA"/>
  <g font-family="Pretendard, system-ui, sans-serif" fill="#0A0A0A">
    <text x="32" y="40" font-size="22" font-weight="700">같은 자원 선언에서 배치 판단과 실행 제어로</text>
    <g fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)">
      <path d="M224 144H312V176H368"/>
      <path d="M224 144H272V352H368"/>
      <path d="M224 256H304V424H368"/>
    </g>
    <rect x="32" y="104" width="192" height="80" rx="12" fill="#ECFEFF" stroke="#0891B2"/>
    <text x="128" y="136" text-anchor="middle" font-size="19" font-weight="700">requests</text>
    <text x="128" y="163" text-anchor="middle" font-size="16">배치에 필요한 양</text>
    <rect x="32" y="216" width="192" height="80" rx="12" fill="#F5F3FF" stroke="#7C3AED"/>
    <text x="128" y="248" text-anchor="middle" font-size="19" font-weight="700">limits</text>
    <text x="128" y="275" text-anchor="middle" font-size="16">허용할 사용량 상한</text>
    <rect x="368" y="104" width="392" height="128" rx="12" fill="#FFFBEB" stroke="#D97706"/>
    <text x="392" y="136" font-size="19" font-weight="700">스케줄러</text>
    <text x="392" y="169" font-size="16">request로 노드의 배치 여유 판단</text>
    <text x="392" y="202" font-size="16">누락 요청의 Score 가정값은 별도</text>
    <rect x="368" y="288" width="392" height="176" rx="12" fill="#ECFDF5" stroke="#059669"/>
    <text x="392" y="320" font-size="19" font-weight="700">kubelet</text>
    <text x="392" y="354" font-size="16">CPU request → 상대 가중치</text>
    <text x="392" y="394" font-size="16">CPU limit → quota / period</text>
    <text x="392" y="434" font-size="16">memory limit → 메모리 상한</text>
    <rect x="32" y="352" width="192" height="112" rx="12" fill="#F8FAFC" stroke="#475569"/>
    <text x="128" y="386" text-anchor="middle" font-size="19" font-weight="700">QoS 계산</text>
    <text x="128" y="417" text-anchor="middle" font-size="16">선언 여부와</text>
    <text x="128" y="442" text-anchor="middle" font-size="16">request·limit 관계</text>
    <text x="32" y="516" font-size="15" fill="#334155">request도 노드 제어에 사용합니다 · limit 합계는 기본 배치량 계산 기준이 아닙니다</text>
  </g>
</svg>
