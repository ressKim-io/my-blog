<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 496" role="img" aria-labelledby="title desc"><title id="title">completions와 parallelism의 역할</title><desc id="desc">모든 Pod가 성공하고 실행 시간이 같다고 가정한 개념도다. parallelism 2이면 두 Pod씩 활성화하고 completions 6이면 총 여섯 성공을 채운다. 이 그림은 실측 시간이나 종료 중 Pod까지 합친 개수의 상한을 뜻하지 않는다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#334155"/></marker></defs><rect width="800" height="496" rx="16" fill="#FAFAFA"/><g font-family="Pretendard, Apple SD Gothic Neo, system-ui, sans-serif"><text x="400" y="40" font-size="23" fill="#0A0A0A" text-anchor="middle">completions: 6 / parallelism: 2</text><text x="400" y="80" font-size="18" fill="#27272A" text-anchor="middle">가정: 모든 Pod 성공, 각 실행 시간은 같음</text><rect x="96" y="128" width="176" height="72" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/><text x="184.0" y="162" font-size="21" fill="#047857" text-anchor="middle">Pod 1<tspan x="184.0" y="192" font-size="18">성공</tspan></text><rect x="96" y="240" width="176" height="72" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/><text x="184.0" y="274" font-size="21" fill="#047857" text-anchor="middle">Pod 2<tspan x="184.0" y="304" font-size="18">성공</tspan></text><text x="184" y="360" font-size="18" fill="#27272A" text-anchor="middle">누적 성공 2 / 6</text><rect x="328" y="128" width="176" height="72" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/><text x="416.0" y="162" font-size="21" fill="#047857" text-anchor="middle">Pod 3<tspan x="416.0" y="192" font-size="18">성공</tspan></text><rect x="328" y="240" width="176" height="72" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/><text x="416.0" y="274" font-size="21" fill="#047857" text-anchor="middle">Pod 4<tspan x="416.0" y="304" font-size="18">성공</tspan></text><text x="416" y="360" font-size="18" fill="#27272A" text-anchor="middle">누적 성공 4 / 6</text><rect x="560" y="128" width="176" height="72" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/><text x="648.0" y="162" font-size="21" fill="#047857" text-anchor="middle">Pod 5<tspan x="648.0" y="192" font-size="18">성공</tspan></text><rect x="560" y="240" width="176" height="72" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/><text x="648.0" y="274" font-size="21" fill="#047857" text-anchor="middle">Pod 6<tspan x="648.0" y="304" font-size="18">성공</tspan></text><text x="648" y="360" font-size="18" fill="#27272A" text-anchor="middle">누적 성공 6 / 6</text><path d="M96 400 H736" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><text x="416" y="432" font-size="18" fill="#27272A" text-anchor="middle">시간 진행 — 축척 없는 개념도</text><text x="400" y="472" font-size="18" fill="#0A0A0A" text-anchor="middle">동시 활성 목표는 2개, 총 성공 목표는 6개입니다</text></g></svg>