<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1000" role="img" aria-labelledby="title desc"><title id="title">IPv4 패킷의 세 경로와 다섯 주요 hook</title><desc id="desc">일반적인 IPv4 경로를 세 열로 나눈다. 로컬로 받는 수신 패킷은 PREROUTING과 라우팅을 거쳐 INPUT으로 간다. 전달 패킷은 PREROUTING과 라우팅 뒤 FORWARD와 POSTROUTING을 지난다. 로컬에서 만든 패킷은 초기 라우팅 뒤 OUTPUT을 지나며 DNAT으로 목적지가 바뀌면 필요할 때 경로를 다시 계산하고 POSTROUTING으로 나간다. INPUT을 거친 같은 패킷이 자동으로 OUTPUT으로 이어지는 것이 아니며 로컬 프로세스의 응답은 새 송신이다. 우회 경로와 ingress, egress 등은 생략한다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#334155"/></marker></defs><rect width="600" height="1000" rx="16" fill="#FAFAFA"/><g font-family="Pretendard, Apple SD Gothic Neo, system-ui, sans-serif"><text x="300" y="40" font-size="24" fill="#0A0A0A" text-anchor="middle">IPv4 패킷의 세 경로</text><text x="300" y="80" font-size="21" fill="#27272A" text-anchor="middle">모든 패킷이 다섯 hook을 모두 지나지는 않습니다</text><path d="M108 224 V320" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><path d="M108 432 V528" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><path d="M300 224 V320" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><path d="M300 432 V528" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><path d="M492 224 V320" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><path d="M492 432 V528" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><path d="M300 640 V736" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><path d="M300 848 V912" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><path d="M492 640 V736" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><path d="M492 848 V912" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><text x="108" y="128" font-size="21" fill="#27272A" text-anchor="middle">로컬 수신</text><text x="300" y="128" font-size="21" fill="#27272A" text-anchor="middle">다른 곳으로 전달</text><text x="492" y="128" font-size="21" fill="#27272A" text-anchor="middle">로컬 송신</text><rect x="24" y="160" width="168" height="64" rx="12" fill="#F8FAFC" stroke="#475569" stroke-width="1.5"/><text x="108.0" y="194" font-size="21" fill="#334155" text-anchor="middle">PREROUTING</text><rect x="24" y="320" width="168" height="112" rx="12" fill="#F8FAFC" stroke="#475569" stroke-width="1.5"/><text x="108.0" y="354" font-size="21" fill="#334155" text-anchor="middle">라우팅</text><text x="108.0" y="384" font-size="21" fill="#27272A" text-anchor="middle">목적지 판단</text><rect x="216" y="160" width="168" height="64" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/><text x="300.0" y="194" font-size="21" fill="#B45309" text-anchor="middle">PREROUTING</text><rect x="216" y="320" width="168" height="112" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/><text x="300.0" y="354" font-size="21" fill="#B45309" text-anchor="middle">라우팅</text><text x="300.0" y="384" font-size="21" fill="#27272A" text-anchor="middle">목적지 판단</text><rect x="24" y="528" width="168" height="112" rx="12" fill="#F8FAFC" stroke="#475569" stroke-width="1.5"/><text x="108.0" y="562" font-size="21" fill="#334155" text-anchor="middle">INPUT</text><text x="108.0" y="592" font-size="21" fill="#27272A" text-anchor="middle">로컬로 받기</text><rect x="216" y="528" width="168" height="112" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/><text x="300.0" y="562" font-size="21" fill="#B45309" text-anchor="middle">FORWARD</text><text x="300.0" y="592" font-size="21" fill="#27272A" text-anchor="middle">전달하기</text><rect x="408" y="160" width="168" height="64" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/><text x="492.0" y="194" font-size="21" fill="#047857" text-anchor="middle">로컬 생성</text><rect x="408.0" y="248" width="168" height="28" fill="#FAFAFA"/><text x="492" y="268" font-size="21" fill="#27272A" text-anchor="middle">초기 라우팅</text><rect x="408" y="320" width="168" height="112" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/><text x="492.0" y="354" font-size="21" fill="#047857" text-anchor="middle">OUTPUT</text><text x="492.0" y="384" font-size="21" fill="#27272A" text-anchor="middle">DNAT 가능</text><rect x="408" y="528" width="168" height="112" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/><text x="492.0" y="562" font-size="21" fill="#047857" text-anchor="middle">경로 재판단</text><text x="492.0" y="592" font-size="21" fill="#27272A" text-anchor="middle">필요한 경우</text><rect x="216" y="736" width="168" height="112" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/><text x="300.0" y="770" font-size="21" fill="#B45309" text-anchor="middle">POSTROUTING</text><text x="300.0" y="800" font-size="21" fill="#27272A" text-anchor="middle">송신 직전</text><rect x="408" y="736" width="168" height="112" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/><text x="492.0" y="770" font-size="21" fill="#047857" text-anchor="middle">POSTROUTING</text><text x="492.0" y="800" font-size="21" fill="#27272A" text-anchor="middle">송신 직전</text><text x="108" y="720" font-size="21" fill="#27272A" text-anchor="middle">응답은 새 송신</text><text x="300" y="952" font-size="21" fill="#27272A" text-anchor="middle">송신</text><text x="492" y="952" font-size="21" fill="#27272A" text-anchor="middle">송신</text></g></svg>