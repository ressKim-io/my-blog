<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1304" role="img" aria-labelledby="title desc"><title id="title">요청 버전과 저장 목표 사이의 변환</title><desc id="desc">Webhook 전략에서 v1alpha1을 서빙하고 현재 저장 목표는 v1인 예시다. 클라이언트 쓰기를 API 서버가 v1으로 변환해 해당 CR의 바이트를 저장한다. 이후 v1alpha1 조회에서는 저장된 v1을 요청 버전으로 변환해 응답한다. 각 변환에서 입력과 목표가 다르면 webhook 호출이 필요하다. 이 쓰기를 거치지 않은 다른 CR은 여전히 옛 저장 버전일 수 있다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#334155"/></marker></defs><rect width="600" height="1304" rx="16" fill="#FAFAFA"/><g font-family="Pretendard, Apple SD Gothic Neo, system-ui, sans-serif"><text x="300" y="40" font-size="24" fill="#0A0A0A" text-anchor="middle">요청 버전과 저장 목표는 다를 수 있습니다</text><text x="300" y="88" font-size="21" fill="#27272A" text-anchor="middle">v1alpha1 서빙 · storage v1 · Webhook 예시</text><path d="M300 232 V352" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><path d="M300 480 V600" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><path d="M300 728 V848" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><path d="M300 976 V1096" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="128" width="520" height="104" rx="12" fill="#F8FAFC" stroke="#475569" stroke-width="1.5"/><text x="300.0" y="162" font-size="21" fill="#334155" text-anchor="middle">클라이언트 · 쓰기 요청</text><text x="300.0" y="192" font-size="21" fill="#27272A" text-anchor="middle">CR의 apiVersion: v1alpha1</text><rect x="70.0" y="268" width="460" height="28" fill="#FAFAFA"/><text x="300" y="288" font-size="21" fill="#27272A" text-anchor="middle">입력과 저장 목표가 달라 변환</text><rect x="40" y="352" width="520" height="128" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/><text x="300.0" y="386" font-size="21" fill="#B45309" text-anchor="middle">API 서버 · 쓰기 변환</text><text x="300.0" y="416" font-size="21" fill="#27272A" text-anchor="middle">v1alpha1 → v1</text><text x="300.0" y="444" font-size="21" fill="#27272A" text-anchor="middle">필요한 변환을 Webhook에 요청</text><rect x="70.0" y="524" width="460" height="28" fill="#FAFAFA"/><text x="300" y="544" font-size="21" fill="#27272A" text-anchor="middle">현재 storage 버전으로 인코딩</text><rect x="40" y="600" width="520" height="128" rx="12" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/><text x="300.0" y="634" font-size="21" fill="#6D28D9" text-anchor="middle">etcd · 해당 CR의 저장본</text><text x="300.0" y="664" font-size="21" fill="#27272A" text-anchor="middle">이 쓰기 이후의 v1 바이트</text><rect x="80.0" y="772" width="440" height="28" fill="#FAFAFA"/><text x="300" y="792" font-size="21" fill="#27272A" text-anchor="middle">이후 v1alpha1로 읽는 예시</text><rect x="40" y="848" width="520" height="128" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/><text x="300.0" y="882" font-size="21" fill="#047857" text-anchor="middle">API 서버 · 읽기 변환</text><text x="300.0" y="912" font-size="21" fill="#27272A" text-anchor="middle">v1 → v1alpha1</text><text x="300.0" y="940" font-size="21" fill="#27272A" text-anchor="middle">입력과 읽기 목표를 대조</text><rect x="70.0" y="1020" width="460" height="28" fill="#FAFAFA"/><text x="300" y="1040" font-size="21" fill="#27272A" text-anchor="middle">필요한 변환을 Webhook에 요청</text><rect x="40" y="1096" width="520" height="104" rx="12" fill="#F8FAFC" stroke="#475569" stroke-width="1.5"/><text x="300.0" y="1130" font-size="21" fill="#334155" text-anchor="middle">클라이언트 · 읽기 응답</text><text x="300.0" y="1160" font-size="21" fill="#27272A" text-anchor="middle">요청한 v1alpha1 표현</text><text x="300" y="1264" font-size="21" fill="#27272A" text-anchor="middle">다른 CR은 옛 저장 버전으로 남을 수 있습니다</text></g></svg>