<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 976" role="img" aria-labelledby="title desc"><title id="title">PID namespace의 객체 존재와 실행 가능성은 다릅니다</title><desc id="desc">PID namespace의 init이 종료되면 커널은 새 PID 할당을 차단하고 나머지 프로세스에 SIGKILL을 보낸다. 미리 열린 FD 같은 참조가 있으면 객체는 남을 수 있다. 하지만 그 namespace를 후속 자식의 대상으로 선택하고 새 프로세스를 만들려고 하면 ENOMEM으로 실패할 수 있다. PID setns는 호출자 자신을 옮기는 작업이 아니다. 이는 network namespace의 일반적인 마지막 프로세스 종료와 구분해야 한다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#334155"/></marker></defs><rect width="600" height="976" rx="16" fill="#FAFAFA"/><g font-family="Pretendard, Apple SD Gothic Neo, system-ui, sans-serif"><text x="300" y="44" font-size="24" fill="#0A0A0A" text-anchor="middle">PID namespace는 init 종료가 특별합니다</text><rect x="40" y="112" width="520" height="104" rx="12" fill="#FFF1F2" stroke="#E11D48" stroke-width="1.5"/><text x="300.0" y="146" font-size="21" fill="#BE123C" text-anchor="middle">PID 1 · namespace init 종료</text><text x="300.0" y="176" font-size="21" fill="#27272A" text-anchor="middle">해당 PID namespace의 실행 기반 상실</text><path d="M300 216 V336" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="336" width="520" height="132" rx="12" fill="#FFF1F2" stroke="#E11D48" stroke-width="1.5"/><text x="300.0" y="370" font-size="21" fill="#BE123C" text-anchor="middle">커널 · 새 PID 할당 차단</text><text x="300.0" y="400" font-size="21" fill="#27272A" text-anchor="middle">나머지 프로세스에 SIGKILL</text><text x="300.0" y="428" font-size="21" fill="#27272A" text-anchor="middle">종료 처리를 진행</text><path d="M300 468 V588" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><rect x="50.0" y="508" width="500" height="28" fill="#FAFAFA"/><text x="300" y="528" font-size="21" fill="#27272A" text-anchor="middle">미리 열린 namespace FD 등이 남았다면</text><rect x="40" y="588" width="520" height="104" rx="12" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/><text x="300.0" y="622" font-size="21" fill="#6D28D9" text-anchor="middle">참조로 객체를 유지할 수 있음</text><text x="300.0" y="652" font-size="21" fill="#27272A" text-anchor="middle">객체 존재가 실행 가능성을 보장하지 않음</text><path d="M300 692 V812" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><rect x="40.0" y="732" width="520" height="28" fill="#FAFAFA"/><text x="300" y="752" font-size="21" fill="#27272A" text-anchor="middle">그 namespace에 새 자식을 생성하려는 경우</text><rect x="40" y="812" width="520" height="104" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/><text x="300.0" y="846" font-size="21" fill="#B45309" text-anchor="middle">새 프로세스 생성 실패</text><text x="300.0" y="876" font-size="21" fill="#27272A" text-anchor="middle">이 경로의 ENOMEM은 메모리 부족과 구분</text></g></svg>