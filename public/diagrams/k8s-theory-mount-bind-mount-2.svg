<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 650" width="760" height="650" role="img" aria-labelledby="title desc">
  <title id="title">호스트와 드라이버 컨테이너 사이의 mount 전파 방향</title>
  <desc id="desc">HostToContainer는 호스트 쪽 mount 사건만 컨테이너로 전달합니다. Bidirectional은 필요한 shared peer 관계에서 컨테이너가 만든 mount 사건도 호스트로 전달합니다. 파일 내용 복사와는 다릅니다</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#475569"/></marker></defs>
  <rect width="760" height="650" rx="20" fill="#FAFAFA"/>
  <g font-family="Pretendard, Apple SD Gothic Neo, system-ui, sans-serif" text-anchor="middle" fill="#0A0A0A">
    <text x="380" y="49" font-size="28" font-weight="700">새 mount 사건이 어느 쪽으로 보이나</text>
    <text x="380" y="105" font-size="27" font-weight="700">HostToContainer · rslave</text>
    <rect x="40" y="139" width="240" height="100" rx="14" fill="#F8FAFC" stroke="#475569" stroke-width="2"/>
    <rect x="480" y="139" width="240" height="100" rx="14" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
    <text x="160" y="180" font-size="26" font-weight="700">호스트</text>
    <text x="160" y="216" font-size="24">master 쪽 경로</text>
    <text x="600" y="180" font-size="26" font-weight="700" fill="#047857">드라이버</text>
    <text x="600" y="216" font-size="24">컨테이너 경로</text>
    <path d="M280 189 H465" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="380" y="285" font-size="25">호스트에서 받음 · 호스트로 보내지 않음</text>
    <path d="M40 319 H720" stroke="#D4D4D8" stroke-width="1.5"/>
    <text x="380" y="365" font-size="27" font-weight="700">Bidirectional · rshared</text>
    <rect x="40" y="399" width="240" height="100" rx="14" fill="#F8FAFC" stroke="#475569" stroke-width="2"/>
    <rect x="480" y="399" width="240" height="100" rx="14" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
    <text x="160" y="440" font-size="26" font-weight="700">호스트</text>
    <text x="160" y="476" font-size="24">peer 쪽 경로</text>
    <text x="600" y="440" font-size="26" font-weight="700" fill="#047857">드라이버</text>
    <text x="600" y="476" font-size="24">컨테이너 경로</text>
    <path d="M280 427 H465" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M480 472 H295" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="380" y="545" font-size="25">필요한 peer 관계 아래에서 양방향 전파</text>
    <text x="380" y="604" font-size="24" fill="#334155">별도 mount namespace를 쓰는 배포 예시</text>
  </g>
</svg>
