<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
<title id="title">최신성 확인과 progress 응답의 차이</title><desc id="desc">최신 LIST는 etcd의 linearizable 읽기로 기준 revision을 얻고 그 지점까지 캐시를 기다립니다. progress는 연결 멤버의 적용 지점까지 알려 주며 스스로 quorum 확인을 대체하지 않습니다.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#475569"/></marker></defs>
<rect width="800" height="600" rx="16" fill="#FAFAFA"/>
<g font-family="Pretendard, system-ui, sans-serif">
<text x="400" y="44" text-anchor="middle" font-size="22" font-weight="700" fill="#0A0A0A"><tspan x="400" dy="0">최신 LIST의 기준과 캐시 진행 지점은 다릅니다</tspan></text>
<rect x="208" y="80" width="384" height="65" rx="12" fill="#F8FAFC" stroke="#475569" stroke-width="1.5"/>
<text x="400.0" y="118.5" text-anchor="middle" font-size="17" font-weight="600" fill="#334155"><tspan x="400.0" dy="0">클라이언트: 최신 LIST 요청</tspan></text>
<path d="M400 145 V185" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="208" y="190" width="384" height="80" rx="12" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
<text x="400.0" y="224.0" text-anchor="middle" font-size="17" font-weight="600" fill="#6D28D9"><tspan x="400.0" dy="0">etcd에서 기준 revision 확인</tspan><tspan x="400.0" dy="25">linearizable 읽기 · quorum 필요</tspan></text>
<path d="M400 270 V315" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="208" y="320" width="384" height="80" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
<text x="400.0" y="354.0" text-anchor="middle" font-size="17" font-weight="600" fill="#047857"><tspan x="400.0" dy="0">watch cache</tspan><tspan x="400.0" dy="25">기준 revision까지 반영을 기다림</tspan></text>
<path d="M400 400 V445" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="208" y="450" width="384" height="65" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
<text x="400.0" y="488.5" text-anchor="middle" font-size="17" font-weight="600" fill="#047857"><tspan x="400.0" dy="0">캐시의 목록으로 응답</tspan></text>
<rect x="24" y="320" width="160" height="80" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
<text x="104.0" y="354.0" text-anchor="middle" font-size="17" font-weight="600" fill="#B45309"><tspan x="104.0" dy="0">progress</tspan><tspan x="104.0" dy="25">멤버 적용 지점</tspan></text>
<path d="M184 360 H202" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="5 4"/>
<text x="400" y="560" text-anchor="middle" font-size="15" font-weight="400" fill="#475569"><tspan x="400" dy="0">progress만으로 다수 쪽의 최신 쓰기를 확인할 수는 없습니다</tspan></text>
</g>
</svg>
