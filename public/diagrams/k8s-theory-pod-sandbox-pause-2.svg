<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 928" role="img" aria-labelledby="title desc"><title id="title">veth의 노드 쪽 끝에서 전달 경로가 갈립니다</title><desc id="desc">bridge와 Cilium의 veth 기반 구성을 비교한다. 두 경우 모두 Pod namespace의 eth0와 노드 namespace의 인터페이스가 veth pair로 연결된다. 노드 쪽 끝을 Linux bridge에 붙이거나 TC hook의 eBPF 프로그램으로 처리한다. 두 예시에서 veth는 유지되며 모든 eBPF 장치 모드가 이 구조라는 뜻은 아니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#334155"/></marker></defs><rect width="600" height="928" rx="16" fill="#FAFAFA"/><g font-family="Pretendard, Apple SD Gothic Neo, system-ui, sans-serif"><text x="300" y="40" font-size="24" fill="#0A0A0A" text-anchor="middle">veth는 남고 노드 쪽 처리가 갈립니다</text><text x="160" y="96" font-size="22" fill="#047857" text-anchor="middle">bridge 예시</text><text x="440" y="96" font-size="22" fill="#6D28D9" text-anchor="middle">Cilium veth 예시</text><path d="M160 232 V328" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><path d="M160 432 V528" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><path d="M440 232 V328" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><path d="M440 432 V528" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><path d="M160 660 V708 H240 V756" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><path d="M440 660 V708 H360 V756" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="128" width="240" height="104" rx="12" fill="#F8FAFC" stroke="#475569" stroke-width="1.5"/><text x="160.0" y="162" font-size="21" fill="#334155" text-anchor="middle">Pod network ns<tspan x="160.0" y="192" font-size="21">eth0 · Pod 쪽 끝</tspan></text><rect x="40" y="328" width="240" height="104" rx="12" fill="#F8FAFC" stroke="#475569" stroke-width="1.5"/><text x="160.0" y="362" font-size="21" fill="#334155" text-anchor="middle">노드 network ns<tspan x="160.0" y="392" font-size="21">veth · 노드 쪽 끝</tspan></text><rect x="320" y="128" width="240" height="104" rx="12" fill="#F8FAFC" stroke="#475569" stroke-width="1.5"/><text x="440.0" y="162" font-size="21" fill="#334155" text-anchor="middle">Pod network ns<tspan x="440.0" y="192" font-size="21">eth0 · Pod 쪽 끝</tspan></text><rect x="320" y="328" width="240" height="104" rx="12" fill="#F8FAFC" stroke="#475569" stroke-width="1.5"/><text x="440.0" y="362" font-size="21" fill="#334155" text-anchor="middle">노드 network ns<tspan x="440.0" y="392" font-size="21">veth · 노드 쪽 끝</tspan></text><rect x="70.0" y="272" width="180" height="28" fill="#FAFAFA"/><text x="160" y="292" font-size="21" fill="#27272A" text-anchor="middle">veth pair</text><rect x="60.0" y="472" width="200" height="28" fill="#FAFAFA"/><text x="160" y="492" font-size="21" fill="#27272A" text-anchor="middle">노드 쪽 처리</text><rect x="350.0" y="272" width="180" height="28" fill="#FAFAFA"/><text x="440" y="292" font-size="21" fill="#27272A" text-anchor="middle">veth pair</text><rect x="340.0" y="472" width="200" height="28" fill="#FAFAFA"/><text x="440" y="492" font-size="21" fill="#27272A" text-anchor="middle">노드 쪽 처리</text><rect x="40" y="528" width="240" height="132" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/><text x="160.0" y="562" font-size="21" fill="#047857" text-anchor="middle">Linux bridge<tspan x="160.0" y="592" font-size="21">MAC 학습</tspan><tspan x="160.0" y="620" font-size="21">프레임 전달</tspan></text><rect x="320" y="528" width="240" height="132" rx="12" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/><text x="440.0" y="562" font-size="21" fill="#6D28D9" text-anchor="middle">TC hook의 eBPF<tspan x="440.0" y="592" font-size="21">정책 적용</tspan><tspan x="440.0" y="620" font-size="21">전달 처리</tspan></text><rect x="40" y="756" width="520" height="104" rx="12" fill="#F8FAFC" stroke="#475569" stroke-width="1.5"/><text x="300.0" y="790" font-size="21" fill="#334155" text-anchor="middle">다음 목적지로 전달<tspan x="300.0" y="820" font-size="21">다른 Pod 또는 노드의 네트워크 경로</tspan></text><text x="300" y="904" font-size="21" fill="#27272A" text-anchor="middle">두 veth 기반 구성을 비교한 예시입니다</text></g></svg>