<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 808" role="img" aria-labelledby="title desc"><title id="title">Job의 판정과 최종 완료는 다른 단계입니다</title><desc id="desc">Job 컨트롤러는 Pod 결과와 정책을 평가해 실패 대상 또는 성공 기준 충족을 기록한다. 남은 Pod 종료와 결과 집계를 처리한 뒤 Failed 또는 Complete를 기록하며 TTL 삭제는 별도 컨트롤러가 맡는다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#334155"/></marker></defs><rect width="800" height="808" rx="16" fill="#FAFAFA"/><g font-family="Pretendard, Apple SD Gothic Neo, system-ui, sans-serif"><text x="400" y="40" font-size="23" fill="#0A0A0A" text-anchor="middle">Pod 결과를 세고, 종료를 정리한 뒤 최종 조건을 기록합니다</text><path d="M400 184 V232 H208 V280" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><path d="M400 232 H592 V280" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><path d="M208 392 V448 H400 V496" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><path d="M592 392 V448 H400" fill="none" stroke="#334155" stroke-width="2"/><path d="M400 584 V672" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><rect x="176" y="96" width="448" height="88" rx="12" fill="#F8FAFC" stroke="#475569" stroke-width="1.5"/><text x="400.0" y="130" font-size="21" fill="#334155" text-anchor="middle">Job 컨트롤러: Pod 결과·정책 평가<tspan x="400.0" y="160" font-size="18">기존 중간 조건을 먼저 존중</tspan></text><rect x="113.0" y="236" width="190" height="28" fill="#FAFAFA"/><text x="208" y="256" font-size="17" fill="#27272A" text-anchor="middle">실패 기준 충족</text><rect x="497.0" y="236" width="190" height="28" fill="#FAFAFA"/><text x="592" y="256" font-size="17" fill="#27272A" text-anchor="middle">성공 기준 충족</text><rect x="56" y="280" width="304" height="112" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/><text x="208.0" y="314" font-size="21" fill="#B45309" text-anchor="middle">FailureTarget<tspan x="208.0" y="344" font-size="18">실패 이유 기록</tspan><tspan x="208.0" y="372" font-size="18">남은 활성 Pod 종료</tspan></text><rect x="440" y="280" width="304" height="112" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/><text x="592.0" y="314" font-size="21" fill="#047857" text-anchor="middle">SuccessCriteriaMet<tspan x="592.0" y="344" font-size="17">성공 이유 기록</tspan><tspan x="592.0" y="372" font-size="17">필요한 Pod 종료 처리</tspan></text><rect x="112" y="496" width="576" height="88" rx="12" fill="#F8FAFC" stroke="#475569" stroke-width="1.5"/><text x="400.0" y="530" font-size="21" fill="#334155" text-anchor="middle">Pod 종료와 결과 집계 정리<tspan x="400.0" y="560" font-size="17">미집계 Pod·종료 중 Pod가 남으면 최종 판정 대기</tspan></text><rect x="305.0" y="612" width="190" height="28" fill="#FAFAFA"/><text x="400" y="632" font-size="17" fill="#27272A" text-anchor="middle">정리가 끝나면</text><rect x="176" y="672" width="448" height="80" rx="12" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/><text x="400.0" y="706" font-size="21" fill="#6D28D9" text-anchor="middle">Failed 또는 Complete<tspan x="400.0" y="736" font-size="18">Job의 최종 condition</tspan></text><text x="400" y="784" font-size="17" fill="#27272A" text-anchor="middle">완료 Job의 TTL 삭제는 별도 컨트롤러가 담당합니다</text></g></svg>