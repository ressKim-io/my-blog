<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1110" width="760" height="1110" role="img" aria-labelledby="title desc">
  <title id="title">외부 큐 요청의 접수와 비동기 준비</title>
  <desc id="desc">사용자 요청이 API 서버에서 수락돼 CR에 저장된 뒤 controller가 외부 큐와 Secret을 조정하고 CR의 status에 결과를 기록합니다. 요청 경로의 검증과 필요한 변환은 접수에 영향을 주며 controller나 외부 의존성 오류는 저장 이후 수렴과 상태 갱신을 늦출 수 있습니다</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#475569"/></marker>
  </defs>
  <rect width="760" height="1110" rx="20" fill="#FAFAFA"/>
  <g font-family="Pretendard, Apple SD Gothic Neo, system-ui, sans-serif" text-anchor="middle" fill="#0A0A0A">
    <text x="380" y="51" font-size="29" font-weight="700">접수 완료와 준비 완료는 다른 시점</text>
    <rect x="100" y="82" width="560" height="80" rx="15" fill="#F8FAFC" stroke="#475569" stroke-width="2"/>
    <text x="380" y="132" font-size="27" font-weight="700">사용자: 외부 큐 생성 요청</text>
    <path d="M380 162 V204" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="50" y="218" width="660" height="176" rx="15" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
    <text x="380" y="261" font-size="28" font-weight="700" fill="#047857">API 서버의 요청 처리</text>
    <text x="380" y="304" font-size="26">검증·필요한 변환·매칭된 외부 호출</text>
    <text x="380" y="352" font-size="24">거절·오류의 영향은 경로와 설정에 따름</text>
    <path d="M380 394 V446" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="100" y="460" width="560" height="108" rx="15" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
    <text x="380" y="503" font-size="28" font-weight="700" fill="#6D28D9">CR 저장: 요청 접수</text>
    <text x="380" y="544" font-size="25">외부 큐의 준비까지 보장하지 않음</text>
    <path d="M380 568 V662" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
    <rect x="266" y="598" width="228" height="40" rx="8" fill="#FAFAFA"/>
    <text x="380" y="626" font-size="24">저장 후 비동기 조정</text>
    <rect x="50" y="676" width="660" height="176" rx="15" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
    <text x="380" y="721" font-size="28" font-weight="700" fill="#047857">컨트롤러: 외부 큐·Secret 조정</text>
    <text x="380" y="765" font-size="25">중단·권한·외부 오류로 수렴이 지연됨</text>
    <text x="380" y="808" font-size="25">상태 갱신과 삭제 정리도 지연될 수 있음</text>
    <path d="M380 852 V904" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
    <rect x="100" y="918" width="560" height="110" rx="15" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
    <text x="380" y="962" font-size="27" font-weight="700" fill="#6D28D9">CR의 status에 관찰 결과 기록</text>
    <text x="380" y="1004" font-size="25">준비·실패·삭제 진행과 관찰한 세대</text>
    <text x="380" y="1076" font-size="24" fill="#334155">큐 요청을 가정한 역할 비교 · 고정 호출 순서 아님</text>
  </g>
</svg>
