<svg xmlns="http://www.w3.org/2000/svg" width="560" height="896" viewBox="0 0 560 896" role="img" aria-labelledby="title desc">
<title id="title">init·sidecar·앱의 실행 구간별 요청 합계</title>
<desc id="desc">일반 init A, restartable init sidecar S, 일반 init B, 앱 C·D 순서의 가정입니다. A와 B는 순차 실행되고 S는 뒤의 B·앱 구간과 겹칩니다. 각 자원에서 A, S, S+B, S+C+D의 최댓값을 고르는 컨테이너 수준 집계이며 CPU와 메모리의 최대 단계는 다를 수 있습니다. 막대 길이는 실측 시간이나 사용량이 아닙니다.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#475569"/></marker>

</defs>
<rect width="560" height="896" rx="16" fill="#FAFAFA"/>
<g font-family="Pretendard, Apple SD Gothic Neo, system-ui, sans-serif">
<text x="280" y="44" font-size="24" fill="#0A0A0A" text-anchor="middle" font-weight="700">실행 구간별 요청을 더합니다</text>
<text x="280" y="84" font-size="21" fill="#334155" text-anchor="middle">컨테이너 수준 집계 · 가정 예시</text>
<text x="280" y="124" font-size="22" fill="#334155" text-anchor="middle">실행 단계 →</text>
<text x="190" y="168" font-size="22" fill="#0A0A0A" text-anchor="middle">① A</text>
<text x="282" y="168" font-size="22" fill="#0A0A0A" text-anchor="middle">② S</text>
<text x="374" y="168" font-size="22" fill="#0A0A0A" text-anchor="middle">③ B</text>
<text x="466" y="168" font-size="22" fill="#0A0A0A" text-anchor="middle">④ 앱</text>
<path d="M144 188 V500" fill="none" stroke="#D4D4D8" stroke-width="1" stroke-dasharray="4 6"/>
<path d="M236 188 V500" fill="none" stroke="#D4D4D8" stroke-width="1" stroke-dasharray="4 6"/>
<path d="M328 188 V500" fill="none" stroke="#D4D4D8" stroke-width="1" stroke-dasharray="4 6"/>
<path d="M420 188 V500" fill="none" stroke="#D4D4D8" stroke-width="1" stroke-dasharray="4 6"/>
<path d="M512 188 V500" fill="none" stroke="#D4D4D8" stroke-width="1" stroke-dasharray="4 6"/>
<text x="32" y="243" font-size="22" fill="#334155" text-anchor="start">init A</text>
<rect x="148" y="218" width="84" height="36" rx="6" fill="#F8FAFC" stroke="#475569" stroke-width="2" />
<text x="32" y="299" font-size="22" fill="#B45309" text-anchor="start">sidecar S</text>
<rect x="240" y="274" width="272" height="36" rx="6" fill="#FFFBEB" stroke="#D97706" stroke-width="2" />
<path d="M512 274 L530 292 L512 310 Z" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
<text x="32" y="355" font-size="22" fill="#334155" text-anchor="start">init B</text>
<rect x="332" y="330" width="84" height="36" rx="6" fill="#F8FAFC" stroke="#475569" stroke-width="2" />
<text x="32" y="411" font-size="22" fill="#047857" text-anchor="start">앱 C</text>
<rect x="424" y="386" width="88" height="36" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="2" />
<path d="M512 386 L530 404 L512 422 Z" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
<text x="32" y="467" font-size="22" fill="#047857" text-anchor="start">앱 D</text>
<rect x="424" y="442" width="88" height="36" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="2" />
<path d="M512 442 L530 460 L512 478 Z" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
<text x="32" y="548" font-size="22" fill="#0A0A0A" text-anchor="start" font-weight="700">각 단계의 요청 합계</text>
<text x="190" y="592" font-size="22" fill="#334155" text-anchor="middle">A</text>
<text x="282" y="592" font-size="22" fill="#334155" text-anchor="middle">S</text>
<text x="374" y="592" font-size="22" fill="#334155" text-anchor="middle">S+B</text>
<text x="466" y="592" font-size="22" fill="#334155" text-anchor="middle">S+C+D</text>
<path d="M148 612 V628 H512 V612" fill="none" stroke="#475569" stroke-width="2"/>
<path d="M330 628 V664" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<text x="280" y="704" font-size="23" fill="#0A0A0A" text-anchor="middle" font-weight="700">자원별로 가장 큰 합계 선택</text>
<text x="280" y="744" font-size="22" fill="#334155" text-anchor="middle">max(A, S, S+B, S+C+D)</text>
<text x="280" y="792" font-size="21" fill="#334155" text-anchor="middle">CPU와 메모리의 최대 단계는 다를 수 있음</text>
<text x="280" y="836" font-size="20" fill="#334155" text-anchor="middle">문자 = 각 컨테이너의 해당 자원 request</text>
<text x="280" y="868" font-size="20" fill="#334155" text-anchor="middle">막대 = 겹치는 실행 구간 · 시간/사용량 축척 아님</text>
</g>
</svg>
