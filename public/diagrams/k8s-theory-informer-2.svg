<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="title desc"><title id="title">새 snapshot과 resync는 다른 정보를 사용합니다</title><desc id="desc">로컬에는 a,b,c가 남았지만 서버에는 a,b만 있다는 가정이다. 새 snapshot은 c의 삭제를 발견해 tombstone을 만들 수 있다. resync는 로컬 상태를 재처리하므로 서버에서 c가 없어졌다는 정보를 얻지 못한다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/></marker><marker id="rose-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#BE123C"/></marker></defs>
<rect width="800" height="560" rx="16" fill="#FAFAFA"/>
<g font-family="Pretendard, Apple SD Gothic Neo, system-ui, sans-serif">
<text x="32" y="40" font-size="23" fill="#0A0A0A" text-anchor="start">새 snapshot과 resync는 다른 정보를 사용합니다</text>
<path d="M 400 144 V 184 H 216 V 224" fill="none" stroke="#334155" stroke-width="2"  marker-end="url(#arrow)"/>
<path d="M 400 184 H 584 V 224" fill="none" stroke="#334155" stroke-width="2"  marker-end="url(#arrow)"/>
<path d="M 216 304 V 384" fill="none" stroke="#334155" stroke-width="2"  marker-end="url(#arrow)"/>
<path d="M 584 304 V 384" fill="none" stroke="#334155" stroke-width="2"  marker-end="url(#arrow)"/>
<rect x="216" y="64" width="368" height="80" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/><text x="400.0" y="100.0" font-size="19" fill="#6D28D9" text-anchor="middle">로컬 사본: a · b · c</text><text x="400.0" y="126.0" font-size="16" fill="#6D28D9" text-anchor="middle">서버에서는 c가 삭제됐다는 가정</text>
<rect x="48" y="224" width="336" height="80" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/><text x="216.0" y="260.0" font-size="19" fill="#047857" text-anchor="middle">새 snapshot: a · b</text><text x="216.0" y="286.0" font-size="16" fill="#047857" text-anchor="middle">서버에서 전체 상태를 다시 수신</text>
<rect x="416" y="224" width="336" height="80" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/><text x="584.0" y="260.0" font-size="19" fill="#6D28D9" text-anchor="middle">resync: a · b · c</text><text x="584.0" y="286.0" font-size="16" fill="#6D28D9" text-anchor="middle">로컬에 이미 있는 상태를 재처리</text>
<rect x="48" y="384" width="336" height="88" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/><text x="216.0" y="424.0" font-size="19" fill="#047857" text-anchor="middle">차집합에서 c의 삭제 발견</text><text x="216.0" y="450.0" font-size="16" fill="#047857" text-anchor="middle">마지막 값으로 tombstone 구성</text>
<rect x="416" y="384" width="336" height="88" rx="10" fill="#F8FAFC" stroke="#475569" stroke-width="1.5"/><text x="584.0" y="424.0" font-size="19" fill="#334155" text-anchor="middle">c가 실제로 사라진지는 모름</text><text x="584.0" y="450.0" font-size="16" fill="#334155" text-anchor="middle">서버의 새 정보가 없음</text>
<text x="400" y="524" font-size="18" fill="#27272A" text-anchor="middle">tombstone의 마지막 값은 삭제 직전 상태와 다를 수 있습니다</text>
</g></svg>