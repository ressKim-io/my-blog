<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 736" role="img" aria-labelledby="title desc"><title id="title">동적 할당이 먼저 사용하는 높은 주소 구간</title><desc id="desc">10.96.0.0/16의 offset 256 예시다. 낮은 주소 구간은 10.96.0.1부터 10.96.1.0까지 256개이고, 높은 주소 구간은 10.96.1.1부터 10.96.255.254까지다. 동적 할당은 높은 구간을 먼저 사용하고 가득 차면 낮은 구간으로 돌아온다. 수동 지정은 양쪽에서 가능하며 그림의 구간 크기는 비례하지 않는다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#334155"/></marker></defs><rect width="600" height="736" rx="16" fill="#FAFAFA"/><g font-family="Pretendard, Apple SD Gothic Neo, system-ui, sans-serif"><text x="300" y="40" font-size="24" fill="#0A0A0A" text-anchor="middle">동적 할당은 높은 주소 구간부터</text><text x="300" y="88" font-size="21" fill="#27272A" text-anchor="middle">10.96.0.0/16 · offset 256 예시</text><path d="M300 448 V280" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="136" width="520" height="144" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/><text x="300.0" y="170" font-size="21" fill="#B45309" text-anchor="middle">낮은 주소 구간 · 256개<tspan x="300.0" y="200" font-size="21">10.96.0.1 ~ 10.96.1.0</tspan><tspan x="300.0" y="228" font-size="21">동적 할당 2순위 · 수동 지정 가능</tspan></text><rect x="65.0" y="348" width="470" height="28" fill="#FAFAFA"/><text x="300" y="368" font-size="21" fill="#27272A" text-anchor="middle">높은 구간이 가득 차면 낮은 구간으로</text><rect x="40" y="448" width="520" height="144" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/><text x="300.0" y="482" font-size="21" fill="#047857" text-anchor="middle">높은 주소 구간<tspan x="300.0" y="512" font-size="21">10.96.1.1 ~ 10.96.255.254</tspan><tspan x="300.0" y="540" font-size="21">동적 할당 1순위 · 수동 지정 가능</tspan></text><text x="300" y="656" font-size="21" fill="#27272A" text-anchor="middle">구간 크기를 비례로 그린 그림은 아닙니다</text><text x="300" y="696" font-size="21" fill="#27272A" text-anchor="middle">낮은 구간도 수동 전용 예약 영역은 아닙니다</text></g></svg>