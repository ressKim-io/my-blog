<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 928" role="img" aria-labelledby="title desc"><title id="title">주소를 확보한 뒤 Service를 저장합니다</title><desc id="desc">ClusterIP 주소 하나의 할당 순서다. API 서버의 할당기가 사용 가능한 범위에서 후보를 고르고 정규형 주소를 이름으로 IPAddress를 생성한다. 생성에 성공한 뒤 그 주소를 가진 Service를 저장한다. 두 오브젝트를 하나의 원자적 쓰기로 저장하지 않으며 Service 저장 실패 시 주소 해제를 시도하고 남은 불일치는 repair가 대조한다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#334155"/></marker></defs><rect width="600" height="928" rx="16" fill="#FAFAFA"/><g font-family="Pretendard, Apple SD Gothic Neo, system-ui, sans-serif"><text x="300" y="40" font-size="24" fill="#0A0A0A" text-anchor="middle">주소 하나를 먼저 확보한 뒤 저장합니다</text><text x="300" y="88" font-size="21" fill="#27272A" text-anchor="middle">Kubernetes v1.37.1 · ClusterIP 할당</text><path d="M300 232 V352" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><path d="M300 496 V616" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="128" width="520" height="104" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/><text x="300.0" y="162" font-size="21" fill="#B45309" text-anchor="middle">API 서버 · 주소 할당기<tspan x="300.0" y="192" font-size="21">사용 가능한 범위에서 후보 선택</tspan></text><rect x="125.0" y="268" width="350" height="28" fill="#FAFAFA"/><text x="300" y="288" font-size="21" fill="#27272A" text-anchor="middle">후보 주소로 API Create</text><rect x="40" y="352" width="520" height="144" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/><text x="300.0" y="386" font-size="21" fill="#047857" text-anchor="middle">IPAddress 생성<tspan x="300.0" y="416" font-size="21">metadata.name = 정규형 주소</tspan><tspan x="300.0" y="444" font-size="21">Create 성공 시 주소 확보</tspan></text><rect x="125.0" y="540" width="350" height="28" fill="#FAFAFA"/><text x="300" y="560" font-size="21" fill="#27272A" text-anchor="middle">주소 확보에 성공한 뒤</text><rect x="40" y="616" width="520" height="104" rx="12" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/><text x="300.0" y="650" font-size="21" fill="#6D28D9" text-anchor="middle">Service 저장<tspan x="300.0" y="680" font-size="21">spec.clusterIPs에 확보한 주소 반영</tspan></text><text x="300" y="784" font-size="21" fill="#27272A" text-anchor="middle">두 저장을 묶는 원자성은 없습니다</text><text x="300" y="832" font-size="21" fill="#27272A" text-anchor="middle">Service 저장 실패 시 주소 해제 시도</text><text x="300" y="880" font-size="21" fill="#27272A" text-anchor="middle">남은 불일치는 repair가 대조합니다</text></g></svg>