<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1024" role="img" aria-labelledby="swap-title swap-desc">
  <title id="swap-title">kubelet 기동 허용에서 컨테이너 swap 상한까지</title>
  <desc id="swap-desc">failSwapOn false로 기동을 허용한 뒤 LimitedSwap 정책에서 노드, Pod, 컨테이너 조건을 검사합니다. 조건을 통과하면 컨테이너 memory request 비율로 swap 상한을 계산하고 CRI를 통해 런타임이 cgroup에 적용합니다. 조건에서 제외되면 NoSwap을 적용합니다</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 10 4 0 8Z" fill="#475569"/></marker>
  </defs>
  <rect width="640" height="1024" rx="16" fill="#FAFAFA"/>
  <g font-family="'Pretendard', system-ui, sans-serif" text-anchor="middle" fill="#0A0A0A">
    <text x="320" y="44" font-size="28" font-weight="700">기동 허용과 swap 한도는 별도 결정</text>
    <g fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)">
      <path d="M320 208V248"/>
      <path d="M320 384V424"/>
      <path d="M320 576V616"/>
      <path d="M320 752V792"/>
    </g>
    <g stroke-width="1.5">
      <rect x="48" y="80" width="544" height="128" rx="12" fill="#FFFBEB" stroke="#D97706"/>
      <rect x="48" y="256" width="544" height="128" rx="12" fill="#FFFBEB" stroke="#D97706"/>
      <rect x="48" y="432" width="544" height="144" rx="12" fill="#ECFDF5" stroke="#059669"/>
      <rect x="48" y="624" width="544" height="128" rx="12" fill="#ECFDF5" stroke="#059669"/>
      <rect x="48" y="800" width="544" height="128" rx="12" fill="#F5F3FF" stroke="#7C3AED"/>
    </g>
    <g font-size="25" font-weight="700">
      <text x="320" y="116">1. kubelet 기동 허용</text>
      <text x="320" y="292">2. LimitedSwap 정책 선택</text>
      <text x="320" y="468">3. Pod·컨테이너 조건 검사</text>
      <text x="320" y="660">4. 컨테이너별 swap 상한</text>
      <text x="320" y="836">5. kubelet → CRI → 런타임</text>
    </g>
    <g font-size="23" fill="#27272A">
      <text x="320" y="151">failSwapOn: false</text>
      <text x="320" y="327">memorySwap.swapBehavior</text>
      <text x="320" y="503">노드 조건 · QoS · critical 여부</text>
      <text x="320" y="535">컨테이너 memory request·limit</text>
      <text x="320" y="562" font-size="21">제외되면 NoSwap</text>
      <text x="320" y="695">memory request / 노드 RAM</text>
      <text x="320" y="729">× 노드 swap 용량</text>
      <text x="320" y="871">Unified["memory.swap.max"]</text>
      <text x="320" y="905">컨테이너 cgroup에 적용</text>
      <text x="320" y="972" font-size="22">cgroup v2·swap controller가 있는 경로</text>
    </g>
  </g>
</svg>
