<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 720" role="img" aria-labelledby="title desc"><title id="title">stale이면 같은 내용도 다시 씁니다</title><desc id="desc">GuaranteedUpdate의 쓰기 생략 조건은 새 직렬화 바이트가 기존 바이트와 같고 stale이 false인 경우다. stale이 true이면 같은 내용이어도 현재 첫 변환기로 다시 변환해 revision을 조건으로 etcd에 쓴다. 다른 쓰기와 충돌하면 다시 읽고 재시도한다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#334155"/></marker></defs><rect width="800" height="720" rx="16" fill="#FAFAFA"/><g font-family="Pretendard, Apple SD Gothic Neo, system-ui, sans-serif"><text x="400" y="40" font-size="24" fill="#0A0A0A" text-anchor="middle">stale이면 같은 내용도 다시 씁니다</text><path d="M 280 176 V 256" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><path d="M 280 336 V 416" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><path d="M 280 496 V 576" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><path d="M 488 296 H 560" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><rect x="72" y="96" width="416" height="80" rx="12" stroke="#475569" fill="#F8FAFC" stroke-width="1.5"/><text x="280.0" y="128.0" font-size="21" fill="#334155" text-anchor="middle">갱신에 사용할 현재 상태</text><text x="280.0" y="156.0" font-size="17" fill="#334155" text-anchor="middle">기존 바이트 · revision · stale</text><rect x="72" y="256" width="416" height="80" rx="12" stroke="#059669" fill="#ECFDF5" stroke-width="1.5"/><text x="280.0" y="288.0" font-size="21" fill="#047857" text-anchor="middle">같은 바이트이고 !stale인가?</text><text x="280.0" y="316.0" font-size="17" fill="#047857" text-anchor="middle">필요하면 최신 저장 값으로 재확인</text><rect x="560" y="256" width="176" height="80" rx="12" stroke="#475569" fill="#F8FAFC" stroke-width="1.5"/><text x="648.0" y="288.0" font-size="21" fill="#334155" text-anchor="middle">쓰기 생략</text><text x="648.0" y="316.0" font-size="17" fill="#334155" text-anchor="middle">현재 값 반환</text><rect x="72" y="416" width="416" height="80" rx="12" stroke="#059669" fill="#ECFDF5" stroke-width="1.5"/><text x="280.0" y="448.0" font-size="21" fill="#047857" text-anchor="middle">현재 첫 변환기로 변환</text><text x="280.0" y="476.0" font-size="17" fill="#047857" text-anchor="middle">내용이 같아도 stale이면 실행</text><rect x="72" y="576" width="416" height="80" rx="12" stroke="#7C3AED" fill="#F5F3FF" stroke-width="1.5"/><text x="280.0" y="608.0" font-size="21" fill="#6D28D9" text-anchor="middle">revision 조건으로 etcd 쓰기</text><text x="280.0" y="636.0" font-size="17" fill="#6D28D9" text-anchor="middle">충돌하면 최신 값으로 재시도</text><text x="520" y="280" font-size="17" fill="#27272A" text-anchor="middle">예</text><text x="328" y="380" font-size="17" fill="#27272A" text-anchor="middle">아니요</text></g></svg>