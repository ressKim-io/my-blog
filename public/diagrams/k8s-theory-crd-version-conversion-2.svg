<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 960" role="img" aria-labelledby="title desc"><title id="title">저장 목표 변경과 전수 재쓰기는 별도입니다</title><desc id="desc">두 CR의 저장 형식을 비교하는 가정 예시다. 현재 저장 목표가 v1alpha1일 때 두 CR은 v1alpha1로 저장돼 있다. 목표를 v1으로 바꾸고 CR B만 다시 쓰면 CR A는 옛 버전이고 CR B는 새 버전인 채로 혼재하며 storedVersions에는 두 버전이 남는다. 전수 재쓰기 완료를 확인한 뒤 장부를 정리하면 두 CR과 장부를 v1에 맞출 수 있다. 장부 수정 자체는 CR을 재쓰지 않고 API 검증도 잔존 CR을 세지 않는다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#334155"/></marker></defs><rect width="600" height="960" rx="16" fill="#FAFAFA"/><g font-family="Pretendard, Apple SD Gothic Neo, system-ui, sans-serif"><text x="300" y="40" font-size="24" fill="#0A0A0A" text-anchor="middle">저장 목표 변경과 재쓰기는 별도입니다</text><text x="300" y="88" font-size="21" fill="#27272A" text-anchor="middle">CR A·B 두 객체의 저장 형식 · 가정 예시</text><path d="M300 272 V392" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><path d="M300 536 V656" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="128" width="520" height="144" rx="12" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/><text x="300.0" y="162" font-size="21" fill="#6D28D9" text-anchor="middle">storage: v1alpha1</text><text x="300.0" y="192" font-size="21" fill="#27272A" text-anchor="middle">CR A·B: v1alpha1</text><text x="300.0" y="220" font-size="21" fill="#27272A" text-anchor="middle">storedVersions: [v1alpha1]</text><rect x="50.0" y="316" width="500" height="28" fill="#FAFAFA"/><text x="300" y="336" font-size="21" fill="#27272A" text-anchor="middle">목표를 v1으로 변경 · CR B만 재쓰기</text><rect x="40" y="392" width="520" height="144" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/><text x="300.0" y="426" font-size="21" fill="#B45309" text-anchor="middle">storage: v1 · 옛 저장본과 혼재</text><text x="300.0" y="456" font-size="21" fill="#27272A" text-anchor="middle">CR A: v1alpha1 · CR B: v1</text><text x="300.0" y="484" font-size="21" fill="#27272A" text-anchor="middle">storedVersions: [v1alpha1, v1]</text><rect x="50.0" y="580" width="500" height="28" fill="#FAFAFA"/><text x="300" y="600" font-size="21" fill="#27272A" text-anchor="middle">전수 재쓰기 완료 확인 뒤 장부 정리</text><rect x="40" y="656" width="520" height="144" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/><text x="300.0" y="690" font-size="21" fill="#047857" text-anchor="middle">storage: v1</text><text x="300.0" y="720" font-size="21" fill="#27272A" text-anchor="middle">CR A·B: v1</text><text x="300.0" y="748" font-size="21" fill="#27272A" text-anchor="middle">storedVersions: [v1]</text><text x="300" y="864" font-size="21" fill="#27272A" text-anchor="middle">장부 수정 자체는 CR을 재쓰지 않습니다</text><text x="300" y="912" font-size="21" fill="#27272A" text-anchor="middle">API 검증은 잔존 CR을 세지 않습니다</text></g></svg>