<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1040" role="img" aria-labelledby="title desc"><title id="title">조건을 둔 DNS 질의 여덟 개 계산</title><desc id="desc">glibc가 ndots 5와 클러스터 search 세 개를 사용하고 각 후보에 A와 AAAA를 모두 묻는 예시다. 앞 세 후보는 NXDOMAIN을 받고 마지막 api.example.com 절대 이름에서 필요한 주소 응답을 얻는다. 캐시 적중과 재시도는 없다고 가정한다. 네 후보와 두 유형을 곱한 여덟 질의이며 네트워크 패킷 수가 아니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#334155"/></marker></defs><rect width="600" height="1040" rx="16" fill="#FAFAFA"/><g font-family="Pretendard, Apple SD Gothic Neo, system-ui, sans-serif"><text x="300" y="42" font-size="24" fill="#0A0A0A" text-anchor="middle">후보 이름마다 A와 AAAA를 묻는 예시</text><text x="300" y="88" font-size="21" fill="#27272A" text-anchor="middle">glibc · ndots 5 · search 세 개 · 캐시 없음</text><path d="M300 260 V340" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><rect x="130.0" y="288" width="340" height="28" fill="#FAFAFA"/><text x="300" y="308" font-size="21" fill="#27272A" text-anchor="middle">NXDOMAIN이면 다음 후보</text><path d="M300 472 V552" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><rect x="130.0" y="500" width="340" height="28" fill="#FAFAFA"/><text x="300" y="520" font-size="21" fill="#27272A" text-anchor="middle">NXDOMAIN이면 다음 후보</text><path d="M300 684 V764" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><rect x="130.0" y="712" width="340" height="28" fill="#FAFAFA"/><text x="300" y="732" font-size="21" fill="#27272A" text-anchor="middle">NXDOMAIN이면 다음 후보</text><rect x="40" y="128" width="520" height="132" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/><text x="300.0" y="162" font-size="21" fill="#B45309" text-anchor="middle">후보 1 · A와 AAAA<tspan x="300.0" y="192" font-size="21">api.example.com.&lt;ns&gt;.svc.cluster.local</tspan></text><rect x="40" y="340" width="520" height="132" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/><text x="300.0" y="374" font-size="21" fill="#B45309" text-anchor="middle">후보 2 · A와 AAAA<tspan x="300.0" y="404" font-size="21">api.example.com.svc.cluster.local</tspan></text><rect x="40" y="552" width="520" height="132" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/><text x="300.0" y="586" font-size="21" fill="#B45309" text-anchor="middle">후보 3 · A와 AAAA<tspan x="300.0" y="616" font-size="21">api.example.com.cluster.local</tspan></text><rect x="40" y="764" width="520" height="132" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/><text x="300.0" y="798" font-size="21" fill="#047857" text-anchor="middle">후보 4 · A와 AAAA<tspan x="300.0" y="828" font-size="21">api.example.com.</tspan><tspan x="300.0" y="856" font-size="21">필요한 주소 응답을 얻음</tspan></text><text x="300" y="952" font-size="23" fill="#27272A" text-anchor="middle">후보 4개 × 유형 2개 = 질의 8개</text><text x="300" y="992" font-size="21" fill="#27272A" text-anchor="middle">가정에 따른 질의 수이며 패킷 수가 아닙니다</text></g></svg>