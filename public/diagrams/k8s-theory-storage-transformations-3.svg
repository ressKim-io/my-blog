<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 704" role="img" aria-labelledby="title desc"><title id="title">새 구성이 적용되려면 검사까지 통과해야 합니다</title><desc id="desc">자동 재적재가 켜지면 기본 1분 주기로 파일 내용 해시를 비교한다. 해시가 같으면 그대로 유지하고 다르면 새 변환기를 구성하고 상태 검사를 한다. 성공해야 교체하며 실패하면 기존 구성을 유지하고 오류를 기록해 재시도한다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#334155"/></marker></defs><rect width="800" height="704" rx="16" fill="#FAFAFA"/><g font-family="Pretendard, Apple SD Gothic Neo, system-ui, sans-serif"><text x="400" y="40" font-size="24" fill="#0A0A0A" text-anchor="middle">새 구성이 적용되려면 검사까지 통과해야 합니다</text><path d="M 296 176 V 256" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><path d="M 296 328 V 408" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><path d="M 296 504 V 584" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><path d="M 496 292 H 568" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><path d="M 496 456 H 568" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><rect x="96" y="96" width="400" height="80" rx="12" stroke="#475569" fill="#F8FAFC" stroke-width="1.5"/><text x="296.0" y="128.0" font-size="21" fill="#334155" text-anchor="middle">파일 내용 해시 확인</text><text x="296.0" y="156.0" font-size="17" fill="#334155" text-anchor="middle">자동 재적재 활성 · 기본 1분 주기</text><rect x="96" y="256" width="400" height="72" rx="12" stroke="#059669" fill="#ECFDF5" stroke-width="1.5"/><text x="296.0" y="298.0" font-size="21" fill="#047857" text-anchor="middle">이전 적용 구성과 다른가?</text><rect x="568" y="256" width="176" height="72" rx="12" stroke="#475569" fill="#F8FAFC" stroke-width="1.5"/><text x="656.0" y="284.0" font-size="21" fill="#334155" text-anchor="middle">유지</text><text x="656.0" y="312.0" font-size="17" fill="#334155" text-anchor="middle">변경 없음</text><rect x="96" y="408" width="400" height="96" rx="12" stroke="#059669" fill="#ECFDF5" stroke-width="1.5"/><text x="296.0" y="448.0" font-size="21" fill="#047857" text-anchor="middle">새 변환기 구성</text><text x="296.0" y="476.0" font-size="17" fill="#047857" text-anchor="middle">새 구성의 상태 검사</text><rect x="568" y="416" width="176" height="80" rx="12" stroke="#E11D48" fill="#FFF1F2" stroke-width="1.5"/><text x="656.0" y="448.0" font-size="21" fill="#BE123C" text-anchor="middle">기존 구성 유지</text><text x="656.0" y="476.0" font-size="17" fill="#BE123C" text-anchor="middle">오류 기록·재시도</text><rect x="96" y="584" width="400" height="72" rx="12" stroke="#7C3AED" fill="#F5F3FF" stroke-width="1.5"/><text x="296.0" y="626.0" font-size="21" fill="#6D28D9" text-anchor="middle">실행 중인 변환기 교체</text><text x="336" y="220" font-size="17" fill="#27272A" text-anchor="middle">확인</text><text x="336" y="376" font-size="17" fill="#27272A" text-anchor="middle">예</text><text x="336" y="552" font-size="17" fill="#27272A" text-anchor="middle">성공</text><text x="528" y="276" font-size="16" fill="#27272A" text-anchor="middle">아니요</text><text x="528" y="440" font-size="16" fill="#27272A" text-anchor="middle">실패</text></g></svg>