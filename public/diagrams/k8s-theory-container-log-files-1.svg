<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 760" role="img" aria-labelledby="log-flow-title log-flow-desc">
  <title id="log-flow-title">컨테이너 출력이 노드 파일을 거쳐 조회되는 경로</title>
  <desc id="log-flow-desc">kubelet이 디렉터리와 경로를 정해 CRI로 전달하면 런타임이 파일을 기록합니다. kubelet은 선택한 컨테이너의 파일을 읽고 API 서버를 거쳐 kubectl에 반환합니다</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#475569"/></marker></defs>
  <rect width="560" height="760" fill="#FAFAFA" rx="16"/>
  <g font-family="Pretendard, system-ui, sans-serif" fill="#0A0A0A" text-anchor="middle">
    <text x="280" y="40" font-size="24" font-weight="700">경로 지정·기록·조회는 맡은 쪽이 다릅니다</text>
    <g stroke="#475569" stroke-width="2" marker-end="url(#arrow)" fill="none">
      <path d="M280 160V216"/><path d="M280 312V368"/><path d="M280 464V520"/><path d="M280 616V672"/>
    </g>
    <rect x="40" y="72" width="480" height="88" rx="12" fill="#FFFBEB" stroke="#D97706"/>
    <text x="280" y="106" font-size="22" font-weight="700">kubelet: 디렉터리 생성·경로 지정</text>
    <text x="280" y="138" font-size="20">Pod 디렉터리 + 컨테이너 상대 경로</text>
    <rect x="184" y="176" width="192" height="28" fill="#FAFAFA"/>
    <text x="280" y="196" font-size="20">CRI 설정으로 전달</text>
    <rect x="40" y="216" width="480" height="96" rx="12" fill="#ECFDF5" stroke="#059669"/>
    <text x="280" y="252" font-size="22" font-weight="700">런타임: stdout·stderr 기록</text>
    <text x="280" y="286" font-size="20">출력에 시각·스트림·태그를 붙입니다</text>
    <rect x="168" y="328" width="224" height="28" fill="#FAFAFA"/>
    <text x="280" y="348" font-size="20">지정받은 위치에 기록</text>
    <rect x="40" y="368" width="480" height="96" rx="12" fill="#F5F3FF" stroke="#7C3AED"/>
    <text x="280" y="404" font-size="22" font-weight="700">노드의 현재 로그 파일</text>
    <text x="280" y="438" font-size="20">컨테이너별 &lt;restart count&gt;.log</text>
    <rect x="120" y="480" width="320" height="28" fill="#FAFAFA"/>
    <text x="280" y="500" font-size="20">선택한 인스턴스의 LogPath 하나</text>
    <rect x="40" y="520" width="480" height="96" rx="12" fill="#FFFBEB" stroke="#D97706"/>
    <text x="280" y="556" font-size="22" font-weight="700">kubelet: 파일 읽기·필터링</text>
    <text x="280" y="590" font-size="20">회전본 목록을 모아 읽지는 않습니다</text>
    <rect x="160" y="632" width="240" height="28" fill="#FAFAFA"/>
    <text x="280" y="652" font-size="20">API 서버가 응답을 중계</text>
    <rect x="40" y="672" width="480" height="56" rx="12" fill="#ECFDF5" stroke="#059669"/>
    <text x="280" y="708" font-size="22" font-weight="700">kubectl logs: 터미널에 출력</text>
  </g>
</svg>
