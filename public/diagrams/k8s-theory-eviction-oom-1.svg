<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 664" role="img" aria-labelledby="title desc"><title id="title">종료와 삭제를 만드는 세 경로</title><desc id="desc">커널의 cgroup OOM은 프로세스를 종료하고, kubelet의 node-pressure 축출은 Pod를 Failed와 Evicted로 남긴다. Eviction API는 삭제를 허용하고 kubelet이 종료하며, 삭제 조건이 해소되면 Pod 오브젝트도 사라진다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#334155"/></marker></defs><rect width="800" height="664" rx="16" fill="#FAFAFA"/><g font-family="Pretendard, Apple SD Gothic Neo, system-ui, sans-serif"><text x="400" y="40" font-size="23" fill="#0A0A0A" text-anchor="middle">종료 주체와 Pod 오브젝트의 결과를 구분합니다</text><path d="M136 244 V 360" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><path d="M400 244 V 360" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><path d="M664 244 V 360" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="104" width="208" height="140" rx="12" fill="#F8FAFC" stroke="#475569" stroke-width="1.5"/><text x="136.0" y="138" font-size="21" fill="#334155" text-anchor="middle">커널<tspan x="136.0" y="168" font-size="17">한도 내 회수 실패</tspan><tspan x="136.0" y="196" font-size="17">cgroup OOM</tspan><tspan x="136.0" y="224" font-size="17">프로세스 종료</tspan></text><rect x="296" y="104" width="208" height="140" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/><text x="400.0" y="138" font-size="21" fill="#B45309" text-anchor="middle">kubelet<tspan x="400.0" y="168" font-size="17">노드 자원 신호</tspan><tspan x="400.0" y="196" font-size="17">node-pressure</tspan><tspan x="400.0" y="224" font-size="17">직접 Pod 축출</tspan></text><rect x="560" y="104" width="208" height="140" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/><text x="664.0" y="138" font-size="21" fill="#047857" text-anchor="middle">API 서버<tspan x="664.0" y="168" font-size="17">pods/eviction 요청</tspan><tspan x="664.0" y="196" font-size="17">정책 기반 삭제 허용</tspan><tspan x="664.0" y="224" font-size="17">kubelet이 종료 진행</tspan></text><rect x="41.0" y="284" width="190" height="28" fill="#FAFAFA"/><text x="136" y="304" font-size="17" fill="#27272A" text-anchor="middle">런타임 상태 보고</text><rect x="305.0" y="284" width="190" height="28" fill="#FAFAFA"/><text x="400" y="304" font-size="17" fill="#27272A" text-anchor="middle">Pod 상태 반영</text><rect x="560.0" y="284" width="208" height="28" fill="#FAFAFA"/><text x="664" y="304" font-size="17" fill="#27272A" text-anchor="middle">유예·finalizer 해소</text><rect x="32" y="360" width="208" height="140" rx="12" fill="#F8FAFC" stroke="#475569" stroke-width="1.5"/><text x="136.0" y="394" font-size="21" fill="#334155" text-anchor="middle">Pod 직접 삭제 없음<tspan x="136.0" y="424" font-size="17">OOMKilled 보고</tspan><tspan x="136.0" y="452" font-size="17">재시작 정책에 따라</tspan><tspan x="136.0" y="480" font-size="17">컨테이너 재시작 가능</tspan></text><rect x="296" y="360" width="208" height="140" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/><text x="400.0" y="394" font-size="21" fill="#B45309" text-anchor="middle">Failed / Evicted<tspan x="400.0" y="424" font-size="17">종료한 Pod 오브젝트</tspan><tspan x="400.0" y="452" font-size="17">남을 수 있음</tspan><tspan x="400.0" y="480" font-size="17">이후 별도 삭제 가능</tspan></text><rect x="560" y="360" width="208" height="140" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/><text x="664.0" y="394" font-size="21" fill="#047857" text-anchor="middle">Pod 오브젝트 삭제<tspan x="664.0" y="424" font-size="17">삭제 조건이 끝나면</tspan><tspan x="664.0" y="452" font-size="17">기존 UID의 오브젝트</tspan><tspan x="664.0" y="480" font-size="17">사라짐</tspan></text><text x="400" y="552" font-size="17" fill="#27272A" text-anchor="middle">색과 열은 처리 경로를 구분합니다: 커널 · kubelet · API 서버</text><text x="400" y="608" font-size="19" fill="#0A0A0A" text-anchor="middle">대체 Pod 생성은 컨트롤러의 별도 동작입니다</text></g></svg>