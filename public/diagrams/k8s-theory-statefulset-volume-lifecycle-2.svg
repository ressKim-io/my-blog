<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 980" role="img" aria-labelledby="title desc">
  <title id="title">두 보존 정책이 Delete일 때 스케일다운의 소유 참조 변경과 삭제 주체</title>
  <desc id="desc">기본 시작 서수 0에서 복제본을 3에서 2로 줄이면 web-2는 범위를 벗어납니다. StatefulSet 컨트롤러는 PVC 소유 참조를 StatefulSet에서 해당 Pod UID로 바꾼 뒤 Pod 삭제를 요청합니다. GC가 소유 관계에 따라 PVC 삭제를 요청하고 PVC 보호 컨트롤러가 사용 여부를 확인합니다. PV 회수는 별도 정책입니다</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748B"/></marker></defs>
  <rect width="800" height="980" rx="20" fill="#FAFAFA"/>
  <g font-family="Pretendard, Noto Sans KR, Apple SD Gothic Neo, sans-serif" text-anchor="middle" fill="#0F172A">
    <text x="400" y="47" font-size="29" font-weight="700">두 정책이 Delete인 스케일다운</text>
    <text x="400" y="88" font-size="24" fill="#475569">시작 서수 0 · replicas 3 → 2 · web-2가 범위 밖</text>
    <rect x="90" y="116" width="620" height="100" rx="15" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="2"/>
    <text x="400" y="156" font-size="27" font-weight="700">StatefulSet 컨트롤러</text>
    <text x="400" y="192" font-size="24">PVC 소유자: StatefulSet → Pod web-2 UID</text>
    <path d="M400 216V276" stroke="#64748B" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
    <rect x="260" y="230" width="280" height="31" rx="6" fill="#FAFAFA"/>
    <text x="400" y="253" font-size="23" fill="#475569">소유 참조를 먼저 기록</text>
    <rect x="90" y="278" width="620" height="100" rx="15" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/>
    <text x="400" y="318" font-size="27" font-weight="700">StatefulSet 컨트롤러</text>
    <text x="400" y="354" font-size="24">web-2 Pod 삭제 요청 · 정상 종료 진행</text>
    <path d="M400 378V438" stroke="#64748B" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
    <rect x="226" y="392" width="348" height="31" rx="6" fill="#FAFAFA"/>
    <text x="400" y="415" font-size="23" fill="#475569">소유 Pod의 삭제 관계를 확인</text>
    <rect x="90" y="440" width="620" height="100" rx="15" fill="#ECFEFF" stroke="#67E8F9" stroke-width="2"/>
    <text x="400" y="480" font-size="27" font-weight="700">가비지 컬렉터</text>
    <text x="400" y="516" font-size="24">소유 관계에 따른 PVC 삭제 요청</text>
    <path d="M400 540V600" stroke="#64748B" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
    <rect x="245" y="554" width="310" height="31" rx="6" fill="#FAFAFA"/>
    <text x="400" y="577" font-size="23" fill="#475569">사용 중 삭제 보호를 적용</text>
    <rect x="90" y="602" width="620" height="100" rx="15" fill="#FFFBEB" stroke="#FCD34D" stroke-width="2"/>
    <text x="400" y="642" font-size="27" font-weight="700">PVC 보호 컨트롤러</text>
    <text x="400" y="678" font-size="24">Pod 참조로 사용 여부 확인 · finalizer 처리</text>
    <path d="M400 702V756" stroke="#64748B" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
    <rect x="90" y="758" width="620" height="90" rx="15" fill="#ECFEFF" stroke="#67E8F9" stroke-width="2"/>
    <text x="400" y="813" font-size="27" font-weight="700">PVC 삭제 후 PV 회수 정책으로 연결</text>
    <rect x="90" y="882" width="620" height="58" rx="12" fill="#F1F5F9"/>
    <text x="400" y="919" font-size="24" fill="#475569">정책 반영·정상 종료 전제 · 강제 삭제는 별도</text>
  </g>
</svg>
