<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 864" role="img" aria-labelledby="title desc"><title id="title">DRA는 장치 선택을 API에 기록하고 노드에서 준비합니다</title><desc id="desc">드라이버는 ResourceSlice에 장치 목록을 광고하고 Pod는 DeviceClass를 선택하는 ResourceClaim을 참조한다. 스케줄러는 Filter에서 할당을 계산하고 Reserve에서 내부 예약한 뒤 PreBind에서 claim의 allocation과 reservedFor를 기록한다. kubelet은 기본 경로에서 NodePrepareResources를 호출하고 CDI 이름을 CRI로 전달한다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#334155"/></marker></defs><rect width="800" height="864" rx="16" fill="#FAFAFA"/><g font-family="Pretendard, Apple SD Gothic Neo, system-ui, sans-serif"><text x="400" y="40" text-anchor="middle" font-size="23" fill="#0A0A0A">DRA는 장치 선택을 API에 기록하고 노드에서 준비합니다</text><path d="M400 176 V232" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M400 320 V376" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M400 464 V520" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M400 608 V664" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="112" y="88" width="576" height="88" rx="12" stroke="#059669" fill="#ECFDF5" stroke-width="1.5"/><text x="400.0" y="123" text-anchor="middle" font-size="21" fill="#047857">ResourceSlice · DeviceClass · ResourceClaim</text><text x="400.0" y="152" text-anchor="middle" font-size="17" fill="#047857">장치 목록 · 선택 조건 · 요구를 API로 표현</text><rect x="112" y="232" width="576" height="88" rx="12" stroke="#059669" fill="#ECFDF5" stroke-width="1.5"/><text x="400.0" y="267" text-anchor="middle" font-size="21" fill="#047857">스케줄러 Filter → Reserve</text><text x="400.0" y="296" text-anchor="middle" font-size="17" fill="#047857">노드별 할당 계산 · 내부 상태에 예약</text><rect x="112" y="376" width="576" height="88" rx="12" stroke="#059669" fill="#ECFDF5" stroke-width="1.5"/><text x="400.0" y="411" text-anchor="middle" font-size="21" fill="#047857">스케줄러 PreBind → claim status</text><text x="400.0" y="440" text-anchor="middle" font-size="17" fill="#047857">allocation과 reservedFor를 API에 기록</text><rect x="112" y="520" width="576" height="88" rx="12" stroke="#D97706" fill="#FFFBEB" stroke-width="1.5"/><text x="400.0" y="555" text-anchor="middle" font-size="21" fill="#B45309">kubelet → DRA 드라이버 노드 준비</text><text x="400.0" y="584" text-anchor="middle" font-size="17" fill="#B45309">기본 경로의 NodePrepareResources 호출</text><rect x="112" y="664" width="576" height="88" rx="12" stroke="#7C3AED" fill="#F5F3FF" stroke-width="1.5"/><text x="400.0" y="699" text-anchor="middle" font-size="21" fill="#6D28D9">CDI 이름 → CRI → 런타임 설정</text><text x="400.0" y="728" text-anchor="middle" font-size="17" fill="#6D28D9">장치에 필요한 OCI 설정 적용</text><text x="400" y="816" text-anchor="middle" font-size="18" fill="#27272A">API 할당이 끝난 것과 노드 준비·컨테이너 시작 성공은 다릅니다</text></g></svg>