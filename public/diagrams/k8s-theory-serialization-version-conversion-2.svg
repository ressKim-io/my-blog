<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="title desc"><title id="title">외부 버전 네 개를 공통 타입 하나와 연결합니다</title><desc id="desc">네 개의 외부 버전 각각이 내부 hub 타입과 양방향으로 변환된다. 버전끼리 직접 연결하면 열두 방향, hub와 연결하면 여덟 방향이다. 코드에 남은 버전 패키지가 모두 현재 서빙 버전이라는 뜻은 아니다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/></marker></defs><rect width="800" height="480" rx="16" fill="#FAFAFA"/><g font-family="Pretendard, Apple SD Gothic Neo, system-ui, sans-serif"><text x="400" y="40" font-size="23" fill="#0A0A0A" text-anchor="middle">외부 버전 네 개를 공통 타입 하나와 연결합니다</text><path d="M 240 128 L 320 200" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/><path d="M 560 128 L 480 200" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/><path d="M 240 336 L 320 280" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/><path d="M 560 336 L 480 280" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/><rect x="40" y="88" width="200" height="80" rx="12" stroke="#0891B2" fill="#ECFEFF" stroke-width="1.5"/><text x="140.0" y="122" font-size="21" fill="#0E7490" text-anchor="middle">v1</text><text x="140.0" y="150" font-size="17" fill="#0E7490" text-anchor="middle">외부 버전</text><rect x="560" y="88" width="200" height="80" rx="12" stroke="#0891B2" fill="#ECFEFF" stroke-width="1.5"/><text x="660.0" y="122" font-size="21" fill="#0E7490" text-anchor="middle">v1beta1</text><text x="660.0" y="150" font-size="17" fill="#0E7490" text-anchor="middle">외부 버전</text><rect x="40" y="296" width="200" height="80" rx="12" stroke="#0891B2" fill="#ECFEFF" stroke-width="1.5"/><text x="140.0" y="330" font-size="21" fill="#0E7490" text-anchor="middle">v1beta2</text><text x="140.0" y="358" font-size="17" fill="#0E7490" text-anchor="middle">외부 버전</text><rect x="560" y="296" width="200" height="80" rx="12" stroke="#0891B2" fill="#ECFEFF" stroke-width="1.5"/><text x="660.0" y="330" font-size="21" fill="#0E7490" text-anchor="middle">v1beta3</text><text x="660.0" y="358" font-size="17" fill="#0E7490" text-anchor="middle">외부 버전</text><rect x="280" y="200" width="240" height="80" rx="12" stroke="#059669" fill="#ECFDF5" stroke-width="1.5"/><text x="400.0" y="234" font-size="21" fill="#047857" text-anchor="middle">공통 타입 (hub)</text><text x="400.0" y="262" font-size="17" fill="#047857" text-anchor="middle">flowcontrol 내부 타입</text><text x="400" y="440" font-size="20" fill="#27272A" text-anchor="middle">4 × 3 = 12방향 대신 2 × 4 = 8방향</text></g></svg>