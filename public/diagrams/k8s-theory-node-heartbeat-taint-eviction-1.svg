<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 864" role="img" aria-labelledby="title desc"><title id="title">하트비트 부재와 Pod 삭제는 여러 판단을 거칩니다</title><desc id="desc">node lifecycle controller가 Lease와 Node status의 변화를 관찰한다. 유예와 실제 Lease 재확인을 거쳐 Node 조건을 Unknown으로 기록하고 속도 제한을 적용해 NoExecute taint를 추가한다. taint eviction controller는 Pod의 toleration에 따라 일반 DELETE를 요청한다. 실제 종료와 오브젝트 정리는 별도다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#334155"/></marker></defs><rect width="800" height="864" rx="16" fill="#FAFAFA"/><g font-family="Pretendard, Apple SD Gothic Neo, system-ui, sans-serif"><text x="400" y="40" text-anchor="middle" font-size="23" fill="#0A0A0A">하트비트 부재와 Pod 삭제는 여러 판단을 거칩니다</text><path d="M400 176 V232" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M400 320 V376" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M400 464 V520" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M400 608 V664" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="120" y="88" width="560" height="88" rx="12" stroke="#059669" fill="#ECFDF5" stroke-width="1.5"/><text x="400.0" y="122" text-anchor="middle" font-size="21" fill="#047857">node lifecycle controller의 관찰</text><text x="400.0" y="151" text-anchor="middle" font-size="17" fill="#047857">Lease · Node status 변화 시각을 로컬에 기록</text><rect x="120" y="232" width="560" height="88" rx="12" stroke="#059669" fill="#ECFDF5" stroke-width="1.5"/><text x="400.0" y="266" text-anchor="middle" font-size="21" fill="#047857">유예 초과 → 실제 Lease 재확인</text><text x="400.0" y="295" text-anchor="middle" font-size="17" fill="#047857">기존 Node의 기본 판정 유예 50초</text><rect x="120" y="376" width="560" height="88" rx="12" stroke="#059669" fill="#ECFDF5" stroke-width="1.5"/><text x="400.0" y="410" text-anchor="middle" font-size="21" fill="#047857">Node Ready=Unknown · NoExecute 추가</text><text x="400.0" y="439" text-anchor="middle" font-size="17" fill="#047857">캐시 확인 · zone별 속도 제한 적용</text><rect x="120" y="520" width="560" height="88" rx="12" stroke="#059669" fill="#ECFDF5" stroke-width="1.5"/><text x="400.0" y="554" text-anchor="middle" font-size="21" fill="#047857">taint eviction controller → 일반 DELETE</text><text x="400.0" y="583" text-anchor="middle" font-size="17" fill="#047857">각 Pod의 toleration 기준 · 기본 항목은 300초</text><rect x="120" y="664" width="560" height="88" rx="12" stroke="#475569" fill="#F8FAFC" stroke-width="1.5"/><text x="400.0" y="698" text-anchor="middle" font-size="21" fill="#334155">종료 확인과 오브젝트 정리는 별도</text><text x="400.0" y="727" text-anchor="middle" font-size="17" fill="#334155">kubelet 정리 또는 조건을 만족한 podGC 경로</text><text x="400" y="810" text-anchor="middle" font-size="18" fill="#27272A">50초 + 300초는 지연을 생략한 관계이며 삭제 완료 시각이 아닙니다</text></g></svg>