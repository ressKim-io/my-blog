<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 704" role="img" aria-labelledby="title desc"><title id="title">선언·실측·최근 표본의 관측 경로</title><desc id="desc">kube-state-metrics는 API 오브젝트를 읽어 선언과 보고 상태 지표를 만든다. kubelet은 cAdvisor와 CRI 통계 경로로 노드·컨테이너 자원을 노출한다. metrics-server는 기본 metrics/resource를 수집해 최근 표본을 메모리에 보관하고 Metrics API로 HPA, VPA, kubectl top에 제공한다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#334155"/></marker></defs><rect width="800" height="704" rx="16" fill="#FAFAFA"/><g font-family="Pretendard, Apple SD Gothic Neo, system-ui, sans-serif"><text x="400" y="40" text-anchor="middle" font-size="23" fill="#0A0A0A">선언·실측·최근 표본의 관측 경로</text><path d="M352 164 H448" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M352 372 H448" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M600 424 V536" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M448 588 H352" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="48" y="112" width="304" height="104" rx="12" stroke="#059669" fill="#ECFDF5" stroke-width="1.5"/><text x="200" y="153" text-anchor="middle" font-size="22" fill="#047857">API 오브젝트</text><text x="200" y="188" text-anchor="middle" font-size="17" fill="#047857">spec · status · metadata</text><rect x="448" y="112" width="304" height="104" rx="12" stroke="#059669" fill="#ECFDF5" stroke-width="1.5"/><text x="600" y="153" text-anchor="middle" font-size="22" fill="#047857">kube-state-metrics</text><text x="600" y="188" text-anchor="middle" font-size="17" fill="#047857">선언·보고 상태를 지표로 변환</text><rect x="48" y="320" width="304" height="104" rx="12" stroke="#D97706" fill="#FFFBEB" stroke-width="1.5"/><text x="200" y="361" text-anchor="middle" font-size="22" fill="#B45309">노드·cgroup의 통계</text><text x="200" y="396" text-anchor="middle" font-size="17" fill="#B45309">CPU 카운터 · 메모리 값</text><rect x="448" y="320" width="304" height="104" rx="12" stroke="#D97706" fill="#FFFBEB" stroke-width="1.5"/><text x="600" y="361" text-anchor="middle" font-size="22" fill="#B45309">kubelet 통계 엔드포인트</text><text x="600" y="396" text-anchor="middle" font-size="17" fill="#B45309">cAdvisor · CRI 경로</text><rect x="448" y="536" width="304" height="104" rx="12" stroke="#0891B2" fill="#ECFEFF" stroke-width="1.5"/><text x="600" y="577" text-anchor="middle" font-size="22" fill="#0E7490">metrics-server</text><text x="600" y="612" text-anchor="middle" font-size="17" fill="#0E7490">최근·이전 표본을 메모리에 보관</text><rect x="48" y="536" width="304" height="104" rx="12" stroke="#059669" fill="#ECFDF5" stroke-width="1.5"/><text x="200" y="577" text-anchor="middle" font-size="22" fill="#047857">Metrics API 이용</text><text x="200" y="612" text-anchor="middle" font-size="17" fill="#047857">HPA · VPA · kubectl top</text><text x="400" y="141" text-anchor="middle" font-size="17" fill="#27272A">watch</text><text x="400" y="349" text-anchor="middle" font-size="17" fill="#27272A">관찰</text><text x="484" y="487" text-anchor="middle" font-size="17" fill="#27272A">/metrics/resource 수집</text></g></svg>