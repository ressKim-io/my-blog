<svg xmlns="http://www.w3.org/2000/svg" width="560" height="1240" viewBox="0 0 560 1240" role="img" aria-labelledby="k8s-theory-volume-expansion-snapshots-ephemeral-3-title k8s-theory-volume-expansion-snapshots-ephemeral-3-desc">
  <title id="k8s-theory-volume-expansion-snapshots-ephemeral-3-title">스냅샷 API와 저장소 실물, 새 볼륨으로의 복원</title>
  <desc id="k8s-theory-volume-expansion-snapshots-ephemeral-3-desc">동적 스냅샷 생성 후 같은 네임스페이스에서 복원하는 예시입니다. 원본 PVC는 PV를 통해 원본 볼륨과 연결됩니다. namespaced VolumeSnapshot은 원본 PVC를 source로 참조하며 공통 snapshot-controller가 cluster 범위 VolumeSnapshotContent 생성과 바인딩을 조정합니다. csi-snapshotter가 드라이버에 CreateSnapshot을 요청하며 Content는 handle로 실제 스토리지 스냅샷과 대응합니다. 새 PVC는 dataSource로 source-snapshot을 참조합니다. external-provisioner가 드라이버에 스냅샷을 소스로 하는 CreateVolume을 요청하고 새 PVC와 PV가 새 볼륨에 연결됩니다. 원본을 되감거나 덮어쓰지 않으며 바인딩 참조, 드라이버 일치, readyToUse, handle을 확인해야 합니다. API 객체의 존재가 즉시 복원이나 애플리케이션 일관성을 보장하지 않습니다</desc>
