<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" role="img" aria-labelledby="title desc">
  <title id="title">Pod 교체 전후에도 보존된 PVC를 다시 참조하는 관계</title>
  <desc id="desc">교체 전과 교체 후의 Pod 이름은 web-2로 같지만 UID는 다릅니다. 두 시점의 Pod는 같은 이름의 보존된 PVC data-web-2에 대응합니다. 동시 접근을 뜻하지 않습니다</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748B"/></marker></defs>
  <rect width="800" height="470" rx="20" fill="#FAFAFA"/>
  <g font-family="Pretendard, Noto Sans KR, Apple SD Gothic Neo, sans-serif" text-anchor="middle" fill="#0F172A">
    <text x="400" y="48" font-size="29" font-weight="700">Pod가 바뀌어도 PVC의 대응은 유지</text>
    <rect x="40" y="82" width="320" height="154" rx="16" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/>
    <text x="200" y="117" font-size="24" fill="#475569">교체 전</text>
    <text x="200" y="163" font-size="29" font-weight="700">Pod web-2</text>
    <text x="200" y="205" font-size="25">이전 Pod UID</text>
    <rect x="440" y="82" width="320" height="154" rx="16" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="2"/>
    <text x="600" y="117" font-size="24" fill="#047857">교체 후</text>
    <text x="600" y="163" font-size="29" font-weight="700">Pod web-2</text>
    <text x="600" y="205" font-size="25">새 Pod UID</text>
    <path d="M200 236V272H300V326" stroke="#64748B" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
    <path d="M600 236V272H500V326" stroke="#64748B" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
    <rect x="332" y="257" width="136" height="34" rx="8" fill="#FAFAFA"/>
    <text x="400" y="282" font-size="23" fill="#475569">각 시점의 참조</text>
    <rect x="150" y="328" width="500" height="100" rx="16" fill="#ECFEFF" stroke="#67E8F9" stroke-width="2"/>
    <text x="400" y="367" font-size="28" font-weight="700">PVC data-web-2</text>
    <text x="400" y="404" font-size="24" fill="#0E7490">기존 PVC가 보존된 경우</text>
  </g>
</svg>
