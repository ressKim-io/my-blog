<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1152" role="img" aria-labelledby="title desc"><title id="title">불완전한 discovery와 Namespace 완료 보류</title><desc id="desc">확장 API의 장애는 전체 자원 목록의 조회 실패로 이어질 수 있다. Namespace 삭제 컨트롤러는 discovery 오류를 기록하고 알아낸 자원을 삭제한다. 다만 목록에 Pod가 있으면 Pod를 먼저 삭제하고 남아 있으면 다른 종류의 삭제를 미룬다. 삭제 과정의 오류도 모아 반환하고 오류가 남으면 자신의 Namespace finalizer를 해제하는 완료 처리에 도달하지 않는다. Terminating의 모든 원인이 이 경로인 것은 아니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#334155"/></marker></defs><rect width="600" height="1152" rx="16" fill="#FAFAFA"/><g font-family="Pretendard, Apple SD Gothic Neo, system-ui, sans-serif"><text x="300" y="44" font-size="24" fill="#0A0A0A" text-anchor="middle">일부 삭제와 삭제 완료는 다릅니다</text><rect x="40" y="100" width="520" height="132" rx="12" fill="#FFF1F2" stroke="#E11D48" stroke-width="1.5"/><text x="300.0" y="134" font-size="21" fill="#BE123C" text-anchor="middle">확장 API에 접근할 수 없음</text><text x="300.0" y="164" font-size="21" fill="#27272A" text-anchor="middle">등록은 남아 있어도 자원 조회 실패</text><text x="300.0" y="192" font-size="21" fill="#27272A" text-anchor="middle">Discovery가 부분 결과와 오류를 전달</text><path d="M300 232 V368" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><rect x="50.0" y="272" width="500" height="28" fill="#FAFAFA"/><text x="300" y="292" font-size="21" fill="#27272A" text-anchor="middle">Namespace의 자원 종류를 조회</text><rect x="50.0" y="308" width="500" height="28" fill="#FAFAFA"/><text x="300" y="328" font-size="21" fill="#27272A" text-anchor="middle">전체 목록을 확인하지 못함</text><rect x="40" y="368" width="520" height="132" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/><text x="300.0" y="402" font-size="21" fill="#B45309" text-anchor="middle">삭제 컨트롤러 · 오류를 기록</text><text x="300.0" y="432" font-size="21" fill="#27272A" text-anchor="middle">알아낸 자원을 가능한 범위에서 삭제</text><text x="300.0" y="460" font-size="21" fill="#27272A" text-anchor="middle">목록에 Pod가 있으면 먼저 삭제</text><path d="M300 500 V636" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><rect x="50.0" y="540" width="500" height="28" fill="#FAFAFA"/><text x="300" y="560" font-size="21" fill="#27272A" text-anchor="middle">Pod가 남으면 다른 종류는 대기</text><rect x="50.0" y="576" width="500" height="28" fill="#FAFAFA"/><text x="300" y="596" font-size="21" fill="#27272A" text-anchor="middle">진행 중 생긴 오류도 모아 반환</text><rect x="40" y="636" width="520" height="132" rx="12" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/><text x="300.0" y="670" font-size="21" fill="#6D28D9" text-anchor="middle">삭제 호출자 · 오류를 확인</text><text x="300.0" y="700" font-size="21" fill="#27272A" text-anchor="middle">오류가 남으면 finalize로 진행하지 않음</text><text x="300.0" y="728" font-size="21" fill="#27272A" text-anchor="middle">부분 삭제가 완료 선언은 아님</text><path d="M300 768 V904" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><rect x="50.0" y="808" width="500" height="28" fill="#FAFAFA"/><text x="300" y="828" font-size="21" fill="#27272A" text-anchor="middle">목록 조회 실패와 잔존 자원을 구분</text><rect x="50.0" y="844" width="500" height="28" fill="#FAFAFA"/><text x="300" y="864" font-size="21" fill="#27272A" text-anchor="middle">Namespace condition을 함께 확인</text><rect x="40" y="904" width="520" height="132" rx="12" fill="#F8FAFC" stroke="#475569" stroke-width="1.5"/><text x="300.0" y="938" font-size="21" fill="#334155" text-anchor="middle">Namespace 완료 처리 보류</text><text x="300.0" y="968" font-size="21" fill="#27272A" text-anchor="middle">확장 API 장애는 가능한 원인 중 하나</text><text x="300.0" y="996" font-size="21" fill="#27272A" text-anchor="middle">내용 잔존·finalizer 문제도 구분</text><text x="300" y="1108" font-size="21" fill="#27272A" text-anchor="middle">정리하지 못한 타입이 없는지 확인해야 합니다</text></g></svg>