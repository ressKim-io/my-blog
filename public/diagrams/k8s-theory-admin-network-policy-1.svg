<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1184" role="img" aria-labelledby="title desc"><title id="title">관리자 정책의 방향별 평가 흐름</title><desc id="desc">ingress 또는 egress 한 방향의 정책 모델이다. Admin tier의 Accept와 Deny는 최종 판정이다. Pass 또는 일치 규칙 없음이면 NetworkPolicy로 간다. 해당 방향을 격리한 NetworkPolicy가 있으면 허용 합집합으로 최종 판정하며, 없을 때만 Baseline으로 간다. Baseline의 Accept와 Deny도 최종 판정이며 Pass 또는 일치 규칙 없음이면 정책의 기본 허용이다. 다른 방향과 다른 보안 경로의 판정은 별도다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#334155"/></marker></defs><rect width="600" height="1184" rx="16" fill="#FAFAFA"/><g font-family="Pretendard, Apple SD Gothic Neo, system-ui, sans-serif"><text x="300" y="40" font-size="24" fill="#0A0A0A" text-anchor="middle">한 방향에서 최종 판정이 나올 때까지</text><text x="300" y="88" font-size="21" fill="#27272A" text-anchor="middle">ClusterNetworkPolicy v1alpha2 모델</text><path d="M368 200 H408" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><path d="M204 264 V416" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><path d="M368 480 H408" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><path d="M204 544 V696" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><path d="M368 760 H408" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><path d="M204 824 V976" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="136" width="328" height="128" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/><text x="204.0" y="170" font-size="21" fill="#B45309" text-anchor="middle">Admin tier<tspan x="204.0" y="200" font-size="21">priority · 목록 순서로</tspan><tspan x="204.0" y="228" font-size="21">규칙 평가</tspan></text><rect x="408" y="136" width="152" height="128" rx="12" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/><text x="484.0" y="170" font-size="21" fill="#6D28D9" text-anchor="middle">최종 판정<tspan x="484.0" y="200" font-size="21">Accept</tspan><tspan x="484.0" y="228" font-size="21">Deny</tspan></text><rect x="80.0" y="324" width="360" height="28" fill="#FAFAFA"/><text x="260" y="344" font-size="21" fill="#27272A" text-anchor="middle">Pass / 일치 규칙 없음</text><rect x="40" y="416" width="328" height="128" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/><text x="204.0" y="450" font-size="21" fill="#047857" text-anchor="middle">NetworkPolicy<tspan x="204.0" y="480" font-size="21">이 방향이 격리됐으면</tspan><tspan x="204.0" y="508" font-size="21">허용 합집합으로 판정</tspan></text><rect x="408" y="416" width="152" height="128" rx="12" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/><text x="484.0" y="450" font-size="21" fill="#6D28D9" text-anchor="middle">최종 판정<tspan x="484.0" y="480" font-size="21">허용 또는</tspan><tspan x="484.0" y="508" font-size="21">거부</tspan></text><rect x="70.0" y="604" width="460" height="28" fill="#FAFAFA"/><text x="300" y="624" font-size="21" fill="#27272A" text-anchor="middle">해당 방향을 격리한 정책 없음</text><rect x="40" y="696" width="328" height="128" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/><text x="204.0" y="730" font-size="21" fill="#B45309" text-anchor="middle">Baseline tier<tspan x="204.0" y="760" font-size="21">priority · 목록 순서로</tspan><tspan x="204.0" y="788" font-size="21">규칙 평가</tspan></text><rect x="408" y="696" width="152" height="128" rx="12" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/><text x="484.0" y="730" font-size="21" fill="#6D28D9" text-anchor="middle">최종 판정<tspan x="484.0" y="760" font-size="21">Accept</tspan><tspan x="484.0" y="788" font-size="21">Deny</tspan></text><rect x="80.0" y="884" width="360" height="28" fill="#FAFAFA"/><text x="260" y="904" font-size="21" fill="#27272A" text-anchor="middle">Pass / 일치 규칙 없음</text><rect x="40" y="976" width="520" height="104" rx="12" fill="#F8FAFC" stroke="#475569" stroke-width="1.5"/><text x="300.0" y="1010" font-size="21" fill="#334155" text-anchor="middle">정책 모델의 기본 허용<tspan x="300.0" y="1040" font-size="21">이 방향의 판정</tspan></text><text x="300" y="1136" font-size="21" fill="#27272A" text-anchor="middle">다른 방향과 다른 보안 경로는 별도 평가합니다</text></g></svg>