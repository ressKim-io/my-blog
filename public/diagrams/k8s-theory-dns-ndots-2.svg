<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 840" role="img" aria-labelledby="title desc"><title id="title">NodeLocal DNSCache가 바꾸는 로컬 DNS 경로</title><desc id="desc">UDP DNS Service 전달을 비교한 개념도다. 일반 경로에서 Pod 질의는 Service의 DNAT과 conntrack을 거쳐 CoreDNS에 도달한다. NodeLocal 경로에서는 Pod가 로컬 캐시에 질의하고 그 로컬 구간의 DNAT과 conntrack을 우회하도록 구성한다. 캐시에 없으면 상위 DNS로 조회하며 TCP를 사용할 수 있다. 상위 구간 전체의 NAT과 conntrack이 제거되는 것은 아니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#334155"/></marker></defs><rect width="600" height="840" rx="16" fill="#FAFAFA"/><g font-family="Pretendard, Apple SD Gothic Neo, system-ui, sans-serif"><text x="300" y="42" font-size="24" fill="#0A0A0A" text-anchor="middle">로컬 캐시가 바꾸는 DNS 전달 경로</text><text x="160" y="96" font-size="21" fill="#27272A" text-anchor="middle">일반 Service 경로</text><text x="440" y="96" font-size="21" fill="#27272A" text-anchor="middle">NodeLocal 경로</text><path d="M160 244 V352" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><path d="M160 488 V636" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><path d="M440 244 V352" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><path d="M440 488 V636" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="140" width="240" height="104" rx="12" fill="#F8FAFC" stroke="#475569" stroke-width="1.5"/><text x="160.0" y="174" font-size="21" fill="#334155" text-anchor="middle">Pod resolver<tspan x="160.0" y="204" font-size="21">UDP 질의 예시</tspan></text><rect x="320" y="140" width="240" height="104" rx="12" fill="#F8FAFC" stroke="#475569" stroke-width="1.5"/><text x="440.0" y="174" font-size="21" fill="#334155" text-anchor="middle">Pod resolver<tspan x="440.0" y="204" font-size="21">UDP 질의 예시</tspan></text><rect x="40" y="352" width="240" height="136" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/><text x="160.0" y="386" font-size="21" fill="#B45309" text-anchor="middle">DNS Service<tspan x="160.0" y="416" font-size="21">DNAT · conntrack</tspan><tspan x="160.0" y="444" font-size="21">경로를 거침</tspan></text><rect x="320" y="352" width="240" height="136" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/><text x="440.0" y="386" font-size="21" fill="#047857" text-anchor="middle">NodeLocal 캐시<tspan x="440.0" y="416" font-size="21">로컬 구간의</tspan><tspan x="440.0" y="444" font-size="21">DNAT·conntrack 우회</tspan></text><rect x="50.0" y="544" width="220" height="28" fill="#FAFAFA"/><text x="160" y="564" font-size="21" fill="#27272A" text-anchor="middle">Service 전달</text><rect x="330.0" y="528" width="220" height="28" fill="#FAFAFA"/><text x="440" y="548" font-size="21" fill="#27272A" text-anchor="middle">캐시 미적중 시</text><rect x="315.0" y="560" width="250" height="28" fill="#FAFAFA"/><text x="440" y="580" font-size="21" fill="#27272A" text-anchor="middle">상위 조회 · TCP 가능</text><rect x="40" y="636" width="240" height="104" rx="12" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/><text x="160.0" y="670" font-size="21" fill="#6D28D9" text-anchor="middle">CoreDNS<tspan x="160.0" y="700" font-size="21">DNS 응답</tspan></text><rect x="320" y="636" width="240" height="104" rx="12" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/><text x="440.0" y="670" font-size="21" fill="#6D28D9" text-anchor="middle">상위 DNS<tspan x="440.0" y="700" font-size="21">CoreDNS 등</tspan></text><text x="300" y="796" font-size="21" fill="#27272A" text-anchor="middle">상위 구간의 추적·전달 경로는 별도입니다</text></g></svg>