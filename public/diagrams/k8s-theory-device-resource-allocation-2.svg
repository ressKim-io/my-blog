<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 672" role="img" aria-labelledby="title desc"><title id="title">Topology Manager는 NUMA 힌트를 결합합니다</title><desc id="desc">device manager, CPU manager, memory manager가 NUMA 힌트를 제공한다. Topology Manager는 container 또는 pod scope로 힌트를 병합해 선택한 정책의 admission 결과를 낸다. 각 매니저의 전용 자원 할당 조건은 서로 다르다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#334155"/></marker></defs><rect width="800" height="672" rx="16" fill="#FAFAFA"/><g font-family="Pretendard, Apple SD Gothic Neo, system-ui, sans-serif"><text x="400" y="40" text-anchor="middle" font-size="23" fill="#0A0A0A">Topology Manager는 NUMA 힌트를 결합합니다</text><path d="M152 208 V256 H400 V304" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M400 208 V304" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M648 208 V256 H400" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M400 392 V488" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="48" y="120" width="208" height="88" rx="12" stroke="#D97706" fill="#FFFBEB" stroke-width="1.5"/><text x="152.0" y="155" text-anchor="middle" font-size="21" fill="#B45309">device manager</text><text x="152.0" y="184" text-anchor="middle" font-size="17" fill="#B45309">장치의 NUMA 위치</text><rect x="296" y="120" width="208" height="88" rx="12" stroke="#D97706" fill="#FFFBEB" stroke-width="1.5"/><text x="400.0" y="155" text-anchor="middle" font-size="21" fill="#B45309">CPU manager</text><text x="400.0" y="184" text-anchor="middle" font-size="17" fill="#B45309">CPU 배치 힌트</text><rect x="544" y="120" width="208" height="88" rx="12" stroke="#D97706" fill="#FFFBEB" stroke-width="1.5"/><text x="648.0" y="155" text-anchor="middle" font-size="21" fill="#B45309">memory manager</text><text x="648.0" y="184" text-anchor="middle" font-size="17" fill="#B45309">메모리 배치 힌트</text><rect x="152" y="304" width="496" height="88" rx="12" stroke="#D97706" fill="#FFFBEB" stroke-width="1.5"/><text x="400.0" y="339" text-anchor="middle" font-size="21" fill="#B45309">Topology Manager → 힌트 병합</text><text x="400.0" y="368" text-anchor="middle" font-size="17" fill="#B45309">container 또는 pod scope로 정책 적용</text><rect x="152" y="488" width="496" height="88" rx="12" stroke="#D97706" fill="#FFFBEB" stroke-width="1.5"/><text x="400.0" y="523" text-anchor="middle" font-size="21" fill="#B45309">정책에 따른 admission</text><text x="400.0" y="552" text-anchor="middle" font-size="17" fill="#B45309">none · best-effort · restricted · single-numa-node</text><text x="400" y="632" text-anchor="middle" font-size="18" fill="#27272A">NUMA node는 한 Kubernetes Node 안의 하드웨어 위치 단위입니다</text></g></svg>