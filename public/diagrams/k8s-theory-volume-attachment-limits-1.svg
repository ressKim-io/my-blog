<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1072" role="img" aria-labelledby="title desc"><title id="title">노드와 드라이버별 볼륨 상한의 전달</title><desc id="desc">CSI 드라이버가 NodeGetInfo로 선언한 상한을 kubelet이 CSINode의 해당 드라이버 항목에 적는다. scheduler의 NodeVolumeLimits는 노드와 드라이버별로 기존 볼륨 키와 새 요구를 계산해 숫자 상한과 비교한다. 초과하면 이 노드를 제외하고 통과해도 다른 스케줄링 조건과 실제 attach 성공은 별도다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#334155"/></marker></defs><rect width="600" height="1072" rx="16" fill="#FAFAFA"/><g font-family="Pretendard, Apple SD Gothic Neo, system-ui, sans-serif"><text x="300" y="40" font-size="24" fill="#0A0A0A" text-anchor="middle">노드와 드라이버별 상한을 전달합니다</text><text x="300" y="88" font-size="21" fill="#27272A" text-anchor="middle">노드별 CSI 드라이버의 선언값</text><path d="M300 232 V352" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><path d="M300 480 V600" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><path d="M300 744 V824 H160 V880" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><path d="M300 824 H440 V880" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="128" width="520" height="104" rx="12" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/><text x="300.0" y="162" font-size="21" fill="#6D28D9" text-anchor="middle">CSI 드라이버 · NodeGetInfo</text><text x="300.0" y="192" font-size="21" fill="#27272A" text-anchor="middle">max_volumes_per_node 응답</text><rect x="120.0" y="268" width="360" height="28" fill="#FAFAFA"/><text x="300" y="288" font-size="21" fill="#27272A" text-anchor="middle">kubelet이 변환해 기록</text><rect x="40" y="352" width="520" height="128" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/><text x="300.0" y="386" font-size="21" fill="#047857" text-anchor="middle">CSINode · 드라이버 항목</text><text x="300.0" y="416" font-size="21" fill="#27272A" text-anchor="middle">spec.drivers[].allocatable.count</text><text x="300.0" y="444" font-size="21" fill="#27272A" text-anchor="middle">노드와 드라이버별 숫자 상한</text><rect x="80.0" y="524" width="440" height="28" fill="#FAFAFA"/><text x="300" y="544" font-size="21" fill="#27272A" text-anchor="middle">scheduler가 오브젝트에서 읽음</text><rect x="40" y="600" width="520" height="144" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/><text x="300.0" y="634" font-size="21" fill="#B45309" text-anchor="middle">NodeVolumeLimits · Filter</text><text x="300.0" y="664" font-size="21" fill="#27272A" text-anchor="middle">기존 볼륨 키와 새 요구를 계산</text><text x="300.0" y="692" font-size="21" fill="#27272A" text-anchor="middle">드라이버별 숫자 상한과 비교</text><rect x="60.0" y="764" width="480" height="28" fill="#FAFAFA"/><text x="300" y="784" font-size="21" fill="#27272A" text-anchor="middle">기존 수 + 새 수가 상한을 넘는가?</text><rect x="40" y="880" width="240" height="112" rx="12" fill="#FFF1F2" stroke="#E11D48" stroke-width="1.5"/><text x="160.0" y="914" font-size="21" fill="#BE123C" text-anchor="middle">상한 초과</text><text x="160.0" y="944" font-size="21" fill="#27272A" text-anchor="middle">이 노드 제외</text><rect x="320" y="880" width="240" height="112" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/><text x="440.0" y="914" font-size="21" fill="#047857" text-anchor="middle">이 검사 통과</text><text x="440.0" y="944" font-size="21" fill="#27272A" text-anchor="middle">다른 조건도 확인</text><text x="300" y="1040" font-size="21" fill="#27272A" text-anchor="middle">검사 통과는 attach 성공 보장이 아닙니다</text></g></svg>