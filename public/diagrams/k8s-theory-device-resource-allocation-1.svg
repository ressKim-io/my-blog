<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 704" role="img" aria-labelledby="title desc"><title id="title">개수의 노드 선택과 실제 장치 선택을 나눕니다</title><desc id="desc">기본 device plugin 경로에서 Pod는 확장 자원 이름과 개수를 요청한다. 스케줄러는 노드의 남은 개수를 검사한다. 노드가 정해진 뒤 kubelet device manager가 장치 ID를 고르고 플러그인의 Allocate를 호출해 받은 주입 설정을 CRI 컨테이너 설정에 전달한다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#334155"/></marker></defs><rect width="800" height="704" rx="16" fill="#FAFAFA"/><g font-family="Pretendard, Apple SD Gothic Neo, system-ui, sans-serif"><text x="400" y="40" text-anchor="middle" font-size="23" fill="#0A0A0A">개수의 노드 선택과 실제 장치 선택을 나눕니다</text><path d="M400 176 V232" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M400 320 V376" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M400 464 V520" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="128" y="88" width="544" height="88" rx="12" stroke="#059669" fill="#ECFDF5" stroke-width="1.5"/><text x="400.0" y="123" text-anchor="middle" font-size="21" fill="#047857">Pod → 확장 자원 이름과 개수</text><text x="400.0" y="152" text-anchor="middle" font-size="17" fill="#047857">requests = limits인 정수 요청</text><rect x="128" y="232" width="544" height="88" rx="12" stroke="#059669" fill="#ECFDF5" stroke-width="1.5"/><text x="400.0" y="267" text-anchor="middle" font-size="21" fill="#047857">스케줄러 → NodeResourcesFit</text><text x="400.0" y="296" text-anchor="middle" font-size="17" fill="#047857">노드의 allocatable - requested 비교</text><rect x="128" y="376" width="544" height="88" rx="12" stroke="#D97706" fill="#FFFBEB" stroke-width="1.5"/><text x="400.0" y="411" text-anchor="middle" font-size="21" fill="#B45309">kubelet → device manager</text><text x="400.0" y="440" text-anchor="middle" font-size="17" fill="#B45309">건강 상태·NUMA 힌트 등을 보고 장치 ID 선택</text><rect x="128" y="520" width="544" height="88" rx="12" stroke="#D97706" fill="#FFFBEB" stroke-width="1.5"/><text x="400.0" y="555" text-anchor="middle" font-size="21" fill="#B45309">device plugin Allocate → CRI 설정</text><text x="400.0" y="584" text-anchor="middle" font-size="17" fill="#B45309">환경 변수 · 마운트 · 장치 · 어노테이션 · CDI</text><text x="400" y="664" text-anchor="middle" font-size="18" fill="#27272A">스케줄링이 성공해도 노드의 할당·admission에서 실패할 수 있습니다</text></g></svg>