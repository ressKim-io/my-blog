<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1016" role="img" aria-labelledby="title desc"><title id="title">RuntimeClass overhead에서 스케줄러 점수까지</title><desc id="desc">관리자가 RuntimeClass에 overhead를 선언하면 API 서버 admission이 Pod에 복사한다. 스케줄러는 컨테이너와 init 및 Pod-level 조건을 반영하고 overhead를 더한 요청으로 Filter를 수행한다. 통과한 후보는 프로파일의 점수 전략과 여러 플러그인의 가중치로 평가한다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#334155"/></marker></defs><rect width="600" height="1016" rx="16" fill="#FAFAFA"/><g font-family="Pretendard, Apple SD Gothic Neo, system-ui, sans-serif"><text x="300" y="40" font-size="24" fill="#0A0A0A" text-anchor="middle">무엇을 세고 어떤 정책으로 고르는가</text><path d="M300 200 V272" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><path d="M300 376 V448" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><path d="M300 580 V652" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><path d="M300 756 V828" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="96" width="520" height="104" rx="12" fill="#F8FAFC" stroke="#475569" stroke-width="1.5"/><text x="300.0" y="130" font-size="21" fill="#334155" text-anchor="middle">RuntimeClass: 관리자 선언<tspan x="300.0" y="160" font-size="21">런타임별 overhead.podFixed</tspan></text><rect x="80.0" y="224" width="440" height="28" fill="#FAFAFA"/><text x="300" y="244" font-size="21" fill="#27272A" text-anchor="middle">Pod의 runtimeClassName으로 참조</text><rect x="40" y="272" width="520" height="104" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/><text x="300.0" y="306" font-size="21" fill="#047857" text-anchor="middle">API 서버: RuntimeClass admission<tspan x="300.0" y="336" font-size="21">Pod의 spec.overhead를 채우고 검증</tspan></text><rect x="100.0" y="400" width="400" height="28" fill="#FAFAFA"/><text x="300" y="420" font-size="21" fill="#27272A" text-anchor="middle">저장된 Pod의 선언과 overhead</text><rect x="40" y="448" width="520" height="132" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/><text x="300.0" y="482" font-size="21" fill="#B45309" text-anchor="middle">스케줄러: Pod 요청 계산<tspan x="300.0" y="512" font-size="21">init · sidecar · Pod-level 조건 적용</tspan><tspan x="300.0" y="540" font-size="21">선택한 요청에 overhead 추가</tspan></text><rect x="150.0" y="604" width="300" height="28" fill="#FAFAFA"/><text x="300" y="624" font-size="21" fill="#27272A" text-anchor="middle">배치에 필요한 요청</text><rect x="40" y="652" width="520" height="104" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/><text x="300.0" y="686" font-size="21" fill="#B45309" text-anchor="middle">Filter: 수용 가능한 노드 확인<tspan x="300.0" y="716" font-size="21">노드 allocatable · 기존 요청과 비교</tspan></text><rect x="170.0" y="780" width="260" height="28" fill="#FAFAFA"/><text x="300" y="800" font-size="21" fill="#27272A" text-anchor="middle">통과한 후보 노드</text><rect x="40" y="828" width="520" height="132" rx="12" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/><text x="300.0" y="862" font-size="21" fill="#6D28D9" text-anchor="middle">Score: 프로파일의 정책 적용<tspan x="300.0" y="892" font-size="21">자원 전략과 플러그인 가중치 적용</tspan><tspan x="300.0" y="920" font-size="21">다른 점수와 합산해 후보 평가</tspan></text><text x="300" y="996" font-size="21" fill="#27272A" text-anchor="middle">실제 자원 사용량을 읽는 계산은 아닙니다</text></g></svg>