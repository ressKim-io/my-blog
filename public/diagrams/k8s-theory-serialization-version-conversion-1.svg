<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 624" role="img" aria-labelledby="title desc"><title id="title">쓰는 요청에서 버전과 바이트 형식이 바뀌는 지점</title><desc id="desc">내부 타입을 사용하는 내장 API의 쓰기 경로. 외부 요청을 디코딩하고 기본값을 적용한 뒤 메모리 버전으로 변환하며, 저장할 때 저장 버전으로 바꾸어 인코딩한다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/></marker></defs><rect width="800" height="624" rx="16" fill="#FAFAFA"/><g font-family="Pretendard, Apple SD Gothic Neo, system-ui, sans-serif"><text x="400" y="40" font-size="23" fill="#0A0A0A" text-anchor="middle">쓰는 요청에서 버전과 바이트 형식이 바뀌는 지점</text><path d="M 400 160 V 272" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><path d="M 400 352 V 464" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><rect x="176" y="80" width="448" height="80" rx="12" stroke="#0891B2" fill="#ECFEFF" stroke-width="1.5"/><text x="400.0" y="114" font-size="21" fill="#0E7490" text-anchor="middle">요청 버전 + 요청 바이트</text><text x="400.0" y="142" font-size="17" fill="#0E7490" text-anchor="middle">클라이언트가 보낸 외부 API 버전</text><text x="560" y="203" font-size="18" fill="#27272A" text-anchor="middle">디코딩 · 기본값 적용</text><text x="560" y="231" font-size="18" fill="#27272A" text-anchor="middle">메모리 버전으로 변환</text><rect x="176" y="272" width="448" height="80" rx="12" stroke="#059669" fill="#ECFDF5" stroke-width="1.5"/><text x="400.0" y="306" font-size="21" fill="#047857" text-anchor="middle">메모리 버전</text><text x="400.0" y="334" font-size="17" fill="#047857" text-anchor="middle">기본값은 {그룹, __internal}</text><text x="552" y="395" font-size="18" fill="#27272A" text-anchor="middle">저장 버전으로 변환</text><text x="552" y="423" font-size="18" fill="#27272A" text-anchor="middle">저장 형식으로 인코딩</text><rect x="176" y="464" width="448" height="80" rx="12" stroke="#7C3AED" fill="#F5F3FF" stroke-width="1.5"/><text x="400.0" y="498" font-size="21" fill="#6D28D9" text-anchor="middle">저장 버전 + 저장 바이트</text><text x="400.0" y="526" font-size="17" fill="#6D28D9" text-anchor="middle">etcd에 기록하는 외부 표현</text><text x="400" y="590" font-size="18" fill="#27272A" text-anchor="middle">응답 형식은 저장 형식과 별도로 협상합니다</text></g></svg>