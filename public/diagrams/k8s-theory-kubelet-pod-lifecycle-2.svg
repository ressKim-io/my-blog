<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 736" role="img" aria-labelledby="title desc"><title id="title">Pod 종료와 트래픽 대상 갱신은 병렬입니다</title><desc id="desc">Pod의 deletionTimestamp를 kubelet과 EndpointSlice controller가 각각 관찰한다. kubelet은 preStop 뒤 런타임에 중지를 요청하고, EndpointSlice controller는 terminating과 ready 조건을 갱신한다. kube-proxy는 이후 변경을 받아 노드 규칙을 바꾼다. 양쪽 완료 사이에는 고정된 선후가 없다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#334155"/></marker></defs><rect width="800" height="736" rx="16" fill="#FAFAFA"/><g font-family="Pretendard, Apple SD Gothic Neo, system-ui, sans-serif"><text x="400" y="40" text-anchor="middle" font-size="23" fill="#0A0A0A">Pod 종료와 트래픽 대상 갱신은 병렬입니다</text><path d="M400 176 V216 H216 V272" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><path d="M400 216 H584 V272" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><path d="M216 360 V440" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><path d="M584 360 V440" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><rect x="176" y="88" width="448" height="88" rx="12" stroke="#059669" fill="#ECFDF5" stroke-width="1.5"/><text x="400.0" y="121" text-anchor="middle" font-size="21" fill="#047857">Pod 삭제 상태</text><text x="400.0" y="149" text-anchor="middle" font-size="17" fill="#047857">deletionTimestamp 기록</text><rect x="56" y="272" width="320" height="88" rx="12" stroke="#D97706" fill="#FFFBEB" stroke-width="1.5"/><text x="216.0" y="305" text-anchor="middle" font-size="21" fill="#B45309">kubelet → preStop</text><text x="216.0" y="333" text-anchor="middle" font-size="17" fill="#B45309">훅이 있으면 유예 안에서 실행</text><rect x="424" y="272" width="320" height="88" rx="12" stroke="#059669" fill="#ECFDF5" stroke-width="1.5"/><text x="584.0" y="305" text-anchor="middle" font-size="21" fill="#047857">EndpointSlice controller</text><text x="584.0" y="333" text-anchor="middle" font-size="17" fill="#047857">terminating=true · ready=false</text><rect x="56" y="440" width="320" height="88" rx="12" stroke="#D97706" fill="#FFFBEB" stroke-width="1.5"/><text x="216.0" y="473" text-anchor="middle" font-size="21" fill="#B45309">컨테이너 런타임</text><text x="216.0" y="501" text-anchor="middle" font-size="17" fill="#B45309">중지 신호 → 필요하면 강제 종료</text><rect x="424" y="440" width="320" height="88" rx="12" stroke="#D97706" fill="#FFFBEB" stroke-width="1.5"/><text x="584.0" y="473" text-anchor="middle" font-size="21" fill="#B45309">각 노드의 kube-proxy</text><text x="584.0" y="501" text-anchor="middle" font-size="17" fill="#B45309">변경을 받아 전달 규칙 갱신</text><rect x="62" y="389" width="308" height="26" fill="#FAFAFA"/><rect x="430" y="389" width="308" height="26" fill="#FAFAFA"/><text x="216" y="408" text-anchor="middle" font-size="16" fill="#27272A">남은 유예로 StopContainer 요청</text><text x="584" y="408" text-anchor="middle" font-size="17" fill="#27272A">EndpointSlice 변경 전파</text><text x="400" y="584" text-anchor="middle" font-size="21" fill="#0A0A0A">양쪽 완료 시점에는 고정된 선후가 없습니다</text><text x="400" y="624" text-anchor="middle" font-size="17" fill="#27272A">ready=false: publishNotReadyAddresses=false인 Service 기준</text><text x="400" y="660" text-anchor="middle" font-size="17" fill="#27272A">preStop sleep은 중지 신호를 늦추지만 전파 완료를 보장하지 않습니다</text></g></svg>