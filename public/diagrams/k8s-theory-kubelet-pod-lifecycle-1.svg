<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 704" role="img" aria-labelledby="title desc"><title id="title">kubelet의 입력·동작·상태 보고</title><desc id="desc">Pod 구성·PLEG·probe·주기 이벤트를 syncLoop가 받고 Pod worker가 동기화한다. 런타임에 필요한 작업을 요청하며 관찰 상태는 API 서버에 보고한다. 런타임 상태 변화는 다시 PLEG 관찰 입력이 된다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#334155"/></marker></defs><rect width="800" height="704" rx="16" fill="#FAFAFA"/><g font-family="Pretendard, Apple SD Gothic Neo, system-ui, sans-serif"><text x="400" y="40" text-anchor="middle" font-size="23" fill="#0A0A0A">kubelet의 입력·동작·상태 보고</text><path d="M400 168 V224" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><path d="M400 312 V368" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><path d="M400 456 V488 H208 V536" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><path d="M400 488 H592 V536" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><path d="M48 580 H24 V124 H128" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/><rect x="128" y="80" width="544" height="88" rx="12" stroke="#D97706" fill="#FFFBEB" stroke-width="1.5"/><text x="400.0" y="113" text-anchor="middle" font-size="21" fill="#B45309">구성·관찰·검사·주기 이벤트</text><text x="400.0" y="141" text-anchor="middle" font-size="17" fill="#B45309">config · PLEG · probe · sync 등</text><rect x="128" y="224" width="544" height="88" rx="12" stroke="#D97706" fill="#FFFBEB" stroke-width="1.5"/><text x="400.0" y="257" text-anchor="middle" font-size="21" fill="#B45309">syncLoop → 처리 대상 선택</text><text x="400.0" y="285" text-anchor="middle" font-size="17" fill="#B45309">Pod 변화에 맞는 handler 호출</text><rect x="128" y="368" width="544" height="88" rx="12" stroke="#D97706" fill="#FFFBEB" stroke-width="1.5"/><text x="400.0" y="401" text-anchor="middle" font-size="21" fill="#B45309">Pod worker → 원하는 상태와 비교</text><text x="400.0" y="429" text-anchor="middle" font-size="17" fill="#B45309">Pod별 동기화·종료 작업 수행</text><rect x="48" y="536" width="320" height="88" rx="12" stroke="#D97706" fill="#FFFBEB" stroke-width="1.5"/><text x="208.0" y="569" text-anchor="middle" font-size="21" fill="#B45309">컨테이너 런타임</text><text x="208.0" y="597" text-anchor="middle" font-size="17" fill="#B45309">필요한 시작·중지 요청</text><rect x="432" y="536" width="320" height="88" rx="12" stroke="#059669" fill="#ECFDF5" stroke-width="1.5"/><text x="592.0" y="569" text-anchor="middle" font-size="21" fill="#047857">Pod status 보고</text><text x="592.0" y="597" text-anchor="middle" font-size="17" fill="#047857">관찰한 phase·조건 반영</text><text x="492" y="202" text-anchor="middle" font-size="18" fill="#27272A">이벤트 전달</text><text x="506" y="346" text-anchor="middle" font-size="18" fill="#27272A">Pod별 작업 전달</text><text x="400" y="674" text-anchor="middle" font-size="17" fill="#27272A">점선: 런타임 관찰이 다음 동기화 입력으로 돌아옵니다</text></g></svg>