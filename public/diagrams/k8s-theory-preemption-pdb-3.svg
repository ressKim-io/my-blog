<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 720" role="img" aria-labelledby="title desc"><title id="title">일반 DELETE와 Eviction API의 예산 검사는 다릅니다</title><desc id="desc">일반 preemption DELETE는 Eviction API를 거치지 않아 PDB 예산 검사가 없다. Eviction API의 예산이 필요한 경로에서는 disruptionsAllowed를 검사해 0이면 429로 거절하고, 허용되면 예산을 차감하고 Pod 삭제를 요청한다. PDB 검사 생략과 미준비 Pod의 차감 없는 허용 조건은 본문에서 구분한다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#334155"/></marker></defs><rect width="800" height="720" rx="16" fill="#FAFAFA"/><g font-family="Pretendard, Apple SD Gothic Neo, system-ui, sans-serif"><text x="400" y="40" font-size="23" fill="#0A0A0A" text-anchor="middle">일반 DELETE와 Eviction API의 예산 검사는 다릅니다</text><text x="400" y="80" font-size="17" fill="#27272A" text-anchor="middle">오른쪽은 PDB 예산을 사용하는 요청 경로입니다</text><path d="M 208 192 V 568" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><path d="M 592 192 V 280" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><path d="M 592 368 V 448" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><path d="M 448 324 H 384 V 568" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><rect x="64" y="112" width="288" height="80" rx="12" stroke="#475569" fill="#F8FAFC" stroke-width="1.5"/><text x="208.0" y="144.0" font-size="21" fill="#334155" text-anchor="middle">일반 preemption 삭제</text><text x="208.0" y="172.0" font-size="17" fill="#334155" text-anchor="middle">Pod DELETE</text><rect x="448" y="112" width="288" height="80" rx="12" stroke="#059669" fill="#ECFDF5" stroke-width="1.5"/><text x="592.0" y="144.0" font-size="21" fill="#047857" text-anchor="middle">Eviction API</text><text x="592.0" y="172.0" font-size="17" fill="#047857" text-anchor="middle">POST pods/…/eviction</text><rect x="448" y="280" width="288" height="88" rx="12" stroke="#7C3AED" fill="#F5F3FF" stroke-width="1.5"/><text x="592.0" y="316.0" font-size="21" fill="#6D28D9" text-anchor="middle">예산 검사</text><text x="592.0" y="344.0" font-size="17" fill="#6D28D9" text-anchor="middle">disruptionsAllowed 확인</text><rect x="448" y="448" width="288" height="72" rx="12" stroke="#475569" fill="#F8FAFC" stroke-width="1.5"/><text x="592.0" y="490.0" font-size="21" fill="#334155" text-anchor="middle">429 · 삭제 거절</text><rect x="64" y="568" width="672" height="80" rx="12" stroke="#059669" fill="#ECFDF5" stroke-width="1.5"/><text x="400.0" y="600.0" font-size="21" fill="#047857" text-anchor="middle">Pod 삭제 요청</text><text x="400.0" y="628.0" font-size="17" fill="#047857" text-anchor="middle">삭제 승인과 프로세스 종료는 별도</text><text x="208" y="368" font-size="17" fill="#27272A" text-anchor="middle">PDB 예산 검사 없음</text><text x="656" y="408" font-size="17" fill="#27272A" text-anchor="middle">0이면 거절</text><text x="328" y="456" font-size="17" fill="#27272A" text-anchor="middle">허용·차감</text><text x="400" y="696" font-size="17" fill="#27272A" text-anchor="middle">검사 생략·미준비 Pod의 예외 조건은 본문에서 구분합니다</text></g></svg>