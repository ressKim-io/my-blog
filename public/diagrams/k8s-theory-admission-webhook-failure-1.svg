<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="title desc"><title id="title">변경은 차례로, 원격 검증은 병렬로</title><desc id="desc">Mutating webhook은 변경된 객체를 다음 호출에 전달한다. ValidatingAdmissionWebhook은 최종 객체를 대상으로 매칭된 webhook을 병렬 호출하고 모두 끝날 때까지 기다린다.</desc>
