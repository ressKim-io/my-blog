<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 728" role="img" aria-labelledby="title desc">
  <title id="title">PV 컨트롤러가 바인딩을 반영하는 네 처리 순서</title>
  <desc id="desc">PV 컨트롤러는 먼저 PV claimRef에 PVC 신원을 기록하고 PV 상태를 Bound로 만듭니다. 그 뒤 PVC volumeName과 바인딩 완료 어노테이션을 기록하고 PVC 상태를 Bound로 만듭니다. 각 단계는 별도 쓰기이며 이미 같은 값이면 쓰기를 생략할 수 있습니다</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="none" stroke="#475569" stroke-width="1.5"/></marker></defs>
  <rect width="720" height="728" rx="16" fill="#FAFAFA"/>
  <g font-family="Pretendard, system-ui, sans-serif" text-anchor="middle" fill="#0A0A0A">
    <text x="360" y="48" font-size="29" font-weight="700">공유 자원인 PV의 참조를 먼저 기록합니다</text>
    <g stroke="#475569" stroke-width="2" marker-end="url(#arrow)">
      <path d="M360 192 L360 240"/><path d="M360 352 L360 400"/><path d="M360 512 L360 560"/>
    </g>
    <rect x="48" y="80" width="624" height="112" rx="12" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
    <text x="360" y="122" font-size="29" font-weight="700">1. PV.spec.claimRef</text>
    <text x="360" y="164" font-size="26" fill="#6D28D9">PVC의 이름 · 네임스페이스 · UID</text>
    <rect x="48" y="240" width="624" height="112" rx="12" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
    <text x="360" y="283" font-size="29" font-weight="700">2. PV.status.phase = Bound</text>
    <text x="360" y="325" font-size="26" fill="#6D28D9">PV 쪽 상태 반영</text>
    <rect x="48" y="400" width="624" height="112" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
    <text x="360" y="442" font-size="29" font-weight="700">3. PVC.spec.volumeName</text>
    <text x="360" y="484" font-size="26" fill="#047857">PV 이름 + 바인딩 완료 어노테이션</text>
    <rect x="48" y="560" width="624" height="112" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
    <text x="360" y="602" font-size="29" font-weight="700">4. PVC.status.phase = Bound</text>
    <text x="360" y="644" font-size="26" fill="#047857">PVC 쪽 상태 반영</text>
    <text x="360" y="706" font-size="23" fill="#334155">별도 쓰기 · 중간 실패 후 재처리 · 같은 값은 생략 가능</text>
  </g>
</svg>
