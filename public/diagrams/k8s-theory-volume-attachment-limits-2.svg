<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1360" role="img" aria-labelledby="title desc"><title id="title">고갈 반응은 배치 뒤에 이어집니다</title><desc id="desc">attach 오류의 숫자 코드가 ResourceExhausted인 VolumeAttachment를 kubelet이 볼륨 대기 실패 후 확인한다. 주기 설정과 조회 등 조건이 충족되면 NodeGetInfo 재조회와 CSINode 갱신을 먼저 시도한다. 갱신 실패도 고갈 판정 true를 바꾸지 않으므로 이후 Pod는 Failed로 처리된다. 새 Pod 생성은 워크로드 컨트롤러 정책에 따르며 단독 Pod 자동 대체나 동일 Pod 재배치를 보장하지 않는다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#334155"/></marker></defs><rect width="600" height="1360" rx="16" fill="#FAFAFA"/><g font-family="Pretendard, Apple SD Gothic Neo, system-ui, sans-serif"><text x="300" y="40" font-size="24" fill="#0A0A0A" text-anchor="middle">고갈 반응은 배치 뒤에 이어집니다</text><text x="300" y="88" font-size="21" fill="#27272A" text-anchor="middle">배치 뒤 attach가 실패한 경로</text><path d="M300 240 V352" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><path d="M300 496 V608" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><path d="M300 736 V848" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><path d="M300 992 V1104" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="128" width="520" height="112" rx="12" fill="#FFF1F2" stroke="#E11D48" stroke-width="1.5"/><text x="300.0" y="162" font-size="21" fill="#BE123C" text-anchor="middle">VolumeAttachment</text><text x="300.0" y="192" font-size="21" fill="#27272A" text-anchor="middle">attachError.errorCode = 8</text><rect x="100.0" y="276" width="400" height="28" fill="#FAFAFA"/><text x="300" y="296" font-size="21" fill="#27272A" text-anchor="middle">ResourceExhausted 기록</text><rect x="40" y="352" width="520" height="144" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/><text x="300.0" y="386" font-size="21" fill="#B45309" text-anchor="middle">kubelet · 볼륨 대기 실패 뒤</text><text x="300.0" y="416" font-size="21" fill="#27272A" text-anchor="middle">미부착 볼륨의 조건 확인</text><text x="300.0" y="444" font-size="21" fill="#27272A" text-anchor="middle">주기 설정·API 조회·숫자 코드</text><rect x="100.0" y="532" width="400" height="28" fill="#FAFAFA"/><text x="300" y="552" font-size="21" fill="#27272A" text-anchor="middle">확인 조건이 맞으면</text><rect x="40" y="608" width="520" height="128" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/><text x="300.0" y="642" font-size="21" fill="#047857" text-anchor="middle">드라이버 재조회 · 상한 갱신 시도</text><text x="300.0" y="672" font-size="21" fill="#27272A" text-anchor="middle">NodeGetInfo · CSINode 갱신</text><rect x="60.0" y="772" width="480" height="28" fill="#FAFAFA"/><text x="300" y="792" font-size="21" fill="#27272A" text-anchor="middle">갱신 실패에도 고갈 판정은 true</text><rect x="40" y="848" width="520" height="144" rx="12" fill="#FFF1F2" stroke="#E11D48" stroke-width="1.5"/><text x="300.0" y="882" font-size="21" fill="#BE123C" text-anchor="middle">Pod Failed</text><text x="300.0" y="912" font-size="21" fill="#27272A" text-anchor="middle">reason:</text><text x="300.0" y="940" font-size="21" fill="#27272A" text-anchor="middle">VolumeAttachmentLimitExceeded</text><rect x="80.0" y="1028" width="440" height="28" fill="#FAFAFA"/><text x="300" y="1048" font-size="21" fill="#27272A" text-anchor="middle">대체 여부는 컨트롤러 정책</text><rect x="40" y="1104" width="520" height="112" rx="12" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/><text x="300.0" y="1138" font-size="21" fill="#6D28D9" text-anchor="middle">워크로드 컨트롤러</text><text x="300.0" y="1168" font-size="21" fill="#27272A" text-anchor="middle">정책에 따라 새 Pod 생성</text><text x="300" y="1272" font-size="21" fill="#27272A" text-anchor="middle">같은 Pod를 다른 노드로 옮기지 않습니다</text><text x="300" y="1320" font-size="21" fill="#27272A" text-anchor="middle">단독 Pod에는 자동 대체가 없습니다</text></g></svg>