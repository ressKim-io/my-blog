<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 768" role="img" aria-labelledby="title desc"><title id="title">판정 전에 실제 Lease와 캐시를 비교합니다</title><desc id="desc">v1.37 기본 on인 NodeControllerLeaseCircuitBreaker는 관찰 유예가 지나면 API 서버에서 실제 Lease를 GET한다. resourceVersion이 캐시와 다르면 캐시가 뒤처진 것으로 보고 처리를 멈추며, 같거나 NotFound일 때만 이후 Unknown 판정 경로로 간다. GET 오류가 있으면 판정을 중단한다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#334155"/></marker></defs><rect width="800" height="768" rx="16" fill="#FAFAFA"/><g font-family="Pretendard, Apple SD Gothic Neo, system-ui, sans-serif"><text x="400" y="40" text-anchor="middle" font-size="23" fill="#0A0A0A">판정 전에 실제 Lease와 캐시를 비교합니다</text><path d="M400 176 V232" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M400 320 V376" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M400 464 V504 H216 V568" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M400 504 H584 V568" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="152" y="88" width="496" height="88" rx="12" stroke="#475569" fill="#F8FAFC" stroke-width="1.5"/><text x="400.0" y="122" text-anchor="middle" font-size="21" fill="#334155">컨트롤러의 관찰 시각이 정체됨</text><text x="400.0" y="151" text-anchor="middle" font-size="17" fill="#334155">로컬 now - 마지막 관찰 시각 &gt; 판정 유예</text><rect x="152" y="232" width="496" height="88" rx="12" stroke="#059669" fill="#ECFDF5" stroke-width="1.5"/><text x="400.0" y="266" text-anchor="middle" font-size="21" fill="#047857">API 서버에서 실제 Lease GET</text><text x="400.0" y="295" text-anchor="middle" font-size="17" fill="#047857">기본 on인 Lease circuit breaker</text><rect x="152" y="376" width="496" height="88" rx="12" stroke="#059669" fill="#ECFDF5" stroke-width="1.5"/><text x="400.0" y="410" text-anchor="middle" font-size="21" fill="#047857">실제 resourceVersion과 캐시 대조</text><text x="400.0" y="439" text-anchor="middle" font-size="17" fill="#047857">GET 오류는 판정을 중단하고 오류 처리</text><rect x="56" y="568" width="320" height="88" rx="12" stroke="#E11D48" fill="#FFF1F2" stroke-width="1.5"/><text x="216.0" y="602" text-anchor="middle" font-size="21" fill="#BE123C">다른 resourceVersion</text><text x="216.0" y="631" text-anchor="middle" font-size="17" fill="#BE123C">캐시 반영을 기다리며 중단</text><rect x="424" y="568" width="320" height="88" rx="12" stroke="#059669" fill="#ECFDF5" stroke-width="1.5"/><text x="584.0" y="602" text-anchor="middle" font-size="21" fill="#047857">같음 또는 NotFound</text><text x="584.0" y="631" text-anchor="middle" font-size="17" fill="#047857">이후 Unknown 판정 경로 진행</text><text x="400" y="716" text-anchor="middle" font-size="17" fill="#27272A">이 대조는 캐시 지연을 확인하며 노드의 실제 전원 상태를 증명하지는 않습니다</text></g></svg>