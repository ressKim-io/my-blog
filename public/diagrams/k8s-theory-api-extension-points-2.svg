<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="title desc"><title id="title">정책을 저장하는 것과 실행하는 것은 다릅니다</title><desc id="desc">MutatingAdmissionPolicy 사례다. API 그룹 버전 설정은 저장소 등록을 정하고 feature gate는 플러그인 활성 여부를 정한다. 저장에 성공해도 비활성 플러그인이 mutation을 수행하지는 않는다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/></marker><marker id="rose-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#BE123C"/></marker></defs>
<rect width="800" height="560" rx="16" fill="#FAFAFA"/>
<g font-family="Pretendard, Apple SD Gothic Neo, system-ui, sans-serif">
<text x="32" y="40" font-size="23" fill="#0A0A0A" text-anchor="start">정책을 저장하는 것과 실행하는 것은 다릅니다</text>
<path d="M 216 176 V 240" fill="none" stroke="#334155" stroke-width="2"  marker-end="url(#arrow)"/>
<path d="M 584 176 V 240" fill="none" stroke="#334155" stroke-width="2"  marker-end="url(#arrow)"/>
<path d="M 216 320 V 384" fill="none" stroke="#334155" stroke-width="2"  marker-end="url(#arrow)"/>
<path d="M 584 320 V 384" fill="none" stroke="#334155" stroke-width="2"  marker-end="url(#arrow)"/>
<rect x="40" y="96" width="352" height="80" rx="10" fill="#ECFEFF" stroke="#0891B2" stroke-width="1.5"/><text x="216.0" y="132.0" font-size="19" fill="#0E7490" text-anchor="middle">API 그룹 · 버전 설정</text><text x="216.0" y="158.0" font-size="16" fill="#0E7490" text-anchor="middle">기본 목록 + runtime-config</text>
<rect x="408" y="96" width="352" height="80" rx="10" fill="#ECFEFF" stroke="#0891B2" stroke-width="1.5"/><text x="584.0" y="132.0" font-size="19" fill="#0E7490" text-anchor="middle">feature gate 설정</text><text x="584.0" y="158.0" font-size="16" fill="#0E7490" text-anchor="middle">MutatingAdmissionPolicy</text>
<rect x="40" y="240" width="352" height="80" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/><text x="216.0" y="276.0" font-size="19" fill="#047857" text-anchor="middle">ResourceEnabled 검사</text><text x="216.0" y="302.0" font-size="16" fill="#047857" text-anchor="middle">API 저장소 등록</text>
<rect x="408" y="240" width="352" height="80" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/><text x="584.0" y="276.0" font-size="19" fill="#047857" text-anchor="middle">InspectFeatureGates</text><text x="584.0" y="302.0" font-size="16" fill="#047857" text-anchor="middle">플러그인 활성 여부</text>
<rect x="40" y="384" width="352" height="80" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/><text x="216.0" y="420.0" font-size="19" fill="#6D28D9" text-anchor="middle">정책 객체 요청을 받을 수 있음</text><text x="216.0" y="446.0" font-size="16" fill="#6D28D9" text-anchor="middle">생성 요청은 별도 검증을 거침</text>
<rect x="408" y="384" width="352" height="80" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/><text x="584.0" y="420.0" font-size="19" fill="#047857" text-anchor="middle">매칭한 정책의 mutation 실행</text><text x="584.0" y="446.0" font-size="16" fill="#047857" text-anchor="middle">Policy · Binding 조건도 필요</text>
<text x="400" y="520" font-size="17" fill="#27272A" text-anchor="middle">API를 열고 플러그인을 끄면 정책은 저장해도 실행되지 않습니다</text>
</g></svg>