<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="title desc">
<title id="title">제약의 통과 조건과 선호도</title><desc id="desc">스케줄러는 Pod와 Node 정보를 읽어 필수 조건은 후보 통과 여부로, 선호 조건은 남은 후보의 점수로 해석합니다. 선호 점수가 높아도 필수 조건을 어긴 노드를 선택할 수 없습니다.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#475569"/></marker></defs>
<rect width="800" height="520" rx="16" fill="#FAFAFA"/>
<g font-family="Pretendard, system-ui, sans-serif">
<text x="400" y="43" font-size="22" fill="#0A0A0A" font-weight="700" text-anchor="middle">같은 배치 설정도 통과 여부와 선호도를 나눕니다</text>
<rect x="192" y="80" width="416" height="72" rx="12" fill="#F8FAFC" stroke="#475569" stroke-width="1.5"/>
<text x="400.0" y="122.0" font-size="17" fill="#334155" font-weight="600" text-anchor="middle">Pod의 조건 + Node·기존 Pod 정보</text>
<path d="M400 152 V185 H208 V218" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M400 185 H592 V218" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="48" y="222" width="320" height="86" rx="12" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
<text x="208.0" y="259.0" font-size="17" fill="#6D28D9" font-weight="600" text-anchor="middle">필수 조건</text>
<text x="208.0" y="284.0" font-size="17" fill="#6D28D9" font-weight="600" text-anchor="middle">required · NoSchedule 등</text>
<rect x="432" y="222" width="320" height="86" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
<text x="592.0" y="259.0" font-size="17" fill="#047857" font-weight="600" text-anchor="middle">선호 조건</text>
<text x="592.0" y="284.0" font-size="17" fill="#047857" font-weight="600" text-anchor="middle">preferred · PreferNoSchedule 등</text>
<path d="M208 308 V350" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M592 308 V350" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="48" y="354" width="320" height="86" rx="12" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
<text x="208.0" y="391.0" font-size="17" fill="#6D28D9" font-weight="600" text-anchor="middle">Filter</text>
<text x="208.0" y="416.0" font-size="17" fill="#6D28D9" font-weight="600" text-anchor="middle">배치할 수 없는 노드 제외</text>
<rect x="432" y="354" width="320" height="86" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
<text x="592.0" y="391.0" font-size="17" fill="#047857" font-weight="600" text-anchor="middle">Score</text>
<text x="592.0" y="416.0" font-size="17" fill="#047857" font-weight="600" text-anchor="middle">남은 후보의 점수와 순위</text>
<text x="400" y="489" font-size="15" fill="#475569" font-weight="400" text-anchor="middle">높은 선호 점수로 필수 조건 위반을 상쇄할 수는 없습니다</text>
</g>
</svg>
