<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="title desc">
  <title id="title">API 서버별 watch cache와 저장소 watch 공유</title>
  <desc id="desc">같은 리소스의 etcd 변경을 API 서버 A와 B가 각각 받습니다. 두 서버는 각자의 객체 사본과 최근 이벤트 링버퍼를 유지하고, 그 서버에 연결한 여러 클라이언트에게 변경을 나눠 보냅니다.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
  <rect width="800" height="480" rx="16" fill="#FAFAFA"/>
  <g font-family="'Pretendard', system-ui, sans-serif" fill="#0A0A0A" text-anchor="middle">
    <text x="400" y="36" font-size="20" font-weight="700">같은 리소스도 API 서버마다 캐시를 유지합니다</text>
    <g stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#arrow)" stroke-dasharray="5 3">
      <path d="M200 224H248V156H304"/><path d="M200 224H248V328H304"/>
      <path d="M560 136H616V112H648"/><path d="M560 176H616V208H648"/>
      <path d="M560 328H648"/>
    </g>
    <rect x="24" y="184" width="176" height="80" rx="10" fill="#F5F3FF" stroke="#7C3AED"/>
    <text x="112" y="216" font-size="19" font-weight="700" fill="#6D28D9">etcd</text>
    <text x="112" y="242" font-size="14">객체와 revision 이력</text>
    <rect x="304" y="88" width="256" height="136" rx="10" fill="#ECFDF5" stroke="#059669"/>
    <text x="432" y="116" font-size="17" font-weight="700" fill="#047857">API 서버 A</text>
    <rect x="320" y="132" width="224" height="32" rx="6" fill="#F5F3FF" stroke="#C4B5FD"/>
    <text x="432" y="153" font-size="14">현재 객체 사본</text>
    <rect x="320" y="172" width="224" height="32" rx="6" fill="#F5F3FF" stroke="#C4B5FD"/>
    <text x="432" y="193" font-size="14">최근 이벤트 링버퍼</text>
    <rect x="304" y="260" width="256" height="136" rx="10" fill="#ECFDF5" stroke="#059669"/>
    <text x="432" y="288" font-size="17" font-weight="700" fill="#047857">API 서버 B</text>
    <rect x="320" y="304" width="224" height="32" rx="6" fill="#F5F3FF" stroke="#C4B5FD"/>
    <text x="432" y="325" font-size="14">현재 객체 사본</text>
    <rect x="320" y="344" width="224" height="32" rx="6" fill="#F5F3FF" stroke="#C4B5FD"/>
    <text x="432" y="365" font-size="14">최근 이벤트 링버퍼</text>
    <text x="248" y="122" font-size="13" fill="#475569">저장소 watch</text>
    <text x="248" y="362" font-size="13" fill="#475569">저장소 watch</text>
    <rect x="648" y="88" width="128" height="48" rx="8" fill="#ECFEFF" stroke="#0891B2"/>
    <text x="712" y="118" font-size="15" fill="#0E7490">클라이언트 1</text>
    <rect x="648" y="184" width="128" height="48" rx="8" fill="#ECFEFF" stroke="#0891B2"/>
    <text x="712" y="214" font-size="15" fill="#0E7490">클라이언트 2</text>
    <rect x="648" y="304" width="128" height="48" rx="8" fill="#ECFEFF" stroke="#0891B2"/>
    <text x="712" y="334" font-size="15" fill="#0E7490">클라이언트 3</text>
    <text x="400" y="442" font-size="14" fill="#475569">서버 안에서는 저장소 watch를 공유하지만, 서버 사이에서 캐시 메모리를 공유하지는 않습니다</text>
  </g>
</svg>
