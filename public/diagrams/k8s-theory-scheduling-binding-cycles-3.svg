<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="title desc"><title id="title">앞 Pod의 바인딩과 다음 Pod의 선택이 겹칠 수 있습니다</title><desc id="desc">개념적 시간 관계. Pod A의 직렬 선택과 assume 이후 A의 바인딩이 진행되는 동안 Pod B의 직렬 선택을 시작할 수 있다. B는 A의 자원 요청을 스케줄러 캐시에서 이미 계산한다. 막대 너비는 측정 시간과 비례하지 않는다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#334155"/></marker></defs><rect width="800" height="440" rx="16" fill="#FAFAFA"/><g font-family="Pretendard, Apple SD Gothic Neo, system-ui, sans-serif"><text x="400" y="40" font-size="22" fill="#0A0A0A" text-anchor="middle">앞 Pod의 바인딩과 다음 Pod의 선택이 겹칠 수 있습니다</text><path d="M 120 88 H 744" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><text x="432" y="76" font-size="17" fill="#27272A" text-anchor="middle">개념적 시간 순서</text><path d="M 360 112 V 336" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="5 3"/><text x="64" y="178" font-size="19" fill="#27272A" text-anchor="middle">Pod A</text><text x="64" y="298" font-size="19" fill="#27272A" text-anchor="middle">Pod B</text><rect x="120" y="136" width="240" height="64" rx="12" stroke="#059669" fill="#ECFDF5" stroke-width="1.5"/><text x="240.0" y="174.0" font-size="21" fill="#047857" text-anchor="middle">선택·assume 등</text><rect x="360" y="136" width="376" height="64" rx="12" stroke="#7C3AED" fill="#F5F3FF" stroke-width="1.5"/><text x="548.0" y="174.0" font-size="21" fill="#6D28D9" text-anchor="middle">바인딩 대기·API 기록</text><rect x="360" y="256" width="200" height="64" rx="12" stroke="#059669" fill="#ECFDF5" stroke-width="1.5"/><text x="460.0" y="294.0" font-size="21" fill="#047857" text-anchor="middle">다음 Pod의 선택</text><rect x="560" y="256" width="176" height="64" rx="12" stroke="#7C3AED" fill="#F5F3FF" stroke-width="1.5"/><text x="648.0" y="294.0" font-size="21" fill="#6D28D9" text-anchor="middle">바인딩</text><text x="400" y="376" font-size="18" fill="#27272A" text-anchor="middle">B의 판단에는 A가 사용할 것으로 반영한 자원이 포함됩니다</text><text x="400" y="410" font-size="16" fill="#27272A" text-anchor="middle">막대 너비는 실제 소요 시간이나 지연 비율을 나타내지 않습니다</text></g></svg>