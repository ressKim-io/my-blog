<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 824" role="img" aria-labelledby="title desc"><title id="title">희생자 처리와 요청 Pod의 바인딩은 별개입니다</title><desc id="desc">기본 Pod 단위 DefaultPreemption은 배치 가능한 후보 노드에서 낮은 우선순위 희생자를 찾는다. Permit 대기나 PreBind 중 희생자는 메모리에서 취소할 수 있고, 취소하지 못한 희생자는 일반 DELETE로 제거한다. 높은 우선순위 요청 Pod는 예정 노드를 표시한 채 다음 배치를 기다린다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#334155"/></marker></defs><rect width="800" height="824" rx="16" fill="#FAFAFA"/><g font-family="Pretendard, Apple SD Gothic Neo, system-ui, sans-serif"><text x="400" y="40" font-size="23" fill="#0A0A0A" text-anchor="middle">희생자 처리와 요청 Pod의 바인딩은 별개입니다</text><path d="M 400 184 V 264" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><path d="M 400 344 V 400 H 208 V 448" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><path d="M 400 400 H 592 V 448" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><path d="M 208 536 V 592 H 400 V 656" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><path d="M 592 536 V 592 H 400" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><rect x="176" y="104" width="448" height="80" rx="12" stroke="#059669" fill="#ECFDF5" stroke-width="1.5"/><text x="400.0" y="136.0" font-size="21" fill="#047857" text-anchor="middle">후보 노드 탐색</text><text x="400.0" y="164.0" font-size="17" fill="#047857" text-anchor="middle">Unschedulable 노드에서 스냅샷 검사</text><rect x="176" y="264" width="448" height="80" rx="12" stroke="#7C3AED" fill="#F5F3FF" stroke-width="1.5"/><text x="400.0" y="296.0" font-size="21" fill="#6D28D9" text-anchor="middle">낮은 우선순위 희생자 선택</text><text x="400.0" y="324.0" font-size="17" fill="#6D28D9" text-anchor="middle">PDB 위반을 줄이며 배치 가능성 확인</text><rect x="56" y="448" width="304" height="88" rx="12" stroke="#475569" fill="#F8FAFC" stroke-width="1.5"/><text x="208.0" y="484.0" font-size="21" fill="#334155" text-anchor="middle">메모리 내 바인딩 취소</text><text x="208.0" y="512.0" font-size="17" fill="#334155" text-anchor="middle">Permit 대기 · PreBind 취소 성공</text><rect x="440" y="448" width="304" height="88" rx="12" stroke="#475569" fill="#F8FAFC" stroke-width="1.5"/><text x="592.0" y="484.0" font-size="21" fill="#334155" text-anchor="middle">일반 Pod DELETE</text><text x="592.0" y="512.0" font-size="17" fill="#334155" text-anchor="middle">메모리에서 취소하지 못한 희생자</text><rect x="176" y="656" width="448" height="88" rx="12" stroke="#059669" fill="#ECFDF5" stroke-width="1.5"/><text x="400.0" y="692.0" font-size="21" fill="#047857" text-anchor="middle">요청 Pod의 다음 시도</text><text x="400.0" y="720.0" font-size="17" fill="#047857" text-anchor="middle">예정 노드 표시 · 아직 미바인딩</text><text x="400" y="792" font-size="18" fill="#27272A" text-anchor="middle">희생자 종료와 새 Pod의 바인딩은 별도 진행입니다</text></g></svg>