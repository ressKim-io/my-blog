<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1000" role="img" aria-labelledby="title desc"><title id="title">균형 점수는 Pod 추가 전후의 개선을 비교합니다</title><desc id="desc">CPU allocatable 4와 메모리 allocatable 4Gi를 가진 두 노드를 가정한다. CPU 1과 메모리 512Mi를 요청한 Pod를 추가하면 A의 CPU와 메모리 요청 비율 차이는 25퍼센트포인트에서 12.5로 좁아지고 B는 25에서 37.5로 벌어진다. 따라서 균형 개선을 평가하는 플러그인은 A에 더 높은 점수를 준다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#334155"/></marker></defs><rect width="600" height="1000" rx="16" fill="#FAFAFA"/><g font-family="Pretendard, Apple SD Gothic Neo, system-ui, sans-serif"><text x="300" y="40" font-size="24" fill="#0A0A0A" text-anchor="middle">Pod가 들어오면 균형이 좋아지는가</text><text x="300" y="84" font-size="21" fill="#27272A" text-anchor="middle">가정: 노드별 CPU 4 · 메모리 4Gi</text><text x="300" y="112" font-size="21" fill="#27272A" text-anchor="middle">새 Pod: CPU 1 · 메모리 512Mi</text><rect x="40" y="152" width="520" height="384" rx="12" fill="#F8FAFC" stroke="#475569" stroke-width="1.5"/><text x="300" y="188" font-size="23" fill="#334155" text-anchor="middle">노드 A: 균형 개선</text><rect x="40" y="568" width="520" height="384" rx="12" fill="#F8FAFC" stroke="#475569" stroke-width="1.5"/><text x="300" y="604" font-size="23" fill="#334155" text-anchor="middle">노드 B: 균형 악화</text><text x="64" y="228" font-size="21" fill="#27272A" text-anchor="start">추가 전</text><rect x="160" y="251" width="260" height="22" rx="4" fill="#E4E4E7"/><rect x="160" y="251" width="65.0" height="22" rx="4" fill="#D97706"/><rect x="160" y="291" width="260" height="22" rx="4" fill="#E4E4E7"/><rect x="160" y="291" width="130.0" height="22" rx="4" fill="#7C3AED"/><text font-size="21" fill="#27272A"><tspan x="64" y="268">CPU</tspan><tspan x="440" y="270">25%</tspan><tspan x="64" y="308">메모리</tspan><tspan x="440" y="310">50%</tspan></text><text x="64" y="360" font-size="21" fill="#27272A" text-anchor="start">추가 후</text><rect x="160" y="383" width="260" height="22" rx="4" fill="#E4E4E7"/><rect x="160" y="383" width="130.0" height="22" rx="4" fill="#D97706"/><rect x="160" y="423" width="260" height="22" rx="4" fill="#E4E4E7"/><rect x="160" y="423" width="162.5" height="22" rx="4" fill="#7C3AED"/><text font-size="21" fill="#27272A"><tspan x="64" y="400">CPU</tspan><tspan x="440" y="402">50%</tspan><tspan x="64" y="440">메모리</tspan><tspan x="440" y="442">62.5%</tspan></text><text x="300" y="500" font-size="23" fill="#047857" text-anchor="middle">비율 차이: 25%p → 12.5%p</text><text x="64" y="644" font-size="21" fill="#27272A" text-anchor="start">추가 전</text><rect x="160" y="667" width="260" height="22" rx="4" fill="#E4E4E7"/><rect x="160" y="667" width="130.0" height="22" rx="4" fill="#D97706"/><rect x="160" y="707" width="260" height="22" rx="4" fill="#E4E4E7"/><rect x="160" y="707" width="65.0" height="22" rx="4" fill="#7C3AED"/><text font-size="21" fill="#27272A"><tspan x="64" y="684">CPU</tspan><tspan x="440" y="686">50%</tspan><tspan x="64" y="724">메모리</tspan><tspan x="440" y="726">25%</tspan></text><text x="64" y="776" font-size="21" fill="#27272A" text-anchor="start">추가 후</text><rect x="160" y="799" width="260" height="22" rx="4" fill="#E4E4E7"/><rect x="160" y="799" width="195.0" height="22" rx="4" fill="#D97706"/><rect x="160" y="839" width="260" height="22" rx="4" fill="#E4E4E7"/><rect x="160" y="839" width="97.5" height="22" rx="4" fill="#7C3AED"/><text font-size="21" fill="#27272A"><tspan x="64" y="816">CPU</tspan><tspan x="440" y="818">75%</tspan><tspan x="64" y="856">메모리</tspan><tspan x="440" y="858">37.5%</tspan></text><text x="300" y="916" font-size="23" fill="#B45309" text-anchor="middle">비율 차이: 25%p → 37.5%p</text><text x="300" y="984" font-size="21" fill="#27272A" text-anchor="middle">균형 점수의 비교이며 최종 배치는 아닙니다</text></g></svg>