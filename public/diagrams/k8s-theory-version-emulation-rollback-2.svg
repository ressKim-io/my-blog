<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 784" role="img" aria-labelledby="title desc"><title id="title">저장 버전은 두 차례 탐색합니다</title><desc id="desc">Kubernetes v1.37.1 기본 저장 버전 선택. 우선순위 목록에서 min compat 이하에 도입된 비 Alpha 버전을 먼저 찾고, 없으면 emulated 이하 버전을 Alpha까지 포함해 다시 찾는다. 두 탐색 모두 내부 버전을 제외하며, 실패하면 바이너리 기준 버전을 반환한다. 리소스별 override는 이 탐색보다 우선한다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#334155"/></marker></defs><rect width="800" height="784" rx="16" fill="#FAFAFA"/><g font-family="Pretendard, Apple SD Gothic Neo, system-ui, sans-serif"><text x="400" y="40" font-size="24" fill="#0A0A0A" text-anchor="middle">저장 버전은 두 차례 탐색합니다</text><text x="400" y="72" font-size="17" fill="#27272A" text-anchor="middle">v1.37.1 · 리소스별 override가 없는 기본 경로</text><path d="M 280 176 V 240" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><path d="M 280 336 V 432" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><path d="M 280 528 V 624" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><path d="M 472 288 H 552" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><path d="M 472 480 H 552" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><rect x="88" y="112" width="384" height="64" rx="12" stroke="#475569" fill="#F8FAFC" stroke-width="1.5"/><text x="280.0" y="150.0" font-size="21" fill="#334155" text-anchor="middle">Kind의 버전 목록 · 우선순위 순</text><rect x="88" y="240" width="384" height="96" rx="12" stroke="#7C3AED" fill="#F5F3FF" stroke-width="1.5"/><text x="280.0" y="280.0" font-size="21" fill="#6D28D9" text-anchor="middle">1차 · 롤백 호환 후보</text><text x="280.0" y="308.0" font-size="17" fill="#6D28D9" text-anchor="middle">비 Alpha · 도입 버전 ≤ min compat</text><rect x="88" y="432" width="384" height="96" rx="12" stroke="#059669" fill="#ECFDF5" stroke-width="1.5"/><text x="280.0" y="472.0" font-size="21" fill="#047857" text-anchor="middle">2차 · 현재 동작의 후보</text><text x="280.0" y="500.0" font-size="17" fill="#047857" text-anchor="middle">Alpha 포함 · 도입 버전 ≤ emulated</text><rect x="88" y="624" width="384" height="72" rx="12" stroke="#475569" fill="#F8FAFC" stroke-width="1.5"/><text x="280.0" y="666.0" font-size="21" fill="#334155" text-anchor="middle">바이너리 기준 버전 반환</text><rect x="552" y="248" width="192" height="80" rx="12" stroke="#7C3AED" fill="#F5F3FF" stroke-width="1.5"/><text x="648.0" y="280.0" font-size="21" fill="#6D28D9" text-anchor="middle">첫 후보 선택</text><text x="648.0" y="308.0" font-size="17" fill="#6D28D9" text-anchor="middle">탐색 종료</text><rect x="552" y="440" width="192" height="80" rx="12" stroke="#059669" fill="#ECFDF5" stroke-width="1.5"/><text x="648.0" y="472.0" font-size="21" fill="#047857" text-anchor="middle">첫 후보 선택</text><text x="648.0" y="500.0" font-size="17" fill="#047857" text-anchor="middle">탐색 종료</text><text x="504" y="272" font-size="16" fill="#27272A" text-anchor="middle">있음</text><text x="504" y="464" font-size="16" fill="#27272A" text-anchor="middle">있음</text><text x="336" y="388" font-size="17" fill="#27272A" text-anchor="middle">후보 없음</text><text x="336" y="580" font-size="17" fill="#27272A" text-anchor="middle">후보 없음</text></g></svg>