<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 872" role="img" aria-labelledby="title desc"><title id="title">정상 해제는 Pod target부터</title><desc id="desc">지원하는 단계와 한 볼륨-노드 쌍을 기준으로 정상 해제 순서를 보여 준다. 각 Pod target의 NodeUnpublishVolume이 모두 성공한 뒤 선택적인 NodeUnstageVolume으로 노드 staging target을 해제한다. 노드의 사용 해제를 확인한 뒤 선택적인 ControllerUnpublishVolume으로 볼륨-노드 연결을 해제한다. 강제 분리는 별도의 상태와 복구 조건을 따르며 이 정상 순서의 완료를 보장하지 않는다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#334155"/></marker></defs><rect width="600" height="872" rx="16" fill="#FAFAFA"/><g font-family="Pretendard, Apple SD Gothic Neo, system-ui, sans-serif"><text x="300" y="40" font-size="24" fill="#0A0A0A" text-anchor="middle">정상 해제는 Pod target부터</text><text x="300" y="88" font-size="21" fill="#27272A" text-anchor="middle">지원하는 단계 · 한 볼륨과 노드 기준</text><path d="M300 240 V368" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><path d="M300 480 V608" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="128" width="520" height="112" rx="12" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/><text x="300.0" y="162" font-size="21" fill="#6D28D9" text-anchor="middle">NodeUnpublishVolume</text><text x="300.0" y="192" font-size="21" fill="#27272A" text-anchor="middle">각 Pod target의 사용 해제</text><rect x="80.0" y="284" width="440" height="28" fill="#FAFAFA"/><text x="300" y="304" font-size="21" fill="#27272A" text-anchor="middle">모든 target 해제가 성공한 뒤</text><rect x="40" y="368" width="520" height="112" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/><text x="300.0" y="402" font-size="21" fill="#047857" text-anchor="middle">NodeUnstageVolume</text><text x="300.0" y="432" font-size="21" fill="#27272A" text-anchor="middle">노드 staging target 해제 · 선택적</text><rect x="70.0" y="524" width="460" height="28" fill="#FAFAFA"/><text x="300" y="544" font-size="21" fill="#27272A" text-anchor="middle">노드의 사용 해제를 확인한 뒤</text><rect x="40" y="608" width="520" height="112" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/><text x="300.0" y="642" font-size="21" fill="#B45309" text-anchor="middle">ControllerUnpublishVolume</text><text x="300.0" y="672" font-size="21" fill="#27272A" text-anchor="middle">볼륨-노드 연결 해제 · 선택적</text><text x="300" y="784" font-size="21" fill="#27272A" text-anchor="middle">정상 해제 순서입니다</text><text x="300" y="832" font-size="21" fill="#27272A" text-anchor="middle">강제 분리는 별도 조건을 따릅니다</text></g></svg>