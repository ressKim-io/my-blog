<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1100" role="img" aria-labelledby="title desc"><title id="title">집계 API의 요청과 신원 전달</title><desc id="desc">사용자가 kube-apiserver에 요청하면 먼저 사용자 인증과 인가를 거친다. 프록시는 사용자 신원 헤더를 다시 구성하고 TLS 연결로 확장 서버에 요청한다. kube-apiserver는 확장 서버 인증서를 검증하고 확장 서버는 신뢰한 프록시 인증서를 확인한다. 확장 서버는 헤더의 원래 사용자에게 작업 권한이 있는지 확인하며 표준 위임 구성에서는 필요할 때 SubjectAccessReview를 사용한다. 위임 인가에는 캐시와 예외가 있어 매번 새 호출이 발생하는 것은 아니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#334155"/></marker></defs><rect width="600" height="1100" rx="16" fill="#FAFAFA"/><g font-family="Pretendard, Apple SD Gothic Neo, system-ui, sans-serif"><text x="300" y="44" font-size="24" fill="#0A0A0A" text-anchor="middle">같은 API 주소 뒤에 별도 서버가 있습니다</text><rect x="40" y="100" width="520" height="104" rx="12" fill="#F8FAFC" stroke="#475569" stroke-width="1.5"/><text x="300.0" y="134" font-size="21" fill="#334155" text-anchor="middle">사용자</text><text x="300.0" y="164" font-size="21" fill="#27272A" text-anchor="middle">Kubernetes API 주소로 요청</text><path d="M300 204 V292" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><rect x="80.0" y="236" width="440" height="28" fill="#FAFAFA"/><text x="300" y="256" font-size="21" fill="#27272A" text-anchor="middle">기존 클러스터 인증·인가</text><rect x="40" y="292" width="520" height="132" rx="12" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/><text x="300.0" y="326" font-size="21" fill="#6D28D9" text-anchor="middle">kube-apiserver · 프록시</text><text x="300.0" y="356" font-size="21" fill="#27272A" text-anchor="middle">원래 사용자의 신원 헤더를 구성</text><text x="300.0" y="384" font-size="21" fill="#27272A" text-anchor="middle">프록시 클라이언트 인증서로 접속</text><path d="M300 424 V588" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><rect x="50.0" y="460" width="500" height="28" fill="#FAFAFA"/><text x="300" y="480" font-size="21" fill="#27272A" text-anchor="middle">서버 인증서와 프록시 인증서를</text><rect x="50.0" y="496" width="500" height="28" fill="#FAFAFA"/><text x="300" y="516" font-size="21" fill="#27272A" text-anchor="middle">각 방향에서 검증하는 TLS 연결</text><rect x="40" y="588" width="520" height="160" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/><text x="300.0" y="622" font-size="21" fill="#B45309" text-anchor="middle">확장 API 서버</text><text x="300.0" y="652" font-size="21" fill="#27272A" text-anchor="middle">신뢰한 프록시의 신원 헤더를 읽기</text><text x="300.0" y="680" font-size="21" fill="#27272A" text-anchor="middle">원래 사용자의 작업 권한 확인</text><text x="300.0" y="708" font-size="21" fill="#27272A" text-anchor="middle">표준 위임 구성: 필요할 때 SAR</text><path d="M300 748 V864" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><rect x="50.0" y="788" width="500" height="28" fill="#FAFAFA"/><text x="300" y="808" font-size="21" fill="#27272A" text-anchor="middle">위임 인가에는 캐시·예외가 있음</text><rect x="40" y="864" width="520" height="132" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/><text x="300.0" y="898" font-size="21" fill="#047857" text-anchor="middle">확장 API의 처리와 응답</text><text x="300.0" y="928" font-size="21" fill="#27272A" text-anchor="middle">자체 구현으로 자원을 읽고 처리</text><text x="300.0" y="956" font-size="21" fill="#27272A" text-anchor="middle">저장 방식도 서버가 선택</text><text x="300" y="1056" font-size="21" fill="#27272A" text-anchor="middle">APIService 등록만으로 구현되지는 않습니다</text></g></svg>