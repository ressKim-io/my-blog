<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680" role="img" aria-labelledby="title-1 desc-1">
<title id="title-1">APF의 분류와 실행 배정</title>
<desc id="desc-1">FlowSchema는 신원과 요청 속성으로 수준을 고르고, 그 수준의 설정과 요청 폭 추정에 따라 실행·대기·거절을 결정합니다. Queue의 길이·시간 조건과 Exempt 예외는 본문에서 설명합니다.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#475569"/></marker></defs>
<rect width="800" height="680" rx="16" fill="#FAFAFA"/>
<g font-family="Pretendard, system-ui, sans-serif" fill="#0A0A0A">
<text x="40" y="44" font-size="23" text-anchor="start" fill="#0A0A0A" font-weight="700"><tspan x="40" dy="0">요청을 분류한 뒤 필요한 자리를 배정합니다</tspan></text>
<rect x="240" y="80" width="320" height="64" rx="12" fill="#F8FAFC" stroke="#475569" stroke-width="1.5"/>
<text x="400.0" y="118.0" font-size="16" text-anchor="middle" fill="#334155" font-weight="600"><tspan x="400.0" dy="0">신원 · 동작 · 요청 대상</tspan></text>
<path d="M400 144 V180" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="240" y="184" width="320" height="72" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
<text x="400.0" y="215.0" font-size="16" text-anchor="middle" fill="#047857" font-weight="600"><tspan x="400.0" dy="0">FlowSchema</tspan><tspan x="400.0" dy="23">순서대로 검사한 첫 매치</tspan></text>
<path d="M400 256 V292" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="240" y="296" width="320" height="76" rx="12" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
<text x="400.0" y="329.0" font-size="16" text-anchor="middle" fill="#6D28D9" font-weight="600"><tspan x="400.0" dy="0">PriorityLevelConfiguration</tspan><tspan x="400.0" dy="23">자리 몫 · 차용 · 큐 정책</tspan></text>
<path d="M400 372 V408" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="240" y="412" width="320" height="76" rx="12" fill="#F8FAFC" stroke="#475569" stroke-width="1.5"/>
<text x="400.0" y="445.0" font-size="16" text-anchor="middle" fill="#334155" font-weight="600"><tspan x="400.0" dy="0">요청 폭 추정</tspan><tspan x="400.0" dy="23">LIST 크기 · watcher 수 등</tspan></text>
<path d="M400 488 V520 H160 V556" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M400 488 V556" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M400 520 H640 V556" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="48" y="560" width="224" height="72" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
<text x="160.0" y="591.0" font-size="16" text-anchor="middle" fill="#047857" font-weight="600"><tspan x="160.0" dy="0">실행</tspan><tspan x="160.0" dy="23">현재 자리를 배정</tspan></text>
<rect x="288" y="560" width="224" height="72" rx="12" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
<text x="400.0" y="591.0" font-size="16" text-anchor="middle" fill="#6D28D9" font-weight="600"><tspan x="400.0" dy="0">대기</tspan><tspan x="400.0" dy="23">Queue 정책과 조건</tspan></text>
<rect x="528" y="560" width="224" height="72" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
<text x="640.0" y="591.0" font-size="16" text-anchor="middle" fill="#B45309" font-weight="600"><tspan x="640.0" dy="0">429 거절</tspan><tspan x="640.0" dy="23">Reject · 길이 · 시간</tspan></text>
<text x="400" y="662" font-size="14" text-anchor="middle" fill="#475569" font-weight="400"><tspan x="400" dy="0">Exempt는 동시성 제한 없이 실행합니다</tspan></text>
</g>
</svg>
